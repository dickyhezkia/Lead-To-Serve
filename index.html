<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead To Serve 1</title>
<meta name="description" content="Asesmen pribadi jemaat — Strength, Experience, Relationship, Vision, Expansion (Serve Road Map).">
<link rel="apple-touch-icon" href="./icon-192.png?v=1">
<meta name="theme-color" content="#241F30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lead To Serve">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;600;700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px; }

  :root {
    --paper:#F6F3F9; --surface:#FFFFFF; --surface-2:#EFE9F5;
    --ink:#2A2438; --ink-soft:#5D5470; --ink-faint:#8B819C;
    --line:#E3DCEE; --line-strong:#D0C4E3;
    --accent:#4B3F72; --accent-ink:#372E54;
    --good:#4C7A54; --warn:#B4822F; --bad:#B2433A; --badge:#B2433A;
    --canvas:#241F30;
    --shadow: 0 1px 2px rgba(40,30,60,.06), 0 8px 24px rgba(40,30,60,.08);
    --r-sm:10px; --r-md:16px; --r-lg:24px;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Karla", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1B1723; --surface:#241F30; --surface-2:#2D2739;
      --ink:#EDE8F5; --ink-soft:#C4BBD6; --ink-faint:#8F84A3;
      --line:#332C42; --line-strong:#443A57;
      --accent:#B0A3E8; --accent-ink:#D3C9F5;
      --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
      --canvas:#0F0D15;
    }
  }
  :root[data-theme="dark"] {
    --paper:#1B1723; --surface:#241F30; --surface-2:#2D2739;
    --ink:#EDE8F5; --ink-soft:#C4BBD6; --ink-faint:#8F84A3;
    --line:#332C42; --line-strong:#443A57;
    --accent:#B0A3E8; --accent-ink:#D3C9F5;
    --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
    --canvas:#0F0D15;
  }

  body {
    font-family: var(--font-body); font-weight: 500;
    background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 16px 56px; }
  .masthead { text-align: center; max-width: 560px; color: #F1ECFA; }
  .masthead .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #C9B8F0; }
  .masthead h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -.01em; margin: 4px 0 6px; color: #fff; }
  .masthead p { margin: 0; color: rgba(241,236,250,.82); font-size: 14px; line-height: 1.5; }

  .phone { position: relative; width: 390px; height: 844px; background: var(--paper); border-radius: 46px; box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.07); padding: 10px; flex: none; }
  @media (min-width: 640px) { .phone { width: clamp(390px, 40vw, 520px); height: clamp(760px, 88vh, 980px); } }
  .screen-frame { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; isolation: isolate; }
  @media (max-width: 480px) {
    html { height: 100%; height: 100dvh; }
    body { position: fixed; top: 0; left: 0; right: 0; overflow: hidden; height: 100%; height: 100dvh; height: var(--app-h, 100dvh); }
    .stage { padding: 0; gap: 0; min-height: 0; height: 100%; }
    .masthead { display: none; }
    .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
    .screen-frame { border-radius: 0; height: 100%; }
  }

  .appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 12px calc(18px + env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); }
  .appbar__back { border: none; background: none; padding: 6px; margin: -6px 0 -6px -6px; color: var(--ink); cursor: pointer; border-radius: 8px; display: none; }
  .appbar[data-back="true"] .appbar__back { display: inline-flex; }
  .appbar__logo { flex: none; height: 26px; width: 26px; object-fit: contain; border-radius: 7px; }
  .appbar__title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rolepill { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

  .identitybar { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 16px 9px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .identitybar .ib-ava { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 12px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }
  .identitybar .ib-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .identitybar .ib-name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--accent-ink); }

  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll.has-tabbar { padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
  .page { padding: 18px 18px 28px; display: none; }
  .page.active { display: block; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 2px 10px; }
  h2.section:first-child { margin-top: 4px; }
  .divider-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 14px; }
  .sub { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .muted { color: var(--ink-faint); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
  .card.pad { padding: 16px; }
  .card.pad.sm { padding: 12px; }

  .btn { -webkit-appearance: none; appearance: none; font-family: var(--font-body); font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn--sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; font-family: var(--font-body); font-size: 14.5px; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .field textarea { min-height: 70px; resize: vertical; }
  .err { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 10px; min-height: 1em; }

  .tabbar { position: absolute; z-index: 20; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); border-radius: 22px; background: color-mix(in srgb, var(--paper) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); box-shadow: 0 10px 30px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.28); padding: 7px 6px 8px; }
  .tab { position: relative; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 2px; color: var(--ink-faint); font-family: var(--font-body); font-size: 9.5px; font-weight: 700; border-radius: 14px; min-height: 42px; }
  .tab .ico { display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab[aria-current="page"] .ico { background: var(--accent); }
  .tab[aria-current="page"] .ico svg { stroke: var(--paper); }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag--done { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
  .tag--todo { background: var(--surface-2); color: var(--ink-faint); }

  .avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 13px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }

  .login { max-width: 340px; margin: 0 auto; padding: 30px 22px; }
  .login .brandmark { text-align: center; margin-bottom: 22px; }
  .login .brandmark img { width: 56px; height: 56px; object-fit: contain; margin: 0 auto 10px; display: block; }
  .login .brandmark .churchname { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .login h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 4px; text-align: center; }
  .login p.sub { text-align: center; margin: 0 0 18px; }

  /* 2026-09-22 (kerangka S-E-R-V-E): ubin bulat "3D" gradient, pola visual
     SAMA prinsipnya dgn .cat-chip di JB3 HOME Tracker (dot warna beda tiap
     huruf) — supaya begitu tool-nya dibangun nanti, tinggal tempel di
     dalam kartu yg SUDAH ada, bukan rombak ulang tampilan. */
  .serve-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .serve-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px 10px; cursor: pointer; font-family: var(--font-body); }
  .serve-tile .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-size: 19px; font-weight: 600; color: #fff; background: linear-gradient(150deg, var(--dot), color-mix(in srgb, var(--dot) 70%, #000)); }
  .serve-tile b { font-family: var(--font-display); font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .serve-tile .sub { font-size: 10px; }
  .empty { text-align: center; padding: 30px 14px; color: var(--ink-faint); font-size: 13px; }
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <div class="eyebrow">Gereja JB3</div>
    <h1>Lead To Serve 1</h1>
    <p>Asesmen pribadi — kenali kekuatan, karunia, dan panggilanmu untuk melayani.</p>
  </div>
  <div class="phone">
    <div class="screen-frame">
      <header class="appbar hidden" id="appbar" data-back="false">
        <button class="appbar__back" id="backBtn" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <img class="appbar__logo" src="./logo-mark.png" alt="JB3 Church">
        <div class="appbar__title" id="appbarTitle">Lead To Serve 1</div>
        <button class="rolepill" id="rolePill">Keluar</button>
      </header>
      <div class="identitybar hidden" id="identityBar"></div>
      <div id="app">
        <div class="scroll has-tabbar">
          <section class="page" data-page="login"><div id="loginBody"></div></section>
          <section class="page" data-page="home"><div id="homeBody"></div></section>
          <section class="page" data-page="strength"><div id="strengthBody"></div></section>
          <section class="page" data-page="experience"><div id="experienceBody"></div></section>
          <section class="page" data-page="relationship"><div id="relationshipBody"></div></section>
          <section class="page" data-page="vision"><div id="visionBody"></div></section>
          <section class="page" data-page="expansion"><div id="expansionBody"></div></section>
          <section class="page" data-page="hasil"><div id="hasilBody"></div></section>
          <section class="page" data-page="requests"><div id="requestsBody"></div></section>
          <section class="page" data-page="profile"><div id="profileBody"></div></section>
        </div>
      </div>
      <nav class="tabbar hidden" id="tabbar"></nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./common.js"></script>
<script src="./db.js"></script>
<script>
(function () {
  "use strict";
  const { esc } = window.LTS;
  const el = id => document.getElementById(id);
  const $ = s => document.querySelector(s);

  if (!window.LTS_CONFIG || !window.supabase) {
    document.getElementById("app").innerHTML = '<div class="empty">Gagal memuat. Cek config.js / koneksi internet.</div>';
    return;
  }
  const sb = window.supabase.createClient(window.LTS_CONFIG.url, window.LTS_CONFIG.anonKey);
  const DB = window.makeDB(sb);

  // 2026-09-22 (kerangka S-E-R-V-E, "isian toolnya nanti saja"): state
  // disederhanakan besar2an — cuma yg dibutuhkan utk login + navigasi ke
  // 5 pilihan (Strength/Experience/Relationship/Vision/Expansion). Belum
  // ada data instrumen sama sekali (disc/ssd/gifts/roadmap results) — itu
  // tahap berikutnya, sengaja tak dipasang dulu spy tak ada jalur yg
  // "setengah jadi" & bisa error kalau diketuk.
  const state = { page:"login", stack:[], persona:null, meId:null, myProfile:null, accessStatus:null, pendingRequests:[] };
  const NOCHROME = ["login"];

  function initials(name) { return String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?"; }
  function toast(msg) {
    let t = el("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast";
      t.style.cssText = "position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:86%;text-align:center;";
      $(".screen-frame").appendChild(t);
    }
    t.textContent = msg; t.style.opacity = "1";
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = "0"; }, 2200);
  }

  // 2026-09-22 (permintaan user, "tombol assesment yang terkunci dan hanya
  // bisa dibuka dengan request ke admin"): Admin dapat tab tambahan
  // "Permintaan" (daftar permintaan akses yg menunggu keputusan).
  const TABS = {
    PESERTA: [{ p:"home", l:"Serve Road Map" }, { p:"profile", l:"Profil" }],
    ADMIN: [{ p:"home", l:"Serve Road Map" }, { p:"requests", l:"Permintaan" }, { p:"profile", l:"Profil" }],
  };
  // 2026-09-22: S.E.R.V.E — akronim dari 5 bagian Serve Road Map (Strength/
  // Experience/Relationship/Vision/Expansion), lihat sumber/roadmap-fields.json
  // & catatan di common.js (ROADMAP_SECTIONS) utk isi lengkap tiap bagian
  // saat nanti dibangun ("isian toolnya nanti saja" — instruksi user).
  const SERVE_SECTIONS = [
    { key:"strength", letter:"S", title:"Strength", desc:"Bisa & suka", dot:"#B5623B" },
    { key:"experience", letter:"E", title:"Experience", desc:"Titik tertinggi & terendah", dot:"#5F7F5A" },
    { key:"relationship", letter:"R", title:"Relationship", desc:"Mentor · buddy · mentee", dot:"#B4822F" },
    { key:"vision", letter:"V", title:"Vision", desc:"Holy discontent & panggilan", dot:"#4472A8" },
    { key:"expansion", letter:"E", title:"Expansion", desc:"Rencana aksi 3-6 bulan", dot:"#93683F" },
  ];
  const META = {
    home: { h:"Lead To Serve 1", tab:"home" },
    strength: { h:"Strength", back:true },
    experience: { h:"Experience", back:true },
    relationship: { h:"Relationship", back:true },
    vision: { h:"Vision", back:true },
    expansion: { h:"Expansion", back:true },
    hasil: { h:"Hasil Asesmen", back:true },
    requests: { h:"Permintaan Akses", tab:"requests" },
    profile: { h:"Profil Saya", tab:"profile" },
  };

  function show(page, opts) {
    opts = opts || {};
    const prev = state.page;
    if (!opts.replace && prev !== page && !NOCHROME.includes(prev) && !NOCHROME.includes(page)) state.stack.push(prev);
    state.page = page;
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.dataset.page === page));
    renderChrome();
    RENDER[page] && RENDER[page]();
  }
  function goBack() { const p = state.stack.pop(); show(p || "home", { replace:true }); }

  function renderChrome() {
    const chromeOn = state.persona && !NOCHROME.includes(state.page);
    el("appbar").classList.toggle("hidden", !chromeOn);
    el("identityBar").classList.toggle("hidden", !chromeOn);
    el("tabbar").classList.toggle("hidden", !chromeOn);
    if (!chromeOn) return;
    const meta = META[state.page] || {};
    el("appbar").setAttribute("data-back", meta.back ? "true" : "false");
    el("appbarTitle").textContent = meta.h || "Lead To Serve 1";
    const idb = el("identityBar");
    idb.innerHTML = `<span class="ib-ava">${esc(initials(state.myProfile && state.myProfile.name))}</span>
      <span class="ib-main"><span class="ib-name">${esc((state.myProfile || {}).name || "")}</span>
      <span class="identity-badge">${state.persona === "ADMIN" ? "Admin" : "Peserta"}</span></span>`;
    const tabs = TABS[state.persona] || TABS.PESERTA;
    el("tabbar").innerHTML = tabs.map(t => `<button class="tab" data-goto="${t.p}" ${meta.tab === t.p ? 'aria-current="page"' : ""}>
      <span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg></span>
      <span class="lbl">${t.l}</span></button>`).join("");
  }

  /* ---------------- RENDER ---------------- */
  const RENDER = {};

  RENDER.login = function () {
    el("loginBody").innerHTML = `
      <div class="login">
        <div class="brandmark"><img src="./logo-mark.png" alt="JB3 Church"><div class="churchname">JB3 Church</div></div>
        <h2>Lead To Serve 1</h2>
        <p class="sub muted">Masuk pakai akun JB3 HOME Tracker Anda</p>
        <div class="field"><label>No. HP atau Nama</label><input id="liId" type="text" placeholder="08123456789 atau nama"></div>
        <div class="field"><label>Kata Sandi</label><input id="liPw" type="password" placeholder="Kata sandi"></div>
        <button class="btn btn--primary" id="liGo">Masuk</button>
        <div class="err" id="liErr"></div>
      </div>`;
  };

  // 2026-09-22 (kerangka S-E-R-V-E): ubin bulat, 1 tiap bagian Serve Road
  // Map — ketuk salah satu → halaman placeholder ("Segera hadir"), isian
  // sesungguhnya (form + simpan ke database) menyusul di tahap berikutnya.
  // 2026-09-22 susulan (permintaan user, "tambahkan juga tombol pembacaan
  // hasil dari assesment... kepribadian, keahlian, pekerjaan yang tepat,
  // apa yang harus diperbaiki"): kartu terpisah (BUKAN salah satu ubin
  // S-E-R-V-E, krn ini MEMBACA gabungan semua isian, bukan MENGISI 1
  // bagian) → halaman "Hasil Asesmen", placeholder dulu spt ubin lainnya.
  const SERVE_GRID_HTML = `
      <div class="serve-grid">
        ${SERVE_SECTIONS.map(s => `<button type="button" class="serve-tile" style="--dot:${s.dot};" data-goto="${s.key}">
          <span class="ic">${esc(s.letter)}</span>
          <b>${esc(s.title)}</b>
          <span class="sub muted">${esc(s.desc)}</span>
        </button>`).join("")}
      </div>
      <button type="button" class="card pad" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin-top:12px;cursor:pointer;" data-goto="hasil">
        <span style="flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));">📊</span>
        <span style="flex:1;min-width:0;">
          <b style="font-family:var(--font-display);font-size:14px;display:block;">Hasil Asesmen</b>
          <span class="sub" style="margin-top:2px;display:block;">Kepribadian, keahlian, pekerjaan yang tepat & yang perlu diperbaiki</span>
        </span>
      </button>`;
  // 2026-09-22 (permintaan user, "tombol assesment yang terkunci dan hanya
  // bisa dibuka dengan request ke admin"): utk PESERTA, S-E-R-V-E + Hasil
  // Asesmen baru tampil setelah accessStatus==="approved" — sebelum itu,
  // tampilan terkunci + tombol "Ajukan Akses" (atau pesan menunggu/ditolak).
  // Admin TIDAK digerbang (langsung lihat semuanya + kelola Permintaan).
  function lockedHomeHTML() {
    const st = state.accessStatus;
    if (st === "pending") return `<div class="card pad" style="text-align:center;padding:40px 20px;">
      <div style="font-size:34px;margin-bottom:8px;">⏳</div>
      <b style="display:block;font-family:var(--font-display);font-size:16px;margin-bottom:6px;">Menunggu Persetujuan</b>
      <p class="sub" style="margin:0;">Permintaan aksesmu sudah terkirim ke Admin — akan terbuka begitu disetujui.</p>
    </div>`;
    if (st === "rejected") return `<div class="card pad" style="text-align:center;padding:40px 20px;">
      <div style="font-size:34px;margin-bottom:8px;">🔒</div>
      <b style="display:block;font-family:var(--font-display);font-size:16px;margin-bottom:6px;">Permintaan Belum Disetujui</b>
      <p class="sub" style="margin:0 0 14px;">Hubungi Admin/gembala untuk info lebih lanjut, atau ajukan lagi.</p>
      <button type="button" class="btn btn--primary" id="reqAccessBtn">Ajukan Lagi</button>
    </div>`;
    return `<div class="card pad" style="text-align:center;padding:40px 20px;">
      <div style="font-size:34px;margin-bottom:8px;">🔒</div>
      <b style="display:block;font-family:var(--font-display);font-size:16px;margin-bottom:6px;">Asesmen Terkunci</b>
      <p class="sub" style="margin:0 0 14px;">Ajukan permintaan ke Admin untuk mulai mengisi Serve Road Map.</p>
      <button type="button" class="btn btn--primary" id="reqAccessBtn">Ajukan Akses</button>
    </div>`;
  }
  RENDER.home = function () {
    el("homeBody").innerHTML = `
      <div class="divider-note">Serve Road Map — 5 bagian refleksi yang menggabungkan kekuatan, pengalaman, relasi, visi, dan rencana pelayananmu jadi satu peta pribadi. Diperbarui setiap tahun.</div>
      ${state.persona === "ADMIN" || state.accessStatus === "approved" ? SERVE_GRID_HTML : lockedHomeHTML()}
    `;
  };

  // ---- Permintaan Akses (Admin) ----
  RENDER.requests = function () {
    const rows = state.pendingRequests;
    el("requestsBody").innerHTML = `
      <div class="divider-note">${rows.length} permintaan menunggu keputusan.</div>
      ${rows.length ? rows.map(r => `<div class="card pad" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span class="avatar">${esc(initials((r.profile || {}).name))}</span>
        <span style="flex:1;min-width:0;"><b style="font-size:13px;">${esc((r.profile || {}).name || "?")}</b><div class="sub">${esc((r.profile || {}).phone || "")}</div></span>
        <button type="button" class="btn btn--sm btn--ghost" style="color:var(--bad);border-color:var(--bad);" data-rejreq="${esc(r.id)}">Tolak</button>
        <button type="button" class="btn btn--sm btn--primary" data-appreq="${esc(r.id)}">Setujui</button>
      </div>`).join("") : `<div class="empty">Tidak ada permintaan yang menunggu.</div>`}
    `;
  };

  function placeholderPage(bodyId, title) {
    el(bodyId).innerHTML = `<div class="card pad" style="text-align:center;padding:40px 20px;">
      <b style="display:block;font-family:var(--font-display);font-size:16px;margin-bottom:6px;">${esc(title)}</b>
      <p class="sub" style="margin:0;">Segera hadir — bagian isian ini sedang disiapkan.</p>
    </div>`;
  }
  RENDER.strength = () => placeholderPage("strengthBody", "Strength");
  RENDER.experience = () => placeholderPage("experienceBody", "Experience");
  RENDER.relationship = () => placeholderPage("relationshipBody", "Relationship");
  RENDER.vision = () => placeholderPage("visionBody", "Vision");
  RENDER.expansion = () => placeholderPage("expansionBody", "Expansion");
  // 2026-09-22: nanti diisi pembacaan gabungan semua instrumen (DISC/SSD/
  // Karunia Rohani/Serve Road Map) jadi narasi: kepribadian, keahlian,
  // rekomendasi pekerjaan/pelayanan yang cocok, & area yang perlu
  // diperbaiki — bukan cuma angka mentah spt versi lama (RENDER.results).
  RENDER.hasil = () => placeholderPage("hasilBody", "Hasil Asesmen");

  RENDER.profile = function () {
    el("profileBody").innerHTML = `
      <div class="card pad" style="margin-bottom:14px;">
        <b style="font-family:var(--font-display);font-size:16px;">${esc((state.myProfile || {}).name || "")}</b>
        <div class="sub" style="margin-top:3px;">${esc((state.myProfile || {}).phone || "")}</div>
      </div>
      <h2 class="section">Ganti Kata Sandi</h2>
      <div class="card pad">
        <div class="field"><input type="password" id="pfNewPw" placeholder="Kata sandi baru (min 6 karakter)"></div>
        <button class="btn btn--ghost" id="pfChangePw">Ganti Sandi</button>
      </div>
      <p class="sub" style="margin-top:8px;">Kata sandi ini SAMA dengan akun JB3 HOME Tracker Anda — menggantinya di sini juga mengubahnya di sana.</p>
      <button class="btn btn--ghost" style="margin-top:18px;color:var(--bad);border-color:var(--bad);" id="pfLogout">Keluar</button>
    `;
  };

  /* ---------------- data load & sync ---------------- */
  async function loadAll() {
    state.myProfile = await DB.myProfile();
    if (!state.myProfile) return;
    state.meId = state.myProfile.id;
    state.persona = state.myProfile.role === "admin" ? "ADMIN" : "PESERTA";
    if (state.persona === "ADMIN") state.pendingRequests = await DB.listPendingAccessRequests();
    else state.accessStatus = await DB.myAccessStatus();
  }

  // 2026-09-22 (permintaan user, "tombol mulai" di kartu Lead To Serve 1 di
  // JB3 HOME Tracker — carousel Discipleship Journey): terima sesi login yg
  // diteruskan dari JB3 HOME Tracker lewat URL fragment (#at=...&rt=...) —
  // fragment TAK PERNAH terkirim ke server (murni dibaca browser), jadi aman
  // dipakai bawa token. Kalau ada, langsung pasang sesi (spy tak perlu ketik
  // ulang No. HP+kata sandi yg SAMA dgn akun JB3), lalu fragment dibersihkan
  // dari address bar (replaceState) spy token tak nyangkut di riwayat/URL.
  async function claimHandoffSession() {
    const m = /^#at=([^&]+)&rt=([^&]+)/.exec(location.hash);
    if (!m) return false;
    try {
      await sb.auth.setSession({ access_token:decodeURIComponent(m[1]), refresh_token:decodeURIComponent(m[2]) });
      history.replaceState(null, "", location.pathname + location.search);
      return true;
    } catch (e) { console.error(e); return false; }
  }

  async function boot() {
    await claimHandoffSession();
    const sess = await DB.session();
    if (!sess) { show("login", { replace:true }); return; }
    try {
      await loadAll();
      if (!state.myProfile) { show("login", { replace:true }); return; }
      show("home", { replace:true });
    } catch (e) { console.error(e); show("login", { replace:true }); }
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", async e => {
    const T = e.target;
    if (T.closest("#backBtn")) { goBack(); return; }
    const g = T.closest("[data-goto]");
    if (g) { show(g.dataset.goto); return; }

    if (T.closest("#liGo")) {
      const id = el("liId").value.trim(), pw = el("liPw").value;
      if (!id || !pw) { el("liErr").textContent = "Isi No. HP/Nama dan kata sandi."; return; }
      el("liErr").textContent = "";
      try { await DB.login({ id, password:pw }); await boot(); }
      catch (err) { el("liErr").textContent = "Gagal masuk: " + (err.message || err); }
      return;
    }
    if (T.closest("#pfLogout") || T.closest("#rolePill")) {
      await DB.logout().catch(() => {});
      Object.assign(state, { page:"login", stack:[], persona:null, meId:null, myProfile:null, accessStatus:null, pendingRequests:[] });
      show("login", { replace:true });
      return;
    }
    if (T.closest("#pfChangePw")) {
      const np = el("pfNewPw").value;
      if (np.length < 6) { toast("Minimal 6 karakter."); return; }
      try { await DB.changePassword(np); toast("Sandi diganti."); el("pfNewPw").value = ""; }
      catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    if (T.closest("#reqAccessBtn")) {
      try { await DB.requestAccess(); state.accessStatus = "pending"; toast("Permintaan terkirim ke Admin."); RENDER.home(); }
      catch (err) { toast("Gagal mengajukan: " + (err.message || err)); }
      return;
    }
    const appReq = T.closest("[data-appreq]"), rejReq = T.closest("[data-rejreq]");
    if (appReq || rejReq) {
      const id = (appReq || rejReq).dataset.appreq || (appReq || rejReq).dataset.rejreq;
      try {
        await DB.decideAccessRequest(id, !!appReq);
        toast(appReq ? "Permintaan disetujui." : "Permintaan ditolak.");
        state.pendingRequests = await DB.listPendingAccessRequests();
        RENDER.requests();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
  });

  boot();
})();
</script>
</body>
</html>
