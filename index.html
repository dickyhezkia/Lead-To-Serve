<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* 2026-10-04: iOS auto-zoom saat input <16px difokus & zoom-nya ikut terbawa
     balik ke JB3 HOME Tracker (bug "tidak fit to screen") → kunci zoom (meta
     maximum-scale=1) + paksa input ≥16px, SAMA spt JB3. */
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px !important; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px; }

  :root {
    /* 2026-10-16 (user: "warna background discipleship journey teracota sama seperti jb3 home"):
       palet ungu → palet JB3 HOME (krem --paper + aksen terracotta). Ungu lama: backups/2026-10-16_pre-warna-jb3 */
    --paper:#F5EFE3; --surface:#FCFAF4; --surface-2:#F0E8D8;
    --ink:#2E2A23; --ink-soft:#5E5647; --ink-faint:#877B61;
    --line:#E2D8C3; --line-strong:#D3C6AB;
    --accent:#B5623B; --accent-ink:#7A3F22;
    --good:#4C7A54; --warn:#B4822F; --bad:#B2433A; --badge:#B2433A;
    --disc-d:#C0504D; --disc-i:#C99A2E; --disc-s:#4F8F5B; --disc-c:#4472A8;
    --canvas:#1A2B49;
    --shadow: 0 1px 2px rgba(50,40,20,.06), 0 8px 24px rgba(50,40,20,.08);
    --r-sm:10px; --r-md:16px; --r-lg:24px;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Karla", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#211E19; --surface:#2A2620; --surface-2:#332E26;
      --ink:#F2ECDD; --ink-soft:#C6BCA4; --ink-faint:#9A8D70;
      --line:#3B352B; --line-strong:#4C4437;
      --accent:#E08B5D; --accent-ink:#F0B48C;
      --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
      --canvas:#131E33;
    }
  }
  :root[data-theme="dark"] {
    --paper:#211E19; --surface:#2A2620; --surface-2:#332E26;
    --ink:#F2ECDD; --ink-soft:#C6BCA4; --ink-faint:#9A8D70;
    --line:#3B352B; --line-strong:#4C4437;
    --accent:#E08B5D; --accent-ink:#F0B48C;
    --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
    --canvas:#131E33;
  }

  body {
    font-family: var(--font-body); font-weight: 500;
    background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 16px 56px; }
  .masthead { text-align: center; max-width: 560px; color: #F1ECFA; }
  .masthead .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #C9B8F0; }
  .masthead h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -.01em; margin: 4px 0 6px; color: #fff; }
  .masthead p { margin: 0; color: rgba(241,236,250,.82); font-size: 14px; line-height: 1.5; }

  .phone { position: relative; width: 390px; height: 844px; background: var(--paper); border-radius: 46px; box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.07); padding: 10px; flex: none; }
  @media (min-width: 640px) { .phone { width: clamp(390px, 40vw, 520px); height: clamp(760px, 88vh, 980px); } }
  .screen-frame { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; isolation: isolate; }
  @media (max-width: 480px) {
    html { height: 100%; height: 100dvh; }
    body { position: fixed; top: 0; left: 0; right: 0; overflow: hidden; height: 100%; height: 100dvh; height: var(--app-h, 100dvh); }
    .stage { padding: 0; gap: 0; min-height: 0; height: 100%; }
    .masthead { display: none; }
    .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
    .screen-frame { border-radius: 0; height: 100%; }
  }

  .appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 12px calc(18px + env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); }
  .appbar__back { border: none; background: none; padding: 6px; margin: -6px 0 -6px -6px; color: var(--ink); cursor: pointer; border-radius: 8px; display: none; }
  .appbar[data-back="true"] .appbar__back { display: inline-flex; }
  .appbar__logo { flex: none; height: 26px; width: 26px; object-fit: contain; border-radius: 7px; }
  .appbar__title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rolepill { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

  .identitybar { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 16px 9px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .identitybar .ib-ava { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 12px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }
  .identitybar .ib-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .identitybar .ib-name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--accent-ink); }

  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll.has-tabbar { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .page { padding: 18px 18px 28px; display: none; }
  .page.active { display: block; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 2px 10px; }
  h2.section:first-child { margin-top: 4px; }
  .divider-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 14px; }
  .sub { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .muted { color: var(--ink-faint); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
  .card.pad { padding: 16px; }
  .card.pad.sm { padding: 12px; }

  .btn { -webkit-appearance: none; appearance: none; font-family: var(--font-body); font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn--sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; font-family: var(--font-body); font-size: 14.5px; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .field textarea { min-height: 70px; resize: vertical; }
  .err { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 10px; min-height: 1em; }

  .tabbar { position: absolute; z-index: 20; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); border-radius: 22px; background: color-mix(in srgb, var(--paper) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); box-shadow: 0 10px 30px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.28); padding: 7px 6px 8px; }
  .tab { position: relative; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 2px; color: var(--ink-faint); font-family: var(--font-body); font-size: 9.5px; font-weight: 700; border-radius: 14px; min-height: 42px; }
  .tab .ico { display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab[aria-current="page"] .ico { background: var(--accent); }
  .tab[aria-current="page"] .ico svg { stroke: var(--paper); }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag--done { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
  .tag--todo { background: var(--surface-2); color: var(--ink-faint); }

  .avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 13px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }

  /* 2026-09-22 (asesmen DISC): 1 kelompok = 4 kata sifat (D/I/S/C), tiap
     kata punya 2 tombol kecil (✓ paling / ✗ paling kurang). */
  .discgroup { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .discgroup .gno { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); margin-bottom: 6px; }
  .discrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .discrow .word { flex: 1; }
  .discpick { display: flex; gap: 4px; flex: none; }
  .discpick button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-faint); font-size: 10px; font-weight: 800; cursor: pointer; }
  .discpick button[aria-pressed="true"].sangat { background: var(--good); border-color: var(--good); color: #fff; }
  .discpick button[aria-pressed="true"].kurang { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* 2026-09-23 (dipakai fieldHTML checkboxList/Vision & asesmen SSD baru):
     sempat tak sengaja hilang saat kerangka dirombak — ketauan lagi sekarang
     krn SSD butuh .roleseg utk tombol skala 6-pilihan tiap pernyataan. */
  .roleseg { display: flex; gap: 4px; flex-wrap: wrap; }
  .roleseg button { flex: 1 1 auto; min-width: 44px; min-height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; }
  .roleseg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .qrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .qrow:last-child { border-bottom: none; }
  .qrow .qtext { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
  .qrow .qno { color: var(--ink-faint); font-weight: 800; margin-right: 4px; }
  /* 2026-10-04 — pembahasan post-test (postTestReviewHTML) */
  .rv { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .rv > summary, .rv-sub > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-soft); padding: 4px 0; }
  .rv-sub { margin-top: 8px; }
  .rv-item { border-bottom: 1px solid var(--line); }
  .rv-item:last-child { border-bottom: none; }
  .rv-q { display: flex; align-items: flex-start; gap: 8px; padding: 10px 0; font-size: 13px; line-height: 1.4; cursor: pointer; list-style: none; }
  .rv-q::-webkit-details-marker { display: none; }
  .rv-q::after { content: ""; flex: none; width: 7px; height: 7px; margin: 5px 4px 0 auto; border-right: 2px solid var(--ink-faint); border-bottom: 2px solid var(--ink-faint); transform: rotate(45deg); transition: transform .15s; }
  .rv-item[open] > .rv-q::after { transform: rotate(-135deg); margin-top: 8px; }
  .rv-qt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rv-item[open] .rv-qt { display: block; }
  .rv-q .qno { color: var(--ink-faint); font-weight: 800; margin-right: 4px; }
  .rv-mark { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; }
  .rv-bad .rv-mark { background: var(--bad); }
  .rv-ok .rv-mark { background: var(--good); }
  .rv-ans { padding: 0 0 10px 28px; }
  .rv-hint { margin: 2px 0 4px; font-size: 11px; color: var(--ink-faint); }
  @media (prefers-reduced-motion: reduce) { .rv-q::after { transition: none; } }
  .rv-line { font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 9px; margin-top: 4px; }
  .rv-line small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; opacity: .8; margin-bottom: 2px; }
  .rv-wrong { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); }
  .rv-good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
  .rv-opt { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 9px; margin-top: 4px; color: var(--ink-faint); border: 1px solid var(--line); }
  .rv-opt-k { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--line); color: var(--ink-soft); }
  .rv-opt-t small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
  .rv-opt--key { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); font-weight: 700; }
  .rv-opt--key .rv-opt-k { background: var(--good); color: #fff; }
  .rv-opt--bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); text-decoration: line-through; text-decoration-thickness: 1px; }
  .rv-opt--bad .rv-opt-k { background: var(--bad); color: #fff; }
  .rv-opt--bad small { text-decoration: none; display: block; }

  .barrow { margin-bottom: 10px; }
  .barrow .bhead { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px; }
  .barrow .bhead b { font-weight: 700; }
  .barbg { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .barbg > i { display: block; height: 100%; border-radius: 999px; }

  .login { max-width: 340px; margin: 0 auto; padding: 30px 22px; }
  .login .brandmark { text-align: center; margin-bottom: 22px; }
  .login .brandmark img { width: 56px; height: 56px; object-fit: contain; margin: 0 auto 10px; display: block; }
  .login .brandmark .churchname { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .login h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 4px; text-align: center; }
  .login p.sub { text-align: center; margin: 0 0 18px; }

  /* 2026-09-22 (kerangka S-E-R-V-E): ubin bulat "3D" gradient, pola visual
     SAMA prinsipnya dgn .cat-chip di JB3 HOME Tracker (dot warna beda tiap
     huruf) — supaya begitu tool-nya dibangun nanti, tinggal tempel di
     dalam kartu yg SUDAH ada, bukan rombak ulang tampilan. */
  .serve-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .serve-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px 10px; cursor: pointer; font-family: var(--font-body); }
  .serve-tile .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-size: 19px; font-weight: 600; color: #fff; background: linear-gradient(150deg, var(--dot), color-mix(in srgb, var(--dot) 70%, #000)); }
  .serve-tile b { font-family: var(--font-display); font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .serve-tile .sub { font-size: 10px; }
  /* 2026-10-04 — Dashboard Admin per journey (RENDER.dashboard / dashSecHTML) */
  .jd-hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 18px 18px 16px; margin-bottom: 16px; color: #fff; background: linear-gradient(140deg, var(--jc) 0%, color-mix(in srgb, var(--jc) 60%, #000) 100%); box-shadow: 0 10px 28px color-mix(in srgb, var(--jc) 35%, transparent); }
  /* 2026-10-17: foto kelas (sama dgn kartu Discipleship Journey di JB3 HOME) di balik hero, ditutup gradasi warna kelas */
  .jd-hero--ph { background: linear-gradient(165deg, color-mix(in srgb, var(--jc) 50%, transparent) 0%, color-mix(in srgb, var(--jc) 88%, #000) 62%, color-mix(in srgb, var(--jc) 62%, #000) 100%), var(--ph) center 30% / cover no-repeat, var(--jc); }
  .jd-hero-ic svg { width: 23px; height: 23px; }

  .printsheet { display: none; background: #fff; color: #000; padding: 14px; font-family: Georgia, "Times New Roman", serif; }

  /* 2026-09-23 (bug nyata, user: "hasil unduhan asesmen dan road map
     terpotong"): akar masalah — `pagebreak: {mode:["css","legacy"]}` di
     downloadPdf()/sharePdf() tak py aturan CSS page-break APAPUN utk
     dipatuhi mode "css"-nya, jadi SELALU jatuh ke mode "legacy" (potong
     piksel mentah tanpa peduli batas elemen) tiap kali kontennya lebih
     tinggi dari 1 halaman A4 — teks/kolom terpotong PAS di tengah kalimat
     kalau kebetulan jatuh di batas halaman. Diperbaiki: SEMUA blok konten
     (kolom S-E-R-V-E, sel Expansion, tiap baris narasi Hasil Asesmen) diberi
     `page-break-inside:avoid` (+`break-inside` versi modern) — html2pdf.js
     mode "css" jd bisa geser SELURUH blok itu ke halaman berikutnya kalau
     tak muat, bukan memotongnya di tengah. Lembar Road Map "1 Lembar" bisa
     jd 2 halaman kalau isiannya sangat panjang — itu tukar-tambah yg
     disengaja (2 halaman utuh jauh lebih baik drpd 1 halaman yg datanya
     hilang separuh). `pagebreak` mode jg diganti ke ["css","avoid-all"]
     (avoid-all = jaring pengaman otomatis utk elemen manapun yg lolos dari
     daftar CSS di atas, GANTI legacy yg justru sumber masalahnya). */
  .printsheet .pscol, .printsheet .psexp > div, .printsheet .psblock,
  .printsheet .rphead, .printsheet .rpsub, .printsheet .rpp, .printsheet .rpul li {
    page-break-inside: avoid; break-inside: avoid;
  }
  @media print {
    body * { visibility: hidden; }
    .printsheet, .printsheet * { visibility: visible; }
    .printsheet { display: block; position: absolute; left: 0; top: 0; width: 100%; }
  }

<script>
(function () {
  "use strict";
  const { esc, DISC_GROUPS, computeDiscGraphs, discComplete, ROADMAP_SECTIONS, HOLY_DISCONTENT_AREAS,

    LTS2_QUESTIONS, LTS2_BANDS, computeLts2Result, lts2Complete,

  const CURRENT_YEAR = new Date().getFullYear();
  const el = id => document.getElementById(id);
  const $ = s => document.querySelector(s);

  if (!window.LTS_CONFIG || !window.supabase) {
    document.getElementById("app").innerHTML = '<div class="empty">Gagal memuat. Cek config.js / koneksi internet.</div>';
    return;
  }
  // 2026-10-04 (bug user: setelah DJ dibuka di dalam JB3, "kembali ke jb3 harus login
  // ulang"): DJ memakai sesi YANG SAMA dgn JB3 (handoff #at/#rt). Sesi lama yg tersimpan
  // di sini (refresh token yg sudah diputar JB3) ikut dipulihkan & di-refresh saat
  // klien dibuat → Supabase menganggapnya pemakaian ulang token → SELURUH sesi akun
  // dicabut, JB3 ikut logout. Fix: (1) ada handoff → buang sesi tersimpan dulu;
  // (2) di dalam JB3 (iframe) sesi cuma di memori & TIDAK auto-refresh — JB3 satu-
  // satunya yg memperbarui token, lalu mengirim token barunya ke sini (jb3-session).
  const DJ_EMBED = window.parent !== window;
  if (/^#at=/.test(location.hash)) { try { Object.keys(localStorage).filter(k => k.startsWith("sb-")).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
  const sb = window.supabase.createClient(window.LTS_CONFIG.url, window.LTS_CONFIG.anonKey,
    DJ_EMBED ? { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } } : undefined);
  const DB = window.makeDB(sb);
  // 2026-10-04: di dalam lapisan JB3 HOME Tracker → terima token baru dari JB3
  // (JB3 yg memperbarui token; DJ_EMBED mematikan auto-refresh di sini).
  if (DJ_EMBED) window.addEventListener("message", e => {
    // 2026-10-06: + alamat baru JB3 (home.jb3church.com) — *.workers.dev diblokir sebagian ISP.
    if (!/^https:\/\/(jb3-home-tracker[\w.-]*\.dickyhezkia\.workers\.dev|home\.jb3church\.com)$/.test(e.origin) || !e.data || e.data.type !== "jb3-session") return;
    if (e.data.at && e.data.rt) sb.auth.setSession({ access_token:e.data.at, refresh_token:e.data.rt }).catch(() => {});
  });

  // 2026-09-22 (kerangka S-E-R-V-E, "isian toolnya nanti saja"): state
  // disederhanakan besar2an — cuma yg dibutuhkan utk login + navigasi.
  // 2026-09-22 susulan ("bangun assesment DISC dengan hasil masking, real,
  // stress"): myDisc (baris tahun INI, null kalau belum diisi) + draft.discPicks
  // (isian yg sedang dikerjakan, blm disimpan) ditambahkan.
  const state = { page:"login", stack:[], persona:null, meId:null, myProfile:null, accessStatus:null, accessRequests:[], myDisc:null, myRoadmap:null, mySsd:null, myGifts:null, rs3AccessStatus:null, rs3AccessRequests:[], rs3Result:null, lts2AccessStatus:null, lts2AccessRequests:[], lts2Result:null, rs1AccessStatus:null, rs1AccessRequests:[], rs1Result:null, rs2AccessStatus:null, rs2AccessRequests:[], rs2Result:null, materi:null, materiKey:"rs1", participantResults:null, viewProfileId:null, resultsFilter:"all", draft:{ discPicks:[], roadmapData:{}, ssdAnswers:{}, giftsAnswers:{}, rs3Answers:{}, lts2Answers:{}, rs1Answers:{}, rs2Answers:{} } };
  const NOCHROME = ["login"];

  function initials(name) { return String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?"; }
  function toast(msg) {
    let t = el("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast";
      t.style.cssText = "position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:86%;text-align:center;";
      $(".screen-frame").appendChild(t);
    }
    t.textContent = msg; t.style.opacity = "1";
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = "0"; }, 2200);
  }

  // 2026-09-22 (permintaan user, "tombol assesment yang terkunci dan hanya
  // bisa dibuka dengan request ke admin", lalu susulan "admin1... akan

  // "Dashboard" (dulu "Permintaan" — cuma daftar pending; SEKARANG ringkasan
  // menyeluruh + daftar pending yg perlu diputuskan, lihat RENDER.dashboard).
  const TABS = {
    // 2026-10-04 (permintaan user, "perbaiki juga nav bar di setiap pengguna:
    // RS1, RS2, RS3, LTS1, LTS2"): peserta kini 5 tab journey (ikon & warna
    // sama dgn Admin, lihat DASH_JOURNEYS) → halaman rs1/rs2 (baru), rs3,
    // home (= LTS1: Serve Road Map + DISC/SSD/Karunia), lts2. Profil ke ⚙.
    PESERTA: [{ k:"journey", p:"journey" }, { k:"rs1", p:"rs1" }, { k:"rs2", p:"rs2" }, { k:"rs3", p:"rs3" }, { k:"lts1", p:"home" }, { k:"lts2", p:"lts2" }],
    // 2026-10-04: Admin = 5 tab journey (lihat DASH_JOURNEYS), semuanya halaman
    // "dashboard" dgn state.dashKey berbeda; Profil pindah ke ikon ⚙ app bar.
    ADMIN: [],
  };
  // 2026-09-22: S.E.R.V.E — akronim dari 5 bagian Serve Road Map (Strength/
  // Experience/Relationship/Vision/Expansion), lihat sumber/roadmap-fields.json
  // & catatan di common.js (ROADMAP_SECTIONS) utk isi lengkap tiap bagian
  // saat nanti dibangun ("isian toolnya nanti saja" — instruksi user).
  const SERVE_SECTIONS = [
    { key:"strength", letter:"S", title:"Strength", desc:"Bisa & suka", dot:"#B5623B" },
    { key:"experience", letter:"E", title:"Experience", desc:"Titik tertinggi & terendah", dot:"#5F7F5A" },
    { key:"relationship", letter:"R", title:"Relationship", desc:"Mentor · buddy · mentee", dot:"#B4822F" },
    { key:"vision", letter:"V", title:"Vision", desc:"Holy discontent & panggilan", dot:"#4472A8" },
    { key:"expansion", letter:"E", title:"Expansion", desc:"Rencana aksi 3-6 bulan", dot:"#93683F" },
  ];
  const META = {
    journey: { h:"Discipleship Journey", tab:"journey" },
    home: { h:"Lead To Serve 1", tab:"home" },
    rs1: { h:"Rock Solid 1", tab:"rs1" },
    rs2: { h:"Rock Solid 2", tab:"rs2" },
    disc: { h:"DISC", back:true },
    ssd: { h:"Skala Sikap Disfungsional", back:true },
    gifts: { h:"Karunia Rohani", back:true },
    rs3: { h:"Rock Solid 3", tab:"rs3" },
    lts2: { h:"Lead To Serve 2", tab:"lts2" },
    // 2026-10-04: halaman feedback per kelas — alias link (#p=...) dipetakan
    // show() ke halaman "feedback" + state.fbKey (lihat FB_CLASSES).
    feedback: { h:"Feedback", back:true },
    rs3feedback: { h:"Feedback", back:true }, fbrs1: { h:"Feedback", back:true }, fbrs2: { h:"Feedback", back:true },

    results: { h:"Dashboard Peserta", tab:"results" },
    resultdetail: { h:"Hasil Peserta", back:true },
    serveview: { h:"LTS 1 Road Map", back:true },
    hasilview: { h:"Hasil Asesmen Lengkap", back:true },
    strength: { h:"Strength", back:true },
    experience: { h:"Experience", back:true },
    relationship: { h:"Relationship", back:true },
    vision: { h:"Vision", back:true },
    expansion: { h:"Expansion", back:true },
    hasil: { h:"Hasil Asesmen", back:true },
    dashboard: { h:"Dashboard Admin", tab:"dashboard" },
    materi: { h:"Bahan Ajar", back:true },
    profile: { h:"Profil Saya", tab:"profile" },

  function show(page, opts) {
    opts = opts || {};
    // 2026-10-04: Admin tak punya beranda Serve Road Map lagi — "home" (mis.
    // dari goBack/simpan) & "dashboard" tanpa pilihan tab → dashboard journey.
    if (FB_PAGE[page]) { state.fbKey = FB_PAGE[page]; page = "feedback"; }
    // 2026-10-04: tab "Peserta" (halaman results) = dashboard lintas kelas;
    // landing Admin: kelas yg py permintaan Menunggu, kalau tak ada → Peserta.
    if (state.persona === "ADMIN" && (page === "home" || page === "dashboard")) {
      if (!state.dashKey) {
        const k = adminLandingKey();
        state.dashKey = k || DASH_JOURNEYS[0].key;
        page = k ? "dashboard" : "results";
      } else page = "dashboard";
    }
    const prev = state.page;
    if (!opts.replace && prev !== page && !NOCHROME.includes(prev) && !NOCHROME.includes(page)) state.stack.push(prev);
    state.page = page;
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.dataset.page === page));
    renderChrome();
    RENDER[page] && RENDER[page]();
  }
  function goBack() { const p = state.stack.pop(); show(p || "home", { replace:true }); }

  function renderChrome() {
    const chromeOn = state.persona && !NOCHROME.includes(state.page);
    el("appbar").classList.toggle("hidden", !chromeOn);
    el("identityBar").classList.toggle("hidden", !chromeOn);
    el("tabbar").classList.toggle("hidden", !chromeOn);
    if (!chromeOn) return;
    const meta = META[state.page] || {};
    const isAdm = state.persona === "ADMIN";

    // 2026-10-17: + Senior Pastor (profiles.is_sp; RLS v_dj_materi_sp.sql), + LTS1/LTS2.

    el("appbarTitle").textContent = meta.h || "Discipleship Journey";
    const idb = el("identityBar");

        <path d="${head}" fill="${col}"/>
        <text class="w"><textPath href="#bjw${i}" startOffset="50%">${ph.word}${done ? " ✓" : ""}</textPath></text>

  // data: state[k+"AccessStatus"], state[k+"Result"], state.draft[k+"Answers"].
  function renderPt(k) {
    const QS = PT_QUESTIONS[k];
    const st = state[k + "AccessStatus"], last = state[k + "Result"];
    const unlocked = state.persona === "ADMIN" || st === "approved";
    const hero = pjHeroHTML(k, `Post-test ${QS.length} soal pilihan ganda. Skor <b>Good</b> (50%) ke atas = lulus &amp; kelas otomatis ditandai selesai.`, pjStatusPill(st, last));
    if (!unlocked) {
      el(k + "Body").innerHTML = hero + pjFbHTML(k) + pjSecHTML("Post-test") + pjLockHTML(st, "reqPt_" + k, "post-test");
      return;
    }
    // 2026-10-15 (user: "khusus RS2, setelah selesai dan tidak lulus; dapat
    // memperbaiki jawaban yang salah menjadi benar sampai lulus"): RS2 yg
    // belum lulus → jawaban yg sudah benar dari percobaan terakhir otomatis
    // terisi & dikunci, form hanya menampilkan soal yg SALAH utk diperbaiki.
    // Kirim ulang = percobaan baru (riwayat tetap tersimpan) sampai lulus.
    const fixMode = k === "rs2" && last && !last.passed && last.answers;
    const fixKey = fixMode ? (last.id || last.created_at || JSON.stringify(last.answers)) : null;
    if (fixMode && state.draft.rs2FixOf !== fixKey) {

    const answers = state.draft[k + "Answers"];
    const doneCount = QS.filter(q => answers[q.no]).length;
    const done = ptComplete(k, answers);
    if (fixMode) {
      const fixQs = QS.filter(q => last.answers[String(q.no)] !== q.correct);

      el(k + "Body").innerHTML = hero
        + pjFbHTML(k)

      + pjFbHTML(k)

  // tersimpan sejak awal) — default cuma soal yg SALAH, ada <details> utk
  // soal yg benar. Dipakai di halaman post-test, Hasil Asesmen, & detail
  // peserta (Admin). Kunci jawaban memang sudah ada di common.js (lihat
  // catatan di RS3_QUESTIONS), jadi tak ada data baru yg dibuka.
  function postTestReviewHTML(questions, res, open, who) {
    if (!res || !res.answers) return "";
    const ans = res.answers || {};
    const wrong = questions.filter(q => ans[String(q.no)] !== q.correct);
    const right = questions.filter(q => ans[String(q.no)] === q.correct);
    // 2026-10-15 (user: "jawaban yang salah; setelah hasil akhir muncul, kamu
    // buat tandai jawaban yang salah dan yang benar sehingga jadi
    // pembelajaran"): tiap soal kini menampilkan KEEMPAT pilihan — pilihan
    // peserta yg salah merah ✗, kunci hijau ✓, sisanya pudar. Di halaman
    // post-test (open=true) pembahasan langsung terbuka & soal yg salah
    // sudah terbuka; di Hasil Asesmen/Admin tetap ringkas (tertutup).
    const opts = (q, ok) => ["A", "B", "C", "D"].filter(k => q.options[k]).map(k => {
      const mine = ans[String(q.no)] === k, key = q.correct === k;
      const cls = key ? "rv-opt rv-opt--key" : mine ? "rv-opt rv-opt--bad" : "rv-opt";
      const tag = key ? (mine ? "✓ Jawabanmu benar" : "✓ Jawaban benar") : mine ? `✗ ${who || "Jawabanmu"}` : "";
      return `<div class="${cls}"><span class="rv-opt-k">${k}</span><span class="rv-opt-t">${esc(q.options[k])}${tag ? `<small>${esc(tag)}</small>` : ""}</span></div>`;
    }).join("") + (!ok && !ans[String(q.no)] ? `<div class="rv-line rv-wrong">✗ Tidak dijawab</div>` : "");
    const item = (q, ok, openItem) => `<details class="rv-item ${ok ? "rv-ok" : "rv-bad"}" ${openItem ? "open" : ""}>
        <summary class="rv-q"><span class="rv-mark">${ok ? "✓" : "✗"}</span><span class="rv-qt"><span class="qno">${q.no}.</span>${esc(q.text)}</span></summary>
        <div class="rv-ans">${opts(q, ok)}</div>
      </details>`;
    return `<details class="rv" ${open ? "open" : ""}>
        <summary>Pembahasan jawaban — ${wrong.length ? `<b>${wrong.length} salah</b> · ${right.length} benar` : "<b>semua benar 🎉</b>"}</summary>
        ${wrong.length ? `<p class="rv-hint">${open ? "Pelajari soal yang salah di bawah ini: ✗ merah = pilihanmu, ✓ hijau = jawaban yang benar." : "Ketuk soal untuk melihat pilihan & jawaban yang benar."}</p>` : ""}
        ${wrong.map(q => item(q, false, open)).join("")}
        ${right.length ? `<details class="rv-sub"><summary>Lihat ${right.length} soal yang dijawab benar</summary>${right.map(q => item(q, true, false)).join("")}</details>` : ""}
      </details>`;
  }

  // Format markdown sederhana: "# " judul sesi (kartu buka-tutup), "## "/"### "
  // subjudul, "- " poin, "> " ayat, "! " catatan pengajar, **tebal**.
  // 2026-10-17 (permintaan user: "setiap pelajaran dapat discroll sehingga tidak panjang ke bawah dan

  // Penegasan otomatis (teks sumber tak diubah): baris HURUF BESAR → subjudul, "Label:" di awal paragraf
  // tebal, frasa ≥3 kata HURUF BESAR tebal, "1. / 1) / 1 — " → daftar bernomor, " • " → poin,
  // baris ayat (✦ / "> Ref — " / "**Ref :**") → kotak ayat dgn referensi tebal, garis isian "____" dibuang.
  function mdInline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\(((?:[1-3I]{1,3}\s)?[A-Z][a-z]+(?:\s[A-Z][a-z]+){0,3}\s\d+:[\d\-–,\s]+[a-z]?)\)/g, `(<span class="mt-iref">$1</span>)`)   // rujukan ayat dalam kurung
      .replace(/(^|[\s(“"])((?:[A-Z][A-Z'’\-]{2,}[,!?]?\s+)+[A-Z][A-Z'’\-]{2,}[.!?]?)(?=$|[\s)”".,:;])/g, "$1<b>$2</b>");
  }
  const MT_REF = /^((?:[1-3I]{1,3}\s)?[A-Z][A-Za-z]+(?:\s[A-Z][a-z]+){0,3}\s\d+:[\d\-–,\sab]+?)\s*(?:—|:)\s*/;
  const mtCaps = l => { const t = l.replace(/[^A-Za-z]/g, ""); return t.length >= 6 && l.length <= 90 && t === t.toUpperCase() && !/^AYAT HAFALAN/.test(l); };
  const mtLabel = s => { const m = s.match(/^([^:.!?“"]{2,38}):\s+(.+)$/); return m && !/<b>/.test(esc(m[1])) && !/\d:\d/.test(m[1]) ? `<b>${mdInline(m[1])}:</b> ${mdInline(m[2])}` : mdInline(s); };
  function mtVerse(t) {
    t = t.replace(/^✦\s*/, "");
    let m = t.match(/^\*\*(.+?)\s*:?\*\*\s*:?\s*(.*)$/);
    if (m && /\d:\d|\d$/.test(m[1])) return `<blockquote class="mt-q"><b class="mt-ref">${mdInline(m[1].replace(/\s*:$/, ""))}</b>${mdInline(m[2])}</blockquote>`;
    m = t.match(/^(.+?\d+(?::[\d\-–,\sab]+)?)\s+—\s+(.*)$/);
    if (m && m[1].length < 48) return `<blockquote class="mt-q"><b class="mt-ref">${mdInline(m[1])}</b>${mdInline(m[2])}</blockquote>`;
    m = t.match(/^((?:[1-3]\s)?[A-Z][A-Za-z]+(?:\s[A-Z][a-z]+){0,3}\s\d+(?::[\d\-–,\sab]+)?[a-z]?)\s+(.*)$/);
    if (m && m[1].length < 48) return `<blockquote class="mt-q"><b class="mt-ref">${mdInline(m[1].trim())}</b>${mdInline(m[2])}</blockquote>`;
    return `<blockquote class="mt-q">${mdInline(t)}</blockquote>`;
  }
  function mdBlocks(lines, toc) {
    let h = "", list = "", n = 0;
    const close = () => { if (list) { h += `</${list}>`; list = ""; } };
    const open = tag => { if (list !== tag) { close(); h += `<${tag} class="mt-ul${tag === "ol" ? " mt-ol" : ""}">`; list = tag; } };

  function pdfFlow(doc, M) {
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();

        const h = lines.length * doc.getLineHeight();

      },

      expCols.forEach(([, value]) => { expMaxLines = Math.max(expMaxLines, doc.splitTextToSize(String(value || "-"), expColW - pad * 2).length); });
      const expH = headerH + doc.getLineHeight() * (expMaxLines + 1) + 3;
      return { maxH: Math.max(...colHeights), expH };
    };
    // Kecilkan font (8pt→5.5pt) sampai TABEL + baris Expansion sama2 muat
    // di sisa halaman (bukan cuma tabelnya spt versi sblmnya — itu celah yg
    // bisa bikin baris Expansion sendiri lolos ngepas/kepotong kalau
    // isiannya panjang). Kalau di batas bawah 5.5pt MASIH tak cukup (kasus
    // sangat jarang, isian amat sangat panjang), baris Expansion digambar di
    // HALAMAN BARU sbg jalan aman terakhir — TETAP tak pernah terpotong.
    let fSize = 8, m = measure(fSize);
    while (m.maxH + 5 + m.expH > PH - tableTop - M && fSize > 5.5) {
      fSize -= 0.4; m = measure(fSize);
    }
    const maxH = m.maxH;
    doc.setLineWidth(0.3); doc.setDrawColor(0);
    doc.rect(M, tableTop, PW - 2 * M, maxH);
    cols.forEach((col, i) => {
      const x = M + i * colW;
      if (i > 0) doc.line(x, tableTop, x, tableTop + maxH);
      doc.setFillColor(236, 236, 236);
      doc.rect(x, tableTop, colW, headerH, "F"); doc.rect(x, tableTop, colW, headerH);
      doc.setFont("helvetica", "bold"); doc.setFontSize(fSize + 0.5);
      doc.text(col.title, x + colW / 2, tableTop + headerH / 2 + 1.3, { align: "center" });
      doc.setFontSize(fSize);
      let cy = tableTop + headerH + 4;
      col.blocks.forEach(([label, value]) => {
        doc.setFont("helvetica", "bold"); doc.text(label, x + pad, cy);
        cy += doc.getLineHeight();
        doc.setFont("helvetica", "normal");
        const lines = doc.splitTextToSize(String(value || "-"), colW - pad * 2);
        doc.text(lines, x + pad, cy);
        cy += lines.length * doc.getLineHeight() + 1.6;
      });
    });
    y = tableTop + maxH + 5;
    // Jalan aman terakhir (lihat komentar di measure()/shrink-loop di atas):
    // kalau SETELAH dikecilkan ke font terkecil baris Expansion ini tetap
    // tak muat di sisa halaman ini, pindah ke halaman baru dulu.
    doc.setFontSize(fSize);
    if (y + m.expH > PH - M) { doc.addPage(); y = M; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(fSize + 0.5);
    doc.setFillColor(236, 236, 236);
    doc.rect(M, y, PW - 2 * M, headerH, "F"); doc.rect(M, y, PW - 2 * M, headerH);
    doc.text("EXPANSION — ACTION PLAN", PW / 2, y + headerH / 2 + 1.3, { align: "center" });
    y += headerH;
    doc.setFontSize(fSize);
    let expMaxLines = 1;
    const expWrapped = expCols.map(([, value]) => {
      const lines = doc.splitTextToSize(String(value || "-"), expColW - pad * 2);
      expMaxLines = Math.max(expMaxLines, lines.length);
      return lines;
    });
    const expH = doc.getLineHeight() * (expMaxLines + 1) + 3;
    doc.rect(M, y, PW - 2 * M, expH);
    expCols.forEach(([label], i) => {
      const x = M + i * expColW;
      if (i > 0) doc.line(x, y, x, y + expH);
      doc.setFont("helvetica", "bold"); doc.text(label, x + pad, y + doc.getLineHeight() + 1);
      doc.setFont("helvetica", "normal"); doc.text(expWrapped[i], x + pad, y + doc.getLineHeight() * 2 + 1);
    });
    return doc;
  }

  // 2026-09-23 (permintaan user, "...bisa diunduh dan share dalam bentuk

  // (Web Share API level-2), BUKAN langsung men-trigger unduhan.
  async function sharePdf(buildFn, filename) {
    if (!pdfReady()) { toast("Fitur PDF belum siap, coba lagi sebentar."); return; }
    if (!(navigator.share && navigator.canShare)) { toast("Perangkat/browser ini tidak mendukung fitur Bagikan — gunakan tombol Unduh PDF, lalu bagikan filenya secara manual."); return; }
    try {
      const blob = buildFn().output("blob");
      const file = new File([blob], filename, { type: "application/pdf" });
      if (!navigator.canShare({ files: [file] })) { toast("Perangkat ini tidak mendukung berbagi file PDF — gunakan tombol Unduh PDF saja."); return; }
      await navigator.share({ files: [file], title: filename });
    } catch (err) {
      if (err && err.name === "AbortError") return;   // pengguna batal di dialog share — bukan error, diam saja
      toast("Gagal menyiapkan/membagikan PDF: " + (err.message || err));
    }
  }

  // html2canvas/window.print sama sekali), jadi TAK MUNGKIN kosong spt bug
  // PDF sebelumnya (murni HTML biasa, tak ada library capture yg bisa gagal).
  // Lebar 1400px tetap (sama dgn versi PDF landscape) di dalam wadah
  // overflow-x:auto — bingkai .phone tak diubah (beda pola dgn RS3/Barista
  // "wide-page"), pengguna geser ke samping utk lihat correspond ke 5 kolom
  // aslinya ("landscape") tanpa perlu memutar/melebarkan bingkai HP.
  // 2026-09-23 (permintaan user, "buat fit to screen iphone dan android"):
  // lembar 1400px/900px SEBELUMNYA cuma bisa dilihat penuh dgn geser ke
  // samping (overflow-x:auto) — sekarang diperkecil OTOMATIS (CSS
  // transform:scale, dihitung dari lebar wadah SUNGGUHAN saat itu — jd
  // otomatis benar di layar iPhone, Android, ATAUPUN simulator desktop,
  // bukan breakpoint tertentu yg bisa salah tebak) spy PAS masuk lebar
  // layar tanpa perlu geser sama sekali. Tinggi wadah ikut disesuaikan
  // (naturalHeight*scale) spy tak ada ruang kosong sisa di bawah.
  function fitPreviewToScreen(wrapId) {
    requestAnimationFrame(() => {
      const wrap = el(wrapId);
      const inner = wrap && wrap.firstElementChild;
      if (!wrap || !inner) return;
      const naturalW = inner.offsetWidth, naturalH = inner.offsetHeight;
      if (!naturalW || !naturalH) return;
      const scale = Math.min(1, wrap.clientWidth / naturalW);
      inner.style.transformOrigin = "top left";
      inner.style.transform = `scale(${scale})`;
      wrap.style.height = Math.ceil(naturalH * scale) + "px";
    });
  }

    const giftsTop3 = gifts ? gifts.scores.top3.map(giftDetail) : [];

    const improve = [];

    return { discLetter, discProfile, ssdLow, ssdHealthy, giftsTop3, giftsNext3, own, recommendation, improve };
  }

  const SNAP_KEY = "dj_snap_v1";
  const SNAP_FIELDS = ["myProfile", "meId", "persona", "accessRequests", "rs3AccessRequests", "lts2AccessRequests", "classProgress", "postTestBest",
    "accessStatus", "rs3AccessStatus", "lts2AccessStatus", "rs1AccessRequests", "rs2AccessRequests", "rs1AccessStatus", "rs2AccessStatus",

  function snapSave() { try { const o = { t: Date.now() }; SNAP_FIELDS.forEach(k => { o[k] = state[k] === undefined ? null : state[k]; }); localStorage.setItem(SNAP_KEY, JSON.stringify(o)); } catch (e) {} }
  function snapLoad(uid) {
    try { const o = JSON.parse(localStorage.getItem(SNAP_KEY) || "null"); if (!o || !o.meId || o.meId !== uid || Date.now() - o.t > 14 * 864e5) return false;
      SNAP_FIELDS.forEach(k => { state[k] = o[k]; });
      state.draft.discPicks = (o.myDisc && o.myDisc.picks) ? o.myDisc.picks.slice() : [];
      state.draft.roadmapData = (o.myRoadmap && o.myRoadmap.data) ? { ...o.myRoadmap.data } : {};
      state.draft.ssdAnswers = (o.mySsd && o.mySsd.answers) ? { ...o.mySsd.answers } : {};
      state.draft.giftsAnswers = (o.myGifts && o.myGifts.answers) ? { ...o.myGifts.answers } : {};
      return true; } catch (e) { return false; }

  function snapClear() { try { localStorage.removeItem(SNAP_KEY); } catch (e) {} }
  async function loadAll() {
    let guess = "PESERTA"; try { guess = localStorage.getItem("dj_persona") || "PESERTA"; } catch (e) {}
    const soft = (pr, fb) => pr.catch(e => { console.error(e); return fb; });
    const batch = isAdm => Promise.all([
      isAdm ? DB.listAllAccessRequests() : DB.myAccessStatus(),
      isAdm ? DB.listAllRs3AccessRequests() : DB.myRs3Status(),
      isAdm ? DB.listAllLts2AccessRequests() : DB.myLts2Status(),
      DB.myRs3Latest(),
      DB.myLts2Latest(),
      DB.myDisc(CURRENT_YEAR),
      DB.myRoadmap(CURRENT_YEAR),
      DB.mySsd(CURRENT_YEAR),
      DB.myGifts(CURRENT_YEAR),
      isAdm ? soft(DB.listClassProgress(), []) : null,
      isAdm ? soft(DB.listPostTestBest(), {}) : null,
      isAdm ? soft(DB.listAllPtAccessRequests(), { rs1:[], rs2:[] }) : Promise.all([soft(DB.myPtStatus("rs1"), null), soft(DB.myPtStatus("rs2"), null)]),
      soft(DB.myPtLatest("rs1"), null), soft(DB.myPtLatest("rs2"), null),
    ]);
    let pending = batch(guess === "ADMIN");
    pending.catch(() => {});
    state.myProfile = await DB.myProfile();
    if (!state.myProfile) return;
    state.meId = state.myProfile.id;
    state.persona = state.myProfile.role === "admin" ? "ADMIN" : "PESERTA";
    try { localStorage.setItem("dj_persona", state.persona); } catch (e) {}
    const isAdm = state.persona === "ADMIN";

      Promise.all([soft(DB.listRs3Feedback(), []), soft(DB.listRs3FbBatches(), [])]).then(([f, b]) => {
        state.rs3Feedback = f; state.rs3FbBatches = b; if (state.page === "dashboard" && RENDER.dashboard) RENDER.dashboard(); });
    }
    if ((guess === "ADMIN") !== isAdm) pending = batch(isAdm);
    const [acc, rs3Acc, lts2Acc, rs3Res, lts2Res, disc, roadmap, ssd, gifts, classProgress, postTestBest, pt, rs1Res, rs2Res] = await pending;
    if (isAdm) Object.assign(state, { accessRequests:acc, rs3AccessRequests:rs3Acc, lts2AccessRequests:lts2Acc, classProgress, postTestBest });
    else Object.assign(state, { accessStatus:acc, rs3AccessStatus:rs3Acc, lts2AccessStatus:lts2Acc });

    else Object.assign(state, { rs1AccessStatus:pt[0], rs2AccessStatus:pt[1] });
    const keep = loadAll.keepDraft;   // segarkan di latar → jawaban yg sedang diisi tak dihapus
    state.rs1Result = rs1Res; state.rs2Result = rs2Res; if (!keep) { state.draft.rs1Answers = {}; state.draft.rs2Answers = {}; }
    state.rs3Result = rs3Res; if (!keep) state.draft.rs3Answers = {};
    state.lts2Result = lts2Res; if (!keep) state.draft.lts2Answers = {};
    if (isAdm || state.accessStatus === "approved") {
      state.myDisc = disc; state.myRoadmap = roadmap; state.mySsd = ssd; state.myGifts = gifts;
      if (!keep) {
        state.draft.discPicks = (disc && disc.picks && disc.picks.length) ? disc.picks : [];
        state.draft.roadmapData = (roadmap && roadmap.data) ? { ...roadmap.data } : {};
        state.draft.ssdAnswers = (ssd && ssd.answers) ? { ...ssd.answers } : {};
        state.draft.giftsAnswers = (gifts && gifts.answers) ? { ...gifts.answers } : {};

    snapSave();

  // 2026-09-22 (permintaan user, "tombol mulai" di kartu Lead To Serve 1 di
  // JB3 HOME Tracker — carousel Discipleship Journey): terima sesi login yg
  // diteruskan dari JB3 HOME Tracker lewat URL fragment (#at=...&rt=...) —
  // fragment TAK PERNAH terkirim ke server (murni dibaca browser), jadi aman
  // dipakai bawa token. Kalau ada, langsung pasang sesi (spy tak perlu ketik
  // ulang No. HP+kata sandi yg SAMA dgn akun JB3), lalu fragment dibersihkan
  // dari address bar (replaceState) spy token tak nyangkut di riwayat/URL.
  // 2026-09-22 susulan (permintaan user, "tambahkan notifikasi di icon
  // lonceng admin, pengajuan Lead To Serve"): fragment SEKARANG jg bisa bawa
  // "&p=<halaman>" opsional (dipakai tombol "Buka & Kelola" di lonceng JB3,
  // deep-link LANGSUNG ke halaman "dashboard" — bukan cuma beranda spt
  // sebelumnya). Dikembalikan sbg { ok, page } spy boot() tahu ke mana.
  async function claimHandoffSession() {
    // 2026-10-04: link yg dibagikan (mis. RS3FB_LINK "#p=rs3feedback") —
    // halaman tujuan diingat di sessionStorage spy tetap terbuka SETELAH
    // pengguna login dulu (boot() dipanggil ulang sesudah login).
    const pm = /^#p=([a-z0-9]+)$/i.exec(location.hash);
    if (pm) {
      try { sessionStorage.setItem("dj_pending_page", pm[1]); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search);
      return { ok:false, page:null };
    }
    const m = /^#at=([^&]+)&rt=([^&]+)(?:&p=([^&]+))?/.exec(location.hash);
    if (!m) return { ok:false, page:null };
    try {
      // 2026-10-19 (user: "saat masuk discipleship journey lama"): setSession() selalu memanggil server
      // (cek token) sebelum apa pun tampil. Kalau DJ sudah memegang token yg PERSIS sama, langkah itu dilewati.
      // (Hanya token yg sama — token lama dari sesi sebelumnya bisa sudah diganti JB3.)
      const at = decodeURIComponent(m[1]);
      const cur = (await sb.auth.getSession()).data.session;
      if (!(cur && cur.access_token === at))
        await sb.auth.setSession({ access_token:at, refresh_token:decodeURIComponent(m[2]) });
      history.replaceState(null, "", location.pathname + location.search);
      return { ok:true, page: m[3] ? decodeURIComponent(m[3]) : null };
    } catch (e) { console.error(e); return { ok:false, page:null }; }
  }

  // 2026-09-22 (perbaikan bug nyata, "di LTS1 admin1 tidak bisa masuk" —

      if (!confirm("Hapus persetujuan akses orang ini? Post-test akan terkunci lagi baginya sampai mengajukan ulang.")) return;
      try {
        await DB.deletePtAccessRequest(ptDel.dataset.ptdelreq);
        toast("Akses dihapus.");
        const all = await DB.listAllPtAccessRequests(); state.rs1AccessRequests = all.rs1; state.rs2AccessRequests = all.rs2;
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    const resFilter = T.closest("[data-resultsfilter]");
    if (resFilter) {
      state.resultsFilter = resFilter.dataset.resultsfilter;
      document.querySelectorAll("[data-resultsfilter]").forEach(b => { const on = b.dataset.resultsfilter === state.resultsFilter; b.classList.toggle("btn--primary", on); b.classList.toggle("btn--ghost", !on); });
      const l = el("rsList"); if (l) l.innerHTML = resultsListHTML();
      return;
    }
    const viewRes = T.closest("[data-viewresult]");
    if (viewRes) { state.viewProfileId = viewRes.dataset.viewresult; show("resultdetail"); return; }

    // ---- Rock Solid 3 post-test: pilih jawaban (data-rs3ans) & kirim
    // (2026-09-23) — sama pola dgn DISC/SSD/Gifts di atas. ----
    const rs3Ans = T.closest("[data-rs3ans]");
    if (rs3Ans) {
      const [no, key] = rs3Ans.dataset.rs3ans.split(":");
      state.draft.rs3Answers[no] = key;
      RENDER.rs3();
      return;
    }
    if (T.closest("#rs3Save")) {
      const result = computeRs3Result(state.draft.rs3Answers);
      try {
        await DB.saveRs3Result({ answers:state.draft.rs3Answers, correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        state.rs3Result = await DB.myRs3Latest();
        toast(result.passed ? `Lulus (${result.bandLabel})! Kelas Rock Solid 3 sudah ditandai selesai.` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER.rs3();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }

    // ---- Lead To Serve 2 post-test: pilih jawaban (data-lts2ans) & kirim
    // (2026-09-23) — SAMA PERSIS pola RS3 di atas. ----
    const lts2Ans = T.closest("[data-lts2ans]");
    if (lts2Ans) {
      const [no, key] = lts2Ans.dataset.lts2ans.split(":");
      state.draft.lts2Answers[no] = key;
      RENDER.lts2();
      return;
    }
    if (T.closest("#lts2Save")) {
      const result = computeLts2Result(state.draft.lts2Answers);
      try {
        await DB.saveLts2Result({ answers:state.draft.lts2Answers, correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        state.lts2Result = await DB.myLts2Latest();
        toast(result.passed ? `Lulus (${result.bandLabel})! Kelas Lead To Serve 2 sudah ditandai selesai.` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER.lts2();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }

    // ---- Serve Road Map: checkbox Vision (data-rmarea) & tombol Simpan
    // per bagian (data-rmsave) — 2026-09-23 ("kerjakan yang experience"),
    // rmarea belum dipakai section "experience" tp digenerikkan sekalian
    // spy Vision (checkboxList) nanti tinggal jalan, tak perlu diubah lagi. ----
    const rmArea = T.closest("[data-rmarea]");
    if (rmArea) {
      const a = rmArea.dataset.rmarea;
      // Satu2nya checkboxList di ROADMAP_SECTIONS skrg cuma "holyDiscontentAreas"
      // (bagian Vision) — key-nya ditulis langsung, tak perlu dicari dari DOM.
      const cur = Array.isArray(state.draft.roadmapData.holyDiscontentAreas) ? state.draft.roadmapData.holyDiscontentAreas.slice() : [];
      const idx = cur.indexOf(a);
      if (idx >= 0) cur.splice(idx, 1); else cur.push(a);
      state.draft.roadmapData.holyDiscontentAreas = cur;
      RENDER[state.page] && RENDER[state.page]();
      return;
    }
    const rmSave = T.closest("[data-rmsave]");
    if (rmSave) {
      const sectionKey = rmSave.dataset.rmsave;
      const sec = ROADMAP_SECTIONS.find(s => s.key === sectionKey);
      const patch = Object.fromEntries(sec.fields.map(f => [f.key, state.draft.roadmapData[f.key]]));
      try {
        await DB.saveRoadmapSection(CURRENT_YEAR, patch);
        state.myRoadmap = await DB.myRoadmap(CURRENT_YEAR);
        // 2026-09-23 (permintaan user - ide "auto-tandai kelas Lead To Serve 1
        // begitu 5 bagian S-E-R-V-E lengkap", diusulkan Claude, dipilih user
        // "1,3 jalankan"): dicek SETIAP simpan bagian apa pun (bukan cuma
        // Expansion — bagian TERAKHIR yg diisi bisa yg mana saja) — kalau
        // KELIMA bagian sudah terisi (serveSectionFilled(), definisi SAMA
        // dgn banner "Serve Road Map Lengkap!" di serveGridHTML()), tandai
        // kelas LTS1 (index 3) selesai di JB3. markClassComplete()
        // mengembalikan false kalau sudah pernah ditandai — tak toast ulang.
        let justCompleted = false;
        if (SERVE_SECTIONS.every(s2 => serveSectionFilled(s2.key))) {
          try { justCompleted = await DB.markClassComplete(3); }
          catch (e) { /* non-fatal — jangan blokir alur simpan biasa kalau ini gagal */ }
        }
        toast(justCompleted ? "🎉 Serve Road Map lengkap — kelas Lead To Serve 1 ditandai selesai!" : `${sec.title} disimpan.`);
        show("home");
      } catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }
  });

  document.addEventListener("input", e => {
    const rm = e.target.closest("[data-rmfield]");
    if (rm) state.draft.roadmapData[rm.dataset.rmfield] = rm.value;
    if (e.target.id === "rsSearch") { state.resultsQuery = e.target.value; const l = el("rsList"); if (l) l.innerHTML = resultsListHTML(); }
  });

  // 2026-10-19: dibuka di lapisan (iframe) JB3 → beri tahu JB3 begitu layar pertama tampil (spinner JB3 tak perlu
  // menunggu foto/huruf selesai dimuat).
  function pingReady() { if (window.parent !== window && !pingReady.done) { pingReady.done = true; try { window.parent.postMessage({ dj:"ready" }, "*"); } catch (e) {} } }
  boot().then(pingReady, pingReady);
})();
</script>
</body>
</html>
