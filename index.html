<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipleship Journey</title>
<meta name="description" content="Asesmen pribadi jemaat — Strength, Experience, Relationship, Vision, Expansion (Serve Road Map).">
<link rel="apple-touch-icon" href="./icon-192.png?v=1">
<meta name="theme-color" content="#241F30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lead To Serve">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;600;700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px; }

  :root {
    --paper:#F6F3F9; --surface:#FFFFFF; --surface-2:#EFE9F5;
    --ink:#2A2438; --ink-soft:#5D5470; --ink-faint:#8B819C;
    --line:#E3DCEE; --line-strong:#D0C4E3;
    --accent:#4B3F72; --accent-ink:#372E54;
    --good:#4C7A54; --warn:#B4822F; --bad:#B2433A; --badge:#B2433A;
    --disc-d:#C0504D; --disc-i:#C99A2E; --disc-s:#4F8F5B; --disc-c:#4472A8;
    --canvas:#241F30;
    --shadow: 0 1px 2px rgba(40,30,60,.06), 0 8px 24px rgba(40,30,60,.08);
    --r-sm:10px; --r-md:16px; --r-lg:24px;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Karla", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1B1723; --surface:#241F30; --surface-2:#2D2739;
      --ink:#EDE8F5; --ink-soft:#C4BBD6; --ink-faint:#8F84A3;
      --line:#332C42; --line-strong:#443A57;
      --accent:#B0A3E8; --accent-ink:#D3C9F5;
      --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
      --canvas:#0F0D15;
    }
  }
  :root[data-theme="dark"] {
    --paper:#1B1723; --surface:#241F30; --surface-2:#2D2739;
    --ink:#EDE8F5; --ink-soft:#C4BBD6; --ink-faint:#8F84A3;
    --line:#332C42; --line-strong:#443A57;
    --accent:#B0A3E8; --accent-ink:#D3C9F5;
    --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
    --canvas:#0F0D15;
  }

  body {
    font-family: var(--font-body); font-weight: 500;
    background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 16px 56px; }
  .masthead { text-align: center; max-width: 560px; color: #F1ECFA; }
  .masthead .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #C9B8F0; }
  .masthead h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -.01em; margin: 4px 0 6px; color: #fff; }
  .masthead p { margin: 0; color: rgba(241,236,250,.82); font-size: 14px; line-height: 1.5; }

  .phone { position: relative; width: 390px; height: 844px; background: var(--paper); border-radius: 46px; box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.07); padding: 10px; flex: none; }
  @media (min-width: 640px) { .phone { width: clamp(390px, 40vw, 520px); height: clamp(760px, 88vh, 980px); } }
  .screen-frame { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; isolation: isolate; }
  @media (max-width: 480px) {
    html { height: 100%; height: 100dvh; }
    body { position: fixed; top: 0; left: 0; right: 0; overflow: hidden; height: 100%; height: 100dvh; height: var(--app-h, 100dvh); }
    .stage { padding: 0; gap: 0; min-height: 0; height: 100%; }
    .masthead { display: none; }
    .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
    .screen-frame { border-radius: 0; height: 100%; }
  }

  .appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 12px calc(18px + env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); }
  .appbar__back { border: none; background: none; padding: 6px; margin: -6px 0 -6px -6px; color: var(--ink); cursor: pointer; border-radius: 8px; display: none; }
  .appbar[data-back="true"] .appbar__back { display: inline-flex; }
  .appbar__logo { flex: none; height: 26px; width: 26px; object-fit: contain; border-radius: 7px; }
  .appbar__title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rolepill { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

  .identitybar { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 16px 9px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .identitybar .ib-ava { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 12px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }
  .identitybar .ib-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .identitybar .ib-name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--accent-ink); }

  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll.has-tabbar { padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
  .page { padding: 18px 18px 28px; display: none; }
  .page.active { display: block; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 2px 10px; }
  h2.section:first-child { margin-top: 4px; }
  .divider-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 14px; }
  .sub { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .muted { color: var(--ink-faint); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
  .card.pad { padding: 16px; }
  .card.pad.sm { padding: 12px; }

  .btn { -webkit-appearance: none; appearance: none; font-family: var(--font-body); font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn--sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; font-family: var(--font-body); font-size: 14.5px; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .field textarea { min-height: 70px; resize: vertical; }
  .err { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 10px; min-height: 1em; }

  .tabbar { position: absolute; z-index: 20; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); border-radius: 22px; background: color-mix(in srgb, var(--paper) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); box-shadow: 0 10px 30px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.28); padding: 7px 6px 8px; }
  .tab { position: relative; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 2px; color: var(--ink-faint); font-family: var(--font-body); font-size: 9.5px; font-weight: 700; border-radius: 14px; min-height: 42px; }
  .tab .ico { display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab[aria-current="page"] .ico { background: var(--accent); }
  .tab[aria-current="page"] .ico svg { stroke: var(--paper); }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag--done { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
  .tag--todo { background: var(--surface-2); color: var(--ink-faint); }

  .avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 13px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }

  /* 2026-09-22 (asesmen DISC): 1 kelompok = 4 kata sifat (D/I/S/C), tiap
     kata punya 2 tombol kecil (✓ paling / ✗ paling kurang). */
  .discgroup { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .discgroup .gno { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); margin-bottom: 6px; }
  .discrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .discrow .word { flex: 1; }
  .discpick { display: flex; gap: 4px; flex: none; }
  .discpick button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-faint); font-size: 10px; font-weight: 800; cursor: pointer; }
  .discpick button[aria-pressed="true"].sangat { background: var(--good); border-color: var(--good); color: #fff; }
  .discpick button[aria-pressed="true"].kurang { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* 2026-09-23 (dipakai fieldHTML checkboxList/Vision & asesmen SSD baru):
     sempat tak sengaja hilang saat kerangka dirombak — ketauan lagi sekarang
     krn SSD butuh .roleseg utk tombol skala 6-pilihan tiap pernyataan. */
  .roleseg { display: flex; gap: 4px; flex-wrap: wrap; }
  .roleseg button { flex: 1 1 auto; min-width: 44px; min-height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; }
  .roleseg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .qrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .qrow:last-child { border-bottom: none; }
  .qrow .qtext { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
  .qrow .qno { color: var(--ink-faint); font-weight: 800; margin-right: 4px; }

  .barrow { margin-bottom: 10px; }
  .barrow .bhead { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px; }
  .barrow .bhead b { font-weight: 700; }
  .barbg { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .barbg > i { display: block; height: 100%; border-radius: 999px; }

  .login { max-width: 340px; margin: 0 auto; padding: 30px 22px; }
  .login .brandmark { text-align: center; margin-bottom: 22px; }
  .login .brandmark img { width: 56px; height: 56px; object-fit: contain; margin: 0 auto 10px; display: block; }
  .login .brandmark .churchname { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .login h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 4px; text-align: center; }
  .login p.sub { text-align: center; margin: 0 0 18px; }

  /* 2026-09-22 (kerangka S-E-R-V-E): ubin bulat "3D" gradient, pola visual
     SAMA prinsipnya dgn .cat-chip di JB3 HOME Tracker (dot warna beda tiap
     huruf) — supaya begitu tool-nya dibangun nanti, tinggal tempel di
     dalam kartu yg SUDAH ada, bukan rombak ulang tampilan. */
  .serve-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .serve-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px 10px; cursor: pointer; font-family: var(--font-body); }
  .serve-tile .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-size: 19px; font-weight: 600; color: #fff; background: linear-gradient(150deg, var(--dot), color-mix(in srgb, var(--dot) 70%, #000)); }
  .serve-tile b { font-family: var(--font-display); font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .serve-tile .sub { font-size: 10px; }
  .empty { text-align: center; padding: 30px 14px; color: var(--ink-faint); font-size: 13px; }

  /* 2026-09-23 (permintaan user, "hasil yang dapat di print dalam bentuk
     tabel seperti file ini" — screenshot lembar asli "JB3 SERVE ROADMAP"):
     lembar cetak SENGAJA putih-hitam polos (bukan ikut tema gelap aplikasi)
     krn ini tiruan dokumen kertas, bukan bagian tampilan app biasa. Trik
     "visibility hidden/visible" (BUKAN display:none) dipakai spy tak perlu
     mengubah ukuran .phone/.screen-frame utk cetak — jauh lebih aman drpd
     coba melebarkan bingkai simulasi HP saat @media print. */
  .printsheet { display: none; background: #fff; color: #000; padding: 14px; font-family: Georgia, "Times New Roman", serif; }
  .printsheet, .printsheet * { color: #000; }
  .printsheet h1 { font-size: 15px; margin: 0 0 6px; text-align: center; letter-spacing: .02em; }
  .printsheet .psmeta { display: flex; justify-content: space-between; font-size: 10.5px; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 4px 0; margin-bottom: 8px; }
  .printsheet .pscols { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid #000; }
  .printsheet .pscol { border-right: 1px solid #000; padding: 7px; font-size: 8.5px; }
  .printsheet .pscol:last-child { border-right: none; }
  .printsheet .pscol h2 { font-size: 9px; text-align: center; background: #eee; margin: -7px -7px 7px; padding: 4px; border-bottom: 1px solid #000; }
  .printsheet .psblock { margin-bottom: 8px; }
  .printsheet .psblock > b { display: block; font-size: 8.5px; margin-bottom: 2px; }
  .printsheet .psline { border-bottom: 1px solid #999; min-height: 12px; padding: 1px 0 2px; white-space: pre-wrap; word-break: break-word; }
  .printsheet .psexphead { border: 1px solid #000; border-top: none; padding: 4px 8px; font-size: 9.5px; font-weight: bold; text-align: center; background: #eee; }
  .printsheet .psexp { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid #000; border-top: none; }
  .printsheet .psexp > div { border-right: 1px solid #000; padding: 7px; font-size: 8.5px; }
  .printsheet .psexp > div:last-child { border-right: none; }
  /* 2026-09-23 (bug nyata, user: "hasil unduhan asesmen dan road map
     terpotong"): akar masalah — `pagebreak: {mode:["css","legacy"]}` di
     downloadPdf()/sharePdf() tak py aturan CSS page-break APAPUN utk
     dipatuhi mode "css"-nya, jadi SELALU jatuh ke mode "legacy" (potong
     piksel mentah tanpa peduli batas elemen) tiap kali kontennya lebih
     tinggi dari 1 halaman A4 — teks/kolom terpotong PAS di tengah kalimat
     kalau kebetulan jatuh di batas halaman. Diperbaiki: SEMUA blok konten
     (kolom S-E-R-V-E, sel Expansion, tiap baris narasi Hasil Asesmen) diberi
     `page-break-inside:avoid` (+`break-inside` versi modern) — html2pdf.js
     mode "css" jd bisa geser SELURUH blok itu ke halaman berikutnya kalau
     tak muat, bukan memotongnya di tengah. Lembar Road Map "1 Lembar" bisa
     jd 2 halaman kalau isiannya sangat panjang — itu tukar-tambah yg
     disengaja (2 halaman utuh jauh lebih baik drpd 1 halaman yg datanya
     hilang separuh). `pagebreak` mode jg diganti ke ["css","avoid-all"]
     (avoid-all = jaring pengaman otomatis utk elemen manapun yg lolos dari
     daftar CSS di atas, GANTI legacy yg justru sumber masalahnya). */
  .printsheet .pscol, .printsheet .psexp > div, .printsheet .psblock,
  .printsheet .rphead, .printsheet .rpsub, .printsheet .rpp, .printsheet .rpul li {
    page-break-inside: avoid; break-inside: avoid;
  }
  @media print {
    body * { visibility: hidden; }
    .printsheet, .printsheet * { visibility: visible; }
    .printsheet { display: block; position: absolute; left: 0; top: 0; width: 100%; }
  }
  /* 2026-09-23 (permintaan user, "Hasil asesmen dari semua isian kamu buat
     detail yang bisa dibaca dan juga di download"): varian narasi utk lembar
     "Hasil Asesmen" lengkap — beda dari .pscols (tabel ringkas 5-kolom) krn
     ini paragraf panjang yg perlu dibaca, dipakai bareng #printSheetBody yg
     sama (lihat downloadPdf() — kontennya diganti-ganti tergantung tombol). */
  .printsheet .rpname { font-size: 16px; text-align: center; margin: 0 0 2px; }
  .printsheet .rphead { font-size: 12.5px; font-weight: bold; margin: 16px 0 6px; border-bottom: 2px solid #000; padding-bottom: 3px; }
  .printsheet .rphead:first-of-type { margin-top: 10px; }
  .printsheet .rpsub { font-size: 10.5px; font-weight: bold; margin: 9px 0 3px; }
  .printsheet .rpp { font-size: 10px; line-height: 1.55; margin: 0 0 7px; }
  .printsheet .rpul { font-size: 10px; line-height: 1.55; margin: 0 0 8px 16px; padding: 0; }
  /* 2026-09-23: wadah potret html2canvas (#printSheetOverlay/#printSheetBody,
     `.printsheet--capture`, `.printsheetoverlay*`) yg dulu ada di sini SUDAH
     DIHAPUS — 4 percobaan berturut2 memperbaikinya (2x "PDF kosong", 2x
     "terpotong", riwayat lengkap di memory project) semua gagal krn akar
     masalahnya adalah PENDEKATANNYA sendiri (screenshot DOM via html2canvas,
     rentan thd breakpoint/overflow ancestor manapun) — BUKAN detail
     posisi/overflow yg terus-menerus diperbaiki. PDF sekarang digambar
     LANGSUNG pakai jsPDF (lihat buildRoadMapPdf()/buildHasilPdf()), TANPA
     html2canvas sama sekali. `.printsheet` (base style di atas) TETAP
     dipakai — bukan lagi utk potret, tapi utk halaman "Lihat" (RENDER.
     serveview/hasilview, render HTML biasa, tak pernah py masalah ini). */
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <div class="eyebrow">Gereja JB3</div>
    <h1>Discipleship Journey</h1>
    <p>Kelas &amp; asesmen pemuridan JB3 — Rock Solid, Lead To Serve, dan seterusnya, dalam satu tempat.</p>
  </div>
  <div class="phone">
    <div class="screen-frame">
      <header class="appbar hidden" id="appbar" data-back="false">
        <button class="appbar__back" id="backBtn" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <img class="appbar__logo" src="./logo-mark.png" alt="JB3 Church">
        <div class="appbar__title" id="appbarTitle">Discipleship Journey</div>
        <button class="rolepill" id="rolePill">Keluar</button>
      </header>
      <div class="identitybar hidden" id="identityBar"></div>
      <div id="app">
        <div class="scroll has-tabbar">
          <section class="page" data-page="login"><div id="loginBody"></div></section>
          <section class="page" data-page="home"><div id="homeBody"></div></section>
          <section class="page" data-page="strength"><div id="strengthBody"></div></section>
          <section class="page" data-page="experience"><div id="experienceBody"></div></section>
          <section class="page" data-page="relationship"><div id="relationshipBody"></div></section>
          <section class="page" data-page="vision"><div id="visionBody"></div></section>

  // pakai jsPDF murni (koordinat mm, teks/garis/kotak) — BUKAN "memotret"

  function pdfReady() { return !!(window.jspdf && window.jspdf.jsPDF); }
  // Alur teks vertikal (dipakai buildHasilPdf) — otomatis pindah halaman
  // (doc.addPage()) kalau blok berikutnya tak muat lagi, JADI TAK PERNAH
  // ada teks terpotong: kalau tak muat, digeser UTUH ke halaman baru.
  function pdfFlow(doc, M) {
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();
    let y = M;
    const ensure = h => { if (y + h > PH - M) { doc.addPage(); y = M; } };
    return {
      get y() { return y; },
      heading1(text) {
        doc.setFont("helvetica", "bold"); doc.setFontSize(14);
        ensure(doc.getLineHeight() + 2);
        doc.text(text, PW / 2, y + doc.getLineHeight() * 0.7, { align: "center" });
        y += doc.getLineHeight() + 2;
      },
      centerLine(text) {
        doc.setFont("helvetica", "bold"); doc.setFontSize(11);
        ensure(doc.getLineHeight() + 2);
        doc.text(text, PW / 2, y + doc.getLineHeight() * 0.7, { align: "center" });
        y += doc.getLineHeight() + 3;
      },
      metaLine(left, right) {
        doc.setLineWidth(0.4); doc.setDrawColor(0);
        ensure(10);
        doc.line(M, y, PW - M, y); y += 4;
        doc.setFont("helvetica", "normal"); doc.setFontSize(9);
        doc.text(left, M, y); doc.text(right, PW - M, y, { align: "right" });
        y += 2; doc.line(M, y, PW - M, y); y += 5;
      },
      head(text) {
        doc.setFont("helvetica", "bold"); doc.setFontSize(11.5);
        ensure(doc.getLineHeight() + 6);
        y += 2; doc.text(text, M, y); y += 1.3;
        doc.setLineWidth(0.5); doc.setDrawColor(0); doc.line(M, y, PW - M, y);
        y += 4;
      },
      sub(text) {
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
        ensure(doc.getLineHeight() + 2);
        doc.text(text, M, y); y += doc.getLineHeight() + 1.3;
      },
      para(text) {
        doc.setFont("helvetica", "normal"); doc.setFontSize(9);
        const lines = doc.splitTextToSize(String(text || "-"), PW - 2 * M);
        const h = lines.length * doc.getLineHeight();
        ensure(h);
        doc.text(lines, M, y); y += h + 2.5;
      },
      bullets(arr) {
        doc.setFont("helvetica", "normal"); doc.setFontSize(9);
        if (!arr || !arr.length) { this.para("-"); return; }
        arr.forEach(t => {
          const lines = doc.splitTextToSize("• " + t, PW - 2 * M - 3);
          const h = lines.length * doc.getLineHeight();
          ensure(h);
          doc.text(lines, M + 3, y); y += h + 1;
        });
        y += 1.5;
      },
    };
  }
  // Lembar "JB3 SERVE ROADMAP" — A4 landscape TETAP (permintaan user),

  function buildRoadMapPdf() {
    const rd = state.draft.roadmapData || {};
    const disc = state.myDisc, ssd = state.mySsd, gifts = state.myGifts;
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "landscape" });
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();

    y += 9;
    doc.setLineWidth(0.4); doc.setDrawColor(0); doc.line(M, y, PW - M, y); y += 4.5;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text(`Nama: ${(state.myProfile || {}).name || ""}`, M, y);
    doc.text(`Tanggal Cetak: ${fmtDateID(new Date().toISOString())}`, PW - M, y, { align: "right" });
    y += 2.5; doc.line(M, y, PW - M, y); y += 5;
    const tableTop = y;
    const discGraphText = g => `D:${g.D} I:${g.I} S:${g.S} C:${g.C}`;
    const cols = [
      { title: "STRENGTH", blocks: [
        ["Karunia Rohani Paling Menonjol", gifts ? gifts.scores.top3.map(giftName).join(", ") : ""],
        ["Karunia Rohani Cukup Menonjol", gifts ? gifts.scores.next3.map(giftName).join(", ") : ""],

      { title: "EXPERIENCE", blocks: [

        ["Titik Tertinggi", rd.highPoint],
        ["Titik Terendah", rd.lowPoint],
      ] },
      { title: "RELATIONSHIP", blocks: [
        ["DISC (3 Graph)", disc ? `Graph 1 — ${discGraphText(disc.graph1)}; Graph 2 — ${discGraphText(disc.graph2)}; Graph 3 — ${discGraphText(disc.graph3)}` : ""],
        ["Berjalan (mentor)", rd.mentorWalking],
        ["Duduk (buddy)", rd.buddySitting],
        ["Berdiri (mentee)", rd.menteeStanding],
        ["Adaptasi 3A", rd.adaptation3A],
      ] },
      { title: "VISION", blocks: [
        ["Area Holy Discontent", (rd.holyDiscontentAreas || []).map(a => a === "Lain-lain" && rd.holyDiscontentOther ? `Lain-lain: ${rd.holyDiscontentOther}` : a).join(", ")],
        ["Holy Discontent Statement", rd.holyDiscontentStatement],
      ] },
      { title: "IDENTITY & DIRECTION", blocks: [
        ["Vision Statement", rd.visionStatement],
        ["Mission Statement", rd.missionStatement],
        ["Core Values", [1, 2, 3, 4, 5].map(n => rd["coreValue" + n] ? `${n}. ${rd["coreValue" + n]}` : "").filter(Boolean).join("; ")],
      ] },
    ];
    const expCols = [["1. Goal", rd.goal], ["2. Measurement", rd.measurement], ["3. When", rd.when], ["4. How", rd.how], ["5. Who", rd.who]];
    const colW = (PW - 2 * M) / cols.length, pad = 2.3, headerH = 6.5;
    const expColW = (PW - 2 * M) / expCols.length;
    const measure = fSize => {
      doc.setFontSize(fSize);
      const colHeights = cols.map(col => {
        let h = headerH + 2;

      });
      let expMaxLines = 1;
      expCols.forEach(([, value]) => { expMaxLines = Math.max(expMaxLines, doc.splitTextToSize(String(value || "-"), expColW - pad * 2).length); });
      const expH = headerH + doc.getLineHeight() * (expMaxLines + 1) + 3;

    cols.forEach((col, i) => {

      doc.setFillColor(236, 236, 236);
      doc.rect(x, tableTop, colW, headerH, "F"); doc.rect(x, tableTop, colW, headerH);
      doc.setFont("helvetica", "bold"); doc.setFontSize(fSize + 0.5);
      doc.text(col.title, x + colW / 2, tableTop + headerH / 2 + 1.3, { align: "center" });
      doc.setFontSize(fSize);
      let cy = tableTop + headerH + 4;
      col.blocks.forEach(([label, value]) => {
        doc.setFont("helvetica", "bold"); doc.text(label, x + pad, cy);
        cy += doc.getLineHeight();
        doc.setFont("helvetica", "normal");
        const lines = doc.splitTextToSize(String(value || "-"), colW - pad * 2);
        doc.text(lines, x + pad, cy);
        cy += lines.length * doc.getLineHeight() + 1.6;
      });
    });
    y = tableTop + maxH + 5;
    // Jalan aman terakhir (lihat komentar di measure()/shrink-loop di atas):
    // kalau SETELAH dikecilkan ke font terkecil baris Expansion ini tetap
    // tak muat di sisa halaman ini, pindah ke halaman baru dulu.
    doc.setFontSize(fSize);
    if (y + m.expH > PH - M) { doc.addPage(); y = M; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(fSize + 0.5);
    doc.setFillColor(236, 236, 236);
    doc.rect(M, y, PW - 2 * M, headerH, "F"); doc.rect(M, y, PW - 2 * M, headerH);
    doc.text("EXPANSION — ACTION PLAN", PW / 2, y + headerH / 2 + 1.3, { align: "center" });
    y += headerH;
    doc.setFontSize(fSize);
    let expMaxLines = 1;
    const expWrapped = expCols.map(([, value]) => {

    doc.rect(M, y, PW - 2 * M, expH);

      doc.setFont("helvetica", "bold"); doc.text(label, x + pad, y + doc.getLineHeight() + 1);
      doc.setFont("helvetica", "normal"); doc.text(expWrapped[i], x + pad, y + doc.getLineHeight() * 2 + 1);
    });
    return doc;
  }

  // 2026-09-23 (permintaan user, "...bisa diunduh dan share dalam bentuk

  // ("blob")`) lalu dibungkus jadi File utk dioper ke navigator.share()
  // (Web Share API level-2), BUKAN langsung men-trigger unduhan.
  async function sharePdf(buildFn, filename) {
    if (!pdfReady()) { toast("Fitur PDF belum siap, coba lagi sebentar."); return; }
    if (!(navigator.share && navigator.canShare)) { toast("Perangkat/browser ini tidak mendukung fitur Bagikan — gunakan tombol Unduh PDF, lalu bagikan filenya secara manual."); return; }
    try {
      const blob = buildFn().output("blob");
      const file = new File([blob], filename, { type: "application/pdf" });
      if (!navigator.canShare({ files: [file] })) { toast("Perangkat ini tidak mendukung berbagi file PDF — gunakan tombol Unduh PDF saja."); return; }
      await navigator.share({ files: [file], title: filename });
    } catch (err) {
      if (err && err.name === "AbortError") return;   // pengguna batal di dialog share — bukan error, diam saja
      toast("Gagal menyiapkan/membagikan PDF: " + (err.message || err));
    }
  }

  // 2026-09-23 (permintaan user, "buat fit to screen iphone dan android"):
  // lembar 1400px/900px SEBELUMNYA cuma bisa dilihat penuh dgn geser ke
  // samping (overflow-x:auto) — sekarang diperkecil OTOMATIS (CSS
  // transform:scale, dihitung dari lebar wadah SUNGGUHAN saat itu — jd
  // otomatis benar di layar iPhone, Android, ATAUPUN simulator desktop,

  // layar tanpa perlu geser sama sekali. Tinggi wadah ikut disesuaikan
  // (naturalHeight*scale) spy tak ada ruang kosong sisa di bawah.
  function fitPreviewToScreen(wrapId) {
    requestAnimationFrame(() => {
      const wrap = el(wrapId);
      const inner = wrap && wrap.firstElementChild;
      if (!wrap || !inner) return;
      const naturalW = inner.offsetWidth, naturalH = inner.offsetHeight;
      if (!naturalW || !naturalH) return;
      const scale = Math.min(1, wrap.clientWidth / naturalW);
      inner.style.transformOrigin = "top left";
      inner.style.transform = `scale(${scale})`;
      wrap.style.height = Math.ceil(naturalH * scale) + "px";
    });
  }

  // 2026-09-23 (permintaan user, "Hasil asesmen dari semua isian kamu buat
  // detail yang bisa dibaca dan juga di download"): satu fungsi merangkai
  // interpretasi dari SEMUA instrumen (DISC/SSD/Karunia Rohani) + isian Serve
  // Road Map sendiri jadi objek narasi — dipakai BERSAMA oleh tampilan layar
  // (hasilOnScreenHTML, gaya app biasa) & lembar PDF (hasilReportHTML, gaya
  // dokumen), spy logika interpretasi tak dobel ditulis.
  // 2026-09-23 (permintaan user, "admin dapat melihat setiap hasil test dan
  // asesment dari setiap pengguna..."): parameter ditambahkan dgn DEFAULT
  // jatuh balik ke state.my*/state.draft.roadmapData — pemanggilan LAMA
  // `buildHasilNarrative()` tanpa argumen (RENDER.hasil, tombol PDF) TETAP
  // berfungsi PERSIS spt sebelumnya; pemanggilan BARU dgn argumen eksplisit
  // (RENDER.resultdetail, Admin lihat hasil org lain) memakai data ORANG
  // ITU, bukan diri sendiri. Sengaja TIDAK dibuat 2 fungsi terpisah (dobel
  // logic interpretasi DISC/SSD/Gifts yg cukup panjang, rawan divergen).
  function buildHasilNarrative(disc, ssd, gifts, roadmapData) {
    if (disc === undefined) disc = state.myDisc;
    if (ssd === undefined) ssd = state.mySsd;
    if (gifts === undefined) gifts = state.myGifts;
    const rd = roadmapData !== undefined ? roadmapData : (state.draft.roadmapData || {});
    let discLetter = null, discProfile = null;
    if (disc) {
      discLetter = DISC_LETTERS.reduce((a, b) => (disc.graph3[b] > disc.graph3[a] ? b : a), DISC_LETTERS[0]);
      discProfile = DISC_PROFILES[discLetter];
    }
    const ssdLow = [], ssdHealthy = [];
    if (ssd) {
      SSD_CATEGORIES.forEach(c => {
        const v = ssd.scores[c.code];
        if (v < 0) ssdLow.push({ code:c.code, name:c.name, nameEn:c.nameEn, score:v, def:SSD_INSIGHT[c.code].def, text:SSD_INSIGHT[c.code].low });
        else ssdHealthy.push({ code:c.code, name:c.name, nameEn:c.nameEn, score:v, def:SSD_INSIGHT[c.code].def });
      });
      ssdLow.sort((a, b) => a.score - b.score);
    }
    const giftDetail = code => { const g = GIFTS_LIST.find(x => x.code === code); return { code, name:giftName(code), def:g ? g.def : "" }; };
    const giftsTop3 = gifts ? gifts.scores.top3.map(giftDetail) : [];
    const giftsNext3 = gifts ? gifts.scores.next3.map(giftDetail) : [];
    const own = [
      rd.abilityText && { label:"Yang Bisa Dilakukan dengan Baik (Ability)", text:rd.abilityText },
      rd.passionText && { label:"Yang Disukai (Passion)", text:rd.passionText },
      rd.strengthStatement && { label:"Strength Statement", text:rd.strengthStatement },
      rd.highPoint && { label:"Titik Tertinggi (Experience)", text:rd.highPoint },
      rd.lowPoint && { label:"Titik Terendah (Experience)", text:rd.lowPoint },
      rd.holyDiscontentStatement && { label:"Holy Discontent Statement", text:rd.holyDiscontentStatement },
      rd.visionStatement && { label:"Vision Statement", text:rd.visionStatement },
      rd.missionStatement && { label:"Mission Statement", text:rd.missionStatement },
      rd.goal && { label:"Goal Pelayanan (Expansion)", text:rd.goal },
    ].filter(Boolean);
    const recoBits = [];
    if (discProfile) recoBits.push(`gaya kepribadian ${discProfile.name}`);
    if (giftsTop3.length) recoBits.push(`karunia rohani ${giftsTop3.map(g => g.name).join(", ")}`);
    const recommendation = recoBits.length
      ? `Berdasarkan kombinasi ${recoBits.join(" dan ")}, area pelayanan yang berpotensi cocok antara lain: ${(discProfile ? discProfile.ministryFit.join(", ") : "-")}.`
      : "";
    // 2026-09-23 (permintaan user, "kata-kata 'yang perlu diperbaiki' di
    // kartu Hasil Asesmen dihapus"): dulu ada bagian "Yang Perlu Diperbaiki"
    // (DISC watchouts + SSD low-area insights) di layar & PDF — SEKARANG
    // tak ditampilkan sama sekali. `improve` tetap dihitung & dikembalikan
    // (murah, tak dipakai di UI manapun) siapa tahu dibutuhkan lagi nanti.
    const improve = [];
    if (discProfile) improve.push(...discProfile.watchouts);
    ssdLow.forEach(c => improve.push(c.text));
    return { discLetter, discProfile, ssdLow, ssdHealthy, giftsTop3, giftsNext3, own, recommendation, improve };
  }

  function resultBodyHTML(disc, ssd, gifts, roadmapData, rs3, lts2, viewingSelf) {
    const n = buildHasilNarrative(disc, ssd, gifts, roadmapData);
    const rs3HTML = rs3 ? `<div class="card pad"><p class="sub" style="margin:0;">${rs3.correct}/${rs3.total} benar (${rs3.score_pct}%) — <b>${esc(rs3.band)}</b>${rs3.passed ? " ✅ Lulus" : " — belum lulus"}</p></div>`
      : `<div class="card pad"><p class="sub" style="margin:0 0 ${viewingSelf ? 8 : 0}px;">Post-test Rock Solid 3 belum diambil${viewingSelf ? "" : " oleh peserta ini"}.</p>${viewingSelf ? `<button type="button" class="btn btn--ghost" data-goto="rs3">Ke Post-Test RS3</button>` : ""}</div>`;
    // 2026-09-23 ("jika limit cukup, buatkan post test utk LTS2") — SAMA
    // PERSIS pola rs3HTML di atas.
    const lts2HTML = lts2 ? `<div class="card pad"><p class="sub" style="margin:0;">${lts2.correct}/${lts2.total} benar (${lts2.score_pct}%) — <b>${esc(lts2.band)}</b>${lts2.passed ? " ✅ Lulus" : " — belum lulus"}</p></div>`
      : `<div class="card pad"><p class="sub" style="margin:0 0 ${viewingSelf ? 8 : 0}px;">Post-test Lead To Serve 2 belum diambil${viewingSelf ? "" : " oleh peserta ini"}.</p>${viewingSelf ? `<button type="button" class="btn btn--ghost" data-goto="lts2">Ke Post-Test LTS2</button>` : ""}</div>`;
    const discHTML = !disc ? `<div class="card pad" style="margin-bottom:12px;"><p class="sub" style="margin:0 0 ${viewingSelf ? 8 : 0}px;">DISC belum diisi${viewingSelf ? "" : " oleh peserta ini"}.</p>${viewingSelf ? `<button type="button" class="btn btn--ghost" data-goto="disc">Isi DISC</button>` : ""}</div>` : (() => {

      return `<div class="card pad" style="margin-bottom:12px;">

        ${discChartCard("Real (Kepribadian Asli)", "Gaya perilaku dasar yang relatif stabil di segala situasi.", g3, -max3, max3, "var(--good)")}

    // 2026-09-23 (permintaan user, "berikan penjelasan/keterangan hasil SSD"

        </div>`;
      })();
    const ownHTML = n.own.length ? `<div class="card pad">${n.own.map(o => `<div class="field" style="margin-bottom:10px;"><label>${esc(o.label)}</label><p class="sub" style="margin:2px 0 0;white-space:pre-wrap;">${esc(o.text)}</p></div>`).join("")}</div>`

  // diteruskan dari JB3 HOME Tracker lewat URL fragment (#at=...&rt=...) —
  // fragment TAK PERNAH terkirim ke server (murni dibaca browser), jadi aman
  // dipakai bawa token. Kalau ada, langsung pasang sesi (spy tak perlu ketik
  // ulang No. HP+kata sandi yg SAMA dgn akun JB3), lalu fragment dibersihkan
  // dari address bar (replaceState) spy token tak nyangkut di riwayat/URL.
  // 2026-09-22 susulan (permintaan user, "tambahkan notifikasi di icon
  // lonceng admin, pengajuan Lead To Serve"): fragment SEKARANG jg bisa bawa
  // "&p=<halaman>" opsional (dipakai tombol "Buka & Kelola" di lonceng JB3,
  // deep-link LANGSUNG ke halaman "dashboard" — bukan cuma beranda spt
  // sebelumnya). Dikembalikan sbg { ok, page } spy boot() tahu ke mana.
  async function claimHandoffSession() {
    const m = /^#at=([^&]+)&rt=([^&]+)(?:&p=([^&]+))?/.exec(location.hash);
    if (!m) return { ok:false, page:null };
    try {
      await sb.auth.setSession({ access_token:decodeURIComponent(m[1]), refresh_token:decodeURIComponent(m[2]) });
      history.replaceState(null, "", location.pathname + location.search);
      return { ok:true, page: m[3] ? decodeURIComponent(m[3]) : null };
    } catch (e) { console.error(e); return { ok:false, page:null }; }
  }

  // 2026-09-22 (perbaikan bug nyata, "di LTS1 admin1 tidak bisa masuk" —
  // ketauan dari screenshot: appbar "Lead To Serve 1"+tombol Keluar tampil
  // di ATAS form Masuk yg kosong): loadAll() utk Admin sempat berhasil set
  // state.persona="ADMIN" (baris myProfile() jalan duluan) SEBELUM baris
  // DB.listAllAccessRequests() di bawahnya gagal (query gabungan lts_access_
  // requests+profiles — kemungkinan cache skema PostgREST blm sempat
  // mengenali FK tabel baru itu tepat setelah migrasi dijalankan) — begitu
  // gagal, catch di sini balik ke "login" TAPI state.persona TAK PERNAH
  // direset, jadi renderChrome() masih anggap "sedang login" & menampilkan
  // appbar, walau halaman yg tampil form Masuk kosong. Diperbaiki 2 sisi:
  // (1) reset persona/myProfile eksplisit di sini spy tampilan selalu
  // konsisten APAPUN sebabnya, (2) listAllAccessRequests() (lihat db.js)
  // ditulis ulang tanpa join PostgREST spy tak bergantung ke cache skema.
  async function boot() {
    const handoff = await claimHandoffSession();
    const sess = await DB.session();
    if (!sess) { show("login", { replace:true }); return; }
    try {
      await loadAll();
      if (!state.myProfile) { Object.assign(state, { persona:null, myProfile:null }); show("login", { replace:true }); return; }
      show((handoff.page && META[handoff.page]) ? handoff.page : "home", { replace:true });
    } catch (e) {
      console.error(e);
      Object.assign(state, { persona:null, myProfile:null, meId:null });
      toast("Gagal memuat data: " + (e.message || e));
      show("login", { replace:true });
    }
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", async e => {
    const T = e.target;
    if (T.closest("#backBtn")) { goBack(); return; }
    const g = T.closest("[data-goto]");
    if (g) { show(g.dataset.goto); return; }

    if (T.closest("#liGo")) {
      const id = el("liId").value.trim(), pw = el("liPw").value;
      if (!id || !pw) { el("liErr").textContent = "Isi No. HP/Nama dan kata sandi."; return; }
      el("liErr").textContent = "";
      try { await DB.login({ id, password:pw }); await boot(); }
      catch (err) { el("liErr").textContent = "Gagal masuk: " + (err.message || err); }
      return;
    }
    if (T.closest("#pfLogout") || T.closest("#rolePill")) {
      await DB.logout().catch(() => {});
      Object.assign(state, { page:"login", stack:[], persona:null, meId:null, myProfile:null, accessStatus:null, accessRequests:[], myDisc:null, myRoadmap:null, mySsd:null, myGifts:null, rs3AccessStatus:null, rs3AccessRequests:[], rs3Result:null, lts2AccessStatus:null, lts2AccessRequests:[], lts2Result:null, participantResults:null, viewProfileId:null, resultsFilter:"all", draft:{ discPicks:[], roadmapData:{}, ssdAnswers:{}, giftsAnswers:{}, rs3Answers:{}, lts2Answers:{} } });
      show("login", { replace:true });
      return;
    }
    if (T.closest("#pfChangePw")) {
      const np = el("pfNewPw").value;
      if (np.length < 6) { toast("Minimal 6 karakter."); return; }
      try { await DB.changePassword(np); toast("Sandi diganti."); el("pfNewPw").value = ""; }
      catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    if (T.closest("#reqAccessBtn")) {
      try { await DB.requestAccess(); state.accessStatus = "pending"; toast("Permintaan terkirim ke Admin."); RENDER.home(); }
      catch (err) { toast("Gagal mengajukan: " + (err.message || err)); }
      return;
    }
    // 2026-09-23 (permintaan user, "buatkan link dari kartu carousel Rock
    // solid 3 ... perlu ijin admin") — sama pola dgn #reqAccessBtn LTS di
    // atas, target status/halaman beda (rs3AccessStatus/RENDER.rs3).
    if (T.closest("#reqRs3Btn")) {
      try { await DB.requestRs3Access(); state.rs3AccessStatus = "pending"; toast("Permintaan terkirim ke Admin."); RENDER.rs3(); }
      catch (err) { toast("Gagal mengajukan: " + (err.message || err)); }
      return;
    }
    // 2026-09-23 ("jika limit cukup, buatkan post test utk LTS2") — SAMA
    // PERSIS pola #reqRs3Btn di atas.
    if (T.closest("#reqLts2Btn")) {
      try { await DB.requestLts2Access(); state.lts2AccessStatus = "pending"; toast("Permintaan terkirim ke Admin."); RENDER.lts2(); }
      catch (err) { toast("Gagal mengajukan: " + (err.message || err)); }
      return;
    }

    // ---- DISC picks (2026-09-22, "bangun assesment DISC...") ----
    const ds2 = T.closest("[data-discsangat],[data-disckurang]");
    if (ds2) {
      const [key, val] = (ds2.dataset.discsangat || ds2.dataset.disckurang).split(":");
      const which = ds2.dataset.discsangat ? "sangat" : "kurang";
      const no = Number(key);
      const arr = state.draft.discPicks;
      arr[no - 1] = arr[no - 1] || { no };
      arr[no - 1][which] = arr[no - 1][which] === val ? null : val;
      RENDER.disc();
      return;
    }
    if (T.closest("#discSave")) {
      const { graph1, graph2, graph3 } = computeDiscGraphs(state.draft.discPicks);
      try {
        await DB.saveDisc(CURRENT_YEAR, { picks:state.draft.discPicks, graph1, graph2, graph3 });
        toast("Hasil DISC disimpan.");
        state.myDisc = await DB.myDisc(CURRENT_YEAR);
        show("home");
      } catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }

    // ---- SSD answers (2026-09-23, "tambahkan tools/isian SSD") ----
    const sa = T.closest("[data-ssdans]");
    if (sa) {
      const [no, code] = sa.dataset.ssdans.split(":");
      state.draft.ssdAnswers[no] = code;
      RENDER.ssd();
      return;
    }
    if (T.closest("#ssdSave")) {
      const scores = computeSsdScores(state.draft.ssdAnswers);
      try {
        await DB.saveSsd(CURRENT_YEAR, { answers:state.draft.ssdAnswers, scores });
        toast("Hasil SSD disimpan.");
        state.mySsd = await DB.mySsd(CURRENT_YEAR);
        show("home");
      } catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }

    // ---- Karunia Rohani answers (2026-09-23, "Karunia Rohani adalah
    // bagian dari Strength. kamu buatkan isiannya") ----
    const ga = T.closest("[data-giftsans]");
    if (ga) {
      const [no, val] = ga.dataset.giftsans.split(":");
      state.draft.giftsAnswers[no] = Number(val);
      RENDER.gifts();
      return;
    }
    if (T.closest("#giftsSave")) {
      const scores = computeGiftsScores(state.draft.giftsAnswers);
      try {
        await DB.saveGifts(CURRENT_YEAR, { answers:state.draft.giftsAnswers, scores });
        toast("Hasil Karunia Rohani disimpan.");
        state.myGifts = await DB.myGifts(CURRENT_YEAR);
        show("home");
      } catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }
    // 2026-09-23 (permintaan user, "bisa di download dalam bentuk pdf" +
    // "Hasil asesmen dari semua isian kamu buat detail yang bisa dibaca dan
    // juga di download"): 2 lembar PDF terpisah, masing2 pakai downloadPdf()
    // — nama file disertai nama peserta + tahun spy mudah dibedakan kalau
    // disimpan beberapa tahun berturut-turut.
    if (T.closest("#pdfServeBtn")) {
      downloadPdf(buildRoadMapPdf, `LTS1-Road-Map-${safeFileName((state.myProfile || {}).name)}-${CURRENT_YEAR}.pdf`);
      return;
    }
    if (T.closest("#pdfHasilBtn")) {
      downloadPdf(buildHasilPdf, `Hasil-Asesmen-${safeFileName((state.myProfile || {}).name)}-${CURRENT_YEAR}.pdf`);
      return;
    }
    // 2026-09-23 (permintaan user, "...bisa diunduh dan share dalam bentuk
    // pdf") — SAMA PERSIS isinya dgn #pdfServeBtn/#pdfHasilBtn di atas, cuma
    // pakai sharePdf() (dialog Bagikan OS) bukan downloadPdf() (simpan file).
    if (T.closest("#shareServeBtn")) {
      sharePdf(buildRoadMapPdf, `LTS1-Road-Map-${safeFileName((state.myProfile || {}).name)}-${CURRENT_YEAR}.pdf`);
      return;
    }
    if (T.closest("#shareHasilBtn")) {
      sharePdf(buildHasilPdf, `Hasil-Asesmen-${safeFileName((state.myProfile || {}).name)}-${CURRENT_YEAR}.pdf`);
      return;
    }
    const appReq = T.closest("[data-appreq]"), rejReq = T.closest("[data-rejreq]");
    if (appReq || rejReq) {
      const id = (appReq || rejReq).dataset.appreq || (appReq || rejReq).dataset.rejreq;
      try {
        await DB.decideAccessRequest(id, !!appReq);
        toast(appReq ? "Permintaan disetujui." : "Permintaan ditolak.");
        state.accessRequests = await DB.listAllAccessRequests();
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    // 2026-09-23 (permintaan user, "bagian nama-nama disetujui tambahkan
    // tombol hapus"): hapus baris lts_access_requests sepenuhnya — akses
    // orang itu tercabut, terkunci lagi sampai mengajukan ulang.
    const delReq = T.closest("[data-delreq]");
    if (delReq) {
      if (!confirm("Hapus persetujuan akses orang ini? Asesmen akan terkunci lagi baginya sampai mengajukan ulang.")) return;
      try {
        await DB.deleteAccessRequest(delReq.dataset.delreq);
        toast("Persetujuan dihapus.");
        state.accessRequests = await DB.listAllAccessRequests();
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }

    // 2026-09-23 (permintaan user, "buatkan link dari kartu carousel Rock
    // solid 3 ... perlu ijin admin") — sama pola persis dgn appReq/rejReq/
    // delReq LTS di atas, target rs3_access_requests + rs3DashboardHTML().
    const rs3AppReq = T.closest("[data-rs3appreq]"), rs3RejReq = T.closest("[data-rs3rejreq]");
    if (rs3AppReq || rs3RejReq) {
      const id = (rs3AppReq || rs3RejReq).dataset.rs3appreq || (rs3AppReq || rs3RejReq).dataset.rs3rejreq;
      try {
        await DB.decideRs3AccessRequest(id, !!rs3AppReq);
        toast(rs3AppReq ? "Permintaan disetujui." : "Permintaan ditolak.");
        state.rs3AccessRequests = await DB.listAllRs3AccessRequests();
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    const rs3DelReq = T.closest("[data-rs3delreq]");
    if (rs3DelReq) {
      if (!confirm("Hapus persetujuan akses orang ini? Post-test RS3 akan terkunci lagi baginya sampai mengajukan ulang.")) return;
      try {
        await DB.deleteRs3AccessRequest(rs3DelReq.dataset.rs3delreq);
        toast("Persetujuan dihapus.");
        state.rs3AccessRequests = await DB.listAllRs3AccessRequests();
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }

    // 2026-09-23 ("jika limit cukup, buatkan post test utk LTS2") — SAMA
    // PERSIS pola appReq/rejReq/delReq RS3 di atas.
    const lts2AppReq = T.closest("[data-lts2appreq]"), lts2RejReq = T.closest("[data-lts2rejreq]");
    if (lts2AppReq || lts2RejReq) {
      const id = (lts2AppReq || lts2RejReq).dataset.lts2appreq || (lts2AppReq || lts2RejReq).dataset.lts2rejreq;
      try {
        await DB.decideLts2AccessRequest(id, !!lts2AppReq);
        toast(lts2AppReq ? "Permintaan disetujui." : "Permintaan ditolak.");
        state.lts2AccessRequests = await DB.listAllLts2AccessRequests();
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    const lts2DelReq = T.closest("[data-lts2delreq]");
    if (lts2DelReq) {
      if (!confirm("Hapus persetujuan akses orang ini? Post-test LTS2 akan terkunci lagi baginya sampai mengajukan ulang.")) return;
      try {
        await DB.deleteLts2AccessRequest(lts2DelReq.dataset.lts2delreq);
        toast("Persetujuan dihapus.");
        state.lts2AccessRequests = await DB.listAllLts2AccessRequests();
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }

    // ---- Roster hasil peserta (Admin) — 2026-09-23, "admin dapat melihat
    // setiap hasil test dan asesment dari setiap pengguna" ----
    const resFilter = T.closest("[data-resultsfilter]");
    if (resFilter) { state.resultsFilter = resFilter.dataset.resultsfilter; RENDER.results(); return; }
    const viewRes = T.closest("[data-viewresult]");
    if (viewRes) { state.viewProfileId = viewRes.dataset.viewresult; show("resultdetail"); return; }

    // ---- Rock Solid 3 post-test: pilih jawaban (data-rs3ans) & kirim
    // (2026-09-23) — sama pola dgn DISC/SSD/Gifts di atas. ----
    const rs3Ans = T.closest("[data-rs3ans]");
    if (rs3Ans) {
      const [no, key] = rs3Ans.dataset.rs3ans.split(":");
      state.draft.rs3Answers[no] = key;
      RENDER.rs3();
      return;
    }
    if (T.closest("#rs3Save")) {
      const result = computeRs3Result(state.draft.rs3Answers);
      try {
        await DB.saveRs3Result({ answers:state.draft.rs3Answers, correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        state.rs3Result = await DB.myRs3Latest();
        toast(result.passed ? `Lulus (${result.bandLabel})! Kelas Rock Solid 3 sudah ditandai selesai.` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER.rs3();
      } catch (err) { toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }

    // ---- Lead To Serve 2 post-test: pilih jawaban (data-lts2ans) & kirim
    // (2026-09-23) — SAMA PERSIS pola RS3 di atas. ----
    const lts2Ans = T.closest("[data-lts2ans]");
    if (lts2Ans) {
      const [no, key] = lts2Ans.dataset.lts2ans.split(":");
      state.draft.lts2Answers[no] = key;
      RENDER.lts2();
      return;
    }
    if (T.closest("#lts2Save")) {
      const result = computeLts2Result(state.draft.lts2Answers);
      try {
        await DB.saveLts2Result({ answers:state.draft.lts2Answers, correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        state.lts2Result = await DB.myLts2Latest();
        toast(result.passed ? `Lulus (${result.bandLabel})! Kelas Lead To Serve 2 sudah ditandai selesai.` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER.lts2();
      } catch (err) { toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }

    // ---- Serve Road Map: checkbox Vision (data-rmarea) & tombol Simpan
    // per bagian (data-rmsave) — 2026-09-23 ("kerjakan yang experience"),
    // rmarea belum dipakai section "experience" tp digenerikkan sekalian
    // spy Vision (checkboxList) nanti tinggal jalan, tak perlu diubah lagi. ----
    const rmArea = T.closest("[data-rmarea]");
    if (rmArea) {
      const a = rmArea.dataset.rmarea;
      // Satu2nya checkboxList di ROADMAP_SECTIONS skrg cuma "holyDiscontentAreas"
      // (bagian Vision) — key-nya ditulis langsung, tak perlu dicari dari DOM.
      const cur = Array.isArray(state.draft.roadmapData.holyDiscontentAreas) ? state.draft.roadmapData.holyDiscontentAreas.slice() : [];
      const idx = cur.indexOf(a);
      if (idx >= 0) cur.splice(idx, 1); else cur.push(a);
      state.draft.roadmapData.holyDiscontentAreas = cur;
      RENDER[state.page] && RENDER[state.page]();
      return;
    }
    const rmSave = T.closest("[data-rmsave]");
    if (rmSave) {
      const sectionKey = rmSave.dataset.rmsave;
      const sec = ROADMAP_SECTIONS.find(s => s.key === sectionKey);
      const patch = Object.fromEntries(sec.fields.map(f => [f.key, state.draft.roadmapData[f.key]]));
      try {
        await DB.saveRoadmapSection(CURRENT_YEAR, patch);
        state.myRoadmap = await DB.myRoadmap(CURRENT_YEAR);
        // 2026-09-23 (permintaan user - ide "auto-tandai kelas Lead To Serve 1
        // begitu 5 bagian S-E-R-V-E lengkap", diusulkan Claude, dipilih user
        // "1,3 jalankan"): dicek SETIAP simpan bagian apa pun (bukan cuma
        // Expansion — bagian TERAKHIR yg diisi bisa yg mana saja) — kalau
        // KELIMA bagian sudah terisi (serveSectionFilled(), definisi SAMA
        // dgn banner "Serve Road Map Lengkap!" di serveGridHTML()), tandai
        // kelas LTS1 (index 3) selesai di JB3. markClassComplete()
        // mengembalikan false kalau sudah pernah ditandai — tak toast ulang.
        let justCompleted = false;
        if (SERVE_SECTIONS.every(s2 => serveSectionFilled(s2.key))) {
          try { justCompleted = await DB.markClassComplete(3); }
          catch (e) { /* non-fatal — jangan blokir alur simpan biasa kalau ini gagal */ }
        }
        toast(justCompleted ? "🎉 Serve Road Map lengkap — kelas Lead To Serve 1 ditandai selesai!" : `${sec.title} disimpan.`);
        show("home");
      } catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }
  });

  document.addEventListener("input", e => {
    const rm = e.target.closest("[data-rmfield]");
    if (rm) state.draft.roadmapData[rm.dataset.rmfield] = rm.value;
  });

  boot();
})();
</script>
</body>
