<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead To Serve 1</title>
<meta name="description" content="Asesmen pribadi jemaat — DISC, Skala Sikap Disfungsional, Karunia Rohani, dan Serve Road Map.">
<link rel="apple-touch-icon" href="./icon-192.png?v=1">
<meta name="theme-color" content="#241F30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lead To Serve">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;600;700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px; }

  :root {
    --paper:#F6F3F9; --surface:#FFFFFF; --surface-2:#EFE9F5;
    --ink:#2A2438; --ink-soft:#5D5470; --ink-faint:#8B819C;
    --line:#E3DCEE; --line-strong:#D0C4E3;
    --accent:#4B3F72; --accent-ink:#372E54;
    --good:#4C7A54; --warn:#B4822F; --bad:#B2433A; --badge:#B2433A;
    --canvas:#241F30;
    --disc-d:#C0504D; --disc-i:#C99A2E; --disc-s:#4F8F5B; --disc-c:#4472A8;
    --shadow: 0 1px 2px rgba(40,30,60,.06), 0 8px 24px rgba(40,30,60,.08);
    --r-sm:10px; --r-md:16px; --r-lg:24px;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Karla", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1B1723; --surface:#241F30; --surface-2:#2D2739;
      --ink:#EDE8F5; --ink-soft:#C4BBD6; --ink-faint:#8F84A3;
      --line:#332C42; --line-strong:#443A57;
      --accent:#B0A3E8; --accent-ink:#D3C9F5;
      --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
      --canvas:#0F0D15;
    }
  }
  :root[data-theme="dark"] {
    --paper:#1B1723; --surface:#241F30; --surface-2:#2D2739;
    --ink:#EDE8F5; --ink-soft:#C4BBD6; --ink-faint:#8F84A3;
    --line:#332C42; --line-strong:#443A57;
    --accent:#B0A3E8; --accent-ink:#D3C9F5;
    --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
    --canvas:#0F0D15;
  }

  body {
    font-family: var(--font-body); font-weight: 500;
    background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 16px 56px; }
  .masthead { text-align: center; max-width: 560px; color: #F1ECFA; }
  .masthead .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #C9B8F0; }
  .masthead h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -.01em; margin: 4px 0 6px; color: #fff; }
  .masthead p { margin: 0; color: rgba(241,236,250,.82); font-size: 14px; line-height: 1.5; }

  .phone { position: relative; width: 390px; height: 844px; background: var(--paper); border-radius: 46px; box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.07); padding: 10px; flex: none; }
  @media (min-width: 640px) { .phone { width: clamp(390px, 40vw, 520px); height: clamp(760px, 88vh, 980px); } }
  .screen-frame { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; isolation: isolate; }
  @media (max-width: 480px) {
    html { height: 100%; height: 100dvh; }
    body { position: fixed; top: 0; left: 0; right: 0; overflow: hidden; height: 100%; height: 100dvh; height: var(--app-h, 100dvh); }
    .stage { padding: 0; gap: 0; min-height: 0; height: 100%; }
    .masthead { display: none; }
    .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
    .screen-frame { border-radius: 0; height: 100%; }
  }

  .appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 12px calc(18px + env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); }
  .appbar__back { border: none; background: none; padding: 6px; margin: -6px 0 -6px -6px; color: var(--ink); cursor: pointer; border-radius: 8px; display: none; }
  .appbar[data-back="true"] .appbar__back { display: inline-flex; }
  .appbar__title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rolepill { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

  .identitybar { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 16px 9px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .identitybar .ib-ava { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 12px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }
  .identitybar .ib-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .identitybar .ib-name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--accent-ink); }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll.has-tabbar { padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
  .page { padding: 18px 18px 28px; display: none; }
  .page.active { display: block; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 2px 10px; }
  h2.section:first-child { margin-top: 4px; }
  .divider-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 14px; }
  .sub { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .muted { color: var(--ink-faint); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
  .card.pad { padding: 16px; }
  .card.pad.sm { padding: 12px; }

  .btn { -webkit-appearance: none; appearance: none; font-family: var(--font-body); font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn--sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; font-family: var(--font-body); font-size: 14.5px; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .field textarea { min-height: 70px; resize: vertical; }
  .err { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 10px; min-height: 1em; }

  .tabbar { position: absolute; z-index: 20; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); border-radius: 22px; background: color-mix(in srgb, var(--paper) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); box-shadow: 0 10px 30px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.28); padding: 7px 6px 8px; }
  .tab { position: relative; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 2px; color: var(--ink-faint); font-family: var(--font-body); font-size: 9.5px; font-weight: 700; border-radius: 14px; min-height: 42px; }
  .tab .ico { display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab[aria-current="page"] .ico { background: var(--accent); }
  .tab[aria-current="page"] .ico svg { stroke: var(--paper); }

  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 13px 14px; }
  .stat .n { font-family: var(--font-display); font-size: 22px; font-weight: 500; }
  .stat .l { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); margin-top: 3px; }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag--done { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
  .tag--todo { background: var(--surface-2); color: var(--ink-faint); }

  .roleseg { display: flex; gap: 4px; flex-wrap: wrap; }
  .roleseg button { flex: 1 1 auto; min-width: 44px; min-height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; }
  .roleseg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .qrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .qrow:last-child { border-bottom: none; }
  .qrow .qtext { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
  .qrow .qno { color: var(--ink-faint); font-weight: 800; margin-right: 4px; }

  .discgroup { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .discgroup .gno { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); margin-bottom: 6px; }
  .discrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .discrow .word { flex: 1; }
  .discpick { display: flex; gap: 4px; flex: none; }
  .discpick button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-faint); font-size: 10px; font-weight: 800; cursor: pointer; }
  .discpick button[aria-pressed="true"].sangat { background: var(--good); border-color: var(--good); color: #fff; }
  .discpick button[aria-pressed="true"].kurang { background: var(--bad); border-color: var(--bad); color: #fff; }

  .barrow { margin-bottom: 10px; }
  .barrow .bhead { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px; }
  .barrow .bhead b { font-weight: 700; }
  .barbg { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .barbg > i { display: block; height: 100%; border-radius: 999px; }

  .avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 13px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: none; border-right: none; border-top: none; font-family: var(--font-body); color: var(--ink); cursor: pointer; }
  .mrow:last-child { border-bottom: none; }

  .login { max-width: 340px; margin: 0 auto; padding: 30px 22px; }
  .login .brandmark { text-align: center; margin-bottom: 22px; }
  .login .brandmark .glyph { width: 52px; height: 52px; border-radius: 15px; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 auto 10px; }
  .login h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 4px; text-align: center; }
  .login p.sub { text-align: center; margin: 0 0 18px; }
  .authlink { display: block; width: 100%; text-align: center; margin-top: 14px; background: none; border: none; color: var(--ink-soft); font-family: var(--font-body); font-size: 13px; cursor: pointer; padding: 8px; }

  .empty { text-align: center; padding: 30px 14px; color: var(--ink-faint); font-size: 13px; }
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <div class="eyebrow">Gereja JB3</div>
    <h1>Lead To Serve 1</h1>
    <p>Asesmen pribadi — kenali kekuatan, karunia, dan panggilanmu untuk melayani.</p>
  </div>
  <div class="phone">
    <div class="screen-frame">
      <header class="appbar hidden" id="appbar" data-back="false">
        <button class="appbar__back" id="backBtn" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="appbar__title" id="appbarTitle">Lead To Serve 1</div>
        <button class="rolepill" id="rolePill">Keluar</button>
      </header>
      <div class="identitybar hidden" id="identityBar"></div>
      <div id="app">
        <div class="scroll has-tabbar">
          <section class="page" data-page="login"><div id="loginBody"></div></section>
          <section class="page" data-page="register"><div id="registerBody"></div></section>
          <section class="page" data-page="home"><div id="homeBody"></div></section>
          <section class="page" data-page="disc"><div id="discBody"></div></section>
          <section class="page" data-page="ssd"><div id="ssdBody"></div></section>
          <section class="page" data-page="gifts"><div id="giftsBody"></div></section>
          <section class="page" data-page="roadmap"><div id="roadmapBody"></div></section>
          <section class="page" data-page="results"><div id="resultsBody"></div></section>
          <section class="page" data-page="roster"><div id="rosterBody"></div></section>
          <section class="page" data-page="profile"><div id="profileBody"></div></section>
        </div>
      </div>
      <nav class="tabbar hidden" id="tabbar"></nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./common.js"></script>
<script src="./db.js"></script>
<script>
(function () {
  "use strict";
  const { esc, DISC_GROUPS, computeDiscGraphs, discComplete,
    SSD_QUESTIONS, SSD_CATEGORIES, SSD_SCALE, computeSsdScores, ssdComplete, ssdCatName,
    GIFTS_QUESTIONS, GIFTS_LIST, GIFTS_SCALE, computeGiftsScores, giftsComplete, giftName,
    ROADMAP_SECTIONS, HOLY_DISCONTENT_AREAS } = window.LTS;
  const el = id => document.getElementById(id);
  const $ = s => document.querySelector(s);

  if (!window.LTS_CONFIG || !window.supabase) {
    document.getElementById("app").innerHTML = '<div class="empty">Gagal memuat. Cek config.js / koneksi internet.</div>';
    return;
  }
  const sb = window.supabase.createClient(window.LTS_CONFIG.url, window.LTS_CONFIG.anonKey);
  const DB = window.makeDB(sb);

  const state = {
    page: "login", stack: [],
    persona: null,           // "PESERTA" | "ADMIN"
    meId: null,
    myProfile: null, myDisc: null, mySsd: null, myGifts: null, myRoadmap: null,
    profiles: [], allDisc: [], allSsd: [], allGifts: [], allRoadmap: [],
    viewProfileId: null,      // dilihat di halaman "results" — null = diri sendiri
    draft: { discPicks: [], ssdAnswers: {}, giftsAnswers: {}, roadmapData: {} },
    busy: false,
  };
  const NOCHROME = ["login", "register"];

  function initials(name) { return String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?"; }
  function toast(msg) {
    let t = el("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast";
      t.style.cssText = "position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:86%;text-align:center;";
      $(".screen-frame").appendChild(t);
    }
    t.textContent = msg; t.style.opacity = "1";
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = "0"; }, 2200);
  }

  function profileById(id) { return state.profiles.find(p => p.id === id) || (state.myProfile && state.myProfile.id === id ? state.myProfile : null); }
  function discOf(id) { return id === state.meId ? state.myDisc : state.allDisc.find(x => x.id === id); }
  function ssdOf(id) { return id === state.meId ? state.mySsd : state.allSsd.find(x => x.id === id); }
  function giftsOf(id) { return id === state.meId ? state.myGifts : state.allGifts.find(x => x.id === id); }
  function roadmapOf(id) { return id === state.meId ? state.myRoadmap : state.allRoadmap.find(x => x.id === id); }

  const TABS = {
    PESERTA: [{ p:"home", l:"Asesmen" }, { p:"results", l:"Hasil" }, { p:"profile", l:"Profil" }],
    ADMIN:   [{ p:"home", l:"Asesmen" }, { p:"roster", l:"Peserta" }, { p:"profile", l:"Profil" }],
  };
  const META = {
    home: { h:"Lead To Serve 1", tab:"home" },
    disc: { h:"DISC", back:true },
    ssd: { h:"Skala Sikap Disfungsional", back:true },
    gifts: { h:"Karunia Rohani", back:true },
    roadmap: { h:"Serve Road Map", back:true },
    results: { h:"Hasil", tab:"results" },
    roster: { h:"Peserta", tab:"roster" },
    profile: { h:"Profil Saya", tab:"profile" },
  };

  function show(page, opts) {
    opts = opts || {};
    const prev = state.page;
    if (!opts.replace && prev !== page && !NOCHROME.includes(prev) && !NOCHROME.includes(page)) state.stack.push(prev);
    state.page = page;
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.dataset.page === page));
    renderChrome();
    RENDER[page] && RENDER[page]();
  }
  function goBack() { const p = state.stack.pop(); show(p || "home", { replace:true }); }

  function renderChrome() {
    const chromeOn = state.persona && !NOCHROME.includes(state.page);
    el("appbar").classList.toggle("hidden", !chromeOn);
    el("identityBar").classList.toggle("hidden", !chromeOn);
    el("tabbar").classList.toggle("hidden", !chromeOn);
    if (!chromeOn) return;
    const meta = META[state.page] || {};
    el("appbar").setAttribute("data-back", meta.back ? "true" : "false");
    el("appbarTitle").textContent = meta.h || "Lead To Serve 1";
    const idb = el("identityBar");
    idb.innerHTML = `<span class="ib-ava">${esc(initials(state.myProfile && state.myProfile.name))}</span>
      <span class="ib-main"><span class="ib-name">${esc((state.myProfile || {}).name || "")}</span>
      <span class="identity-badge">${state.persona === "ADMIN" ? "Admin" : "Peserta"}</span></span>`;
    const tabs = TABS[state.persona] || [];
    el("tabbar").innerHTML = tabs.map(t => `<button class="tab" data-goto="${t.p}" ${meta.tab === t.p ? 'aria-current="page"' : ""}>
      <span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg></span>
      <span class="lbl">${t.l}</span></button>`).join("");
  }

  /* ---------------- RENDER ---------------- */
  const RENDER = {};

  RENDER.login = function () {
    el("loginBody").innerHTML = `
      <div class="login">
        <div class="brandmark"><div class="glyph">LS</div></div>
        <h2>Lead To Serve 1</h2>
        <p class="sub muted">Masuk untuk mulai asesmen</p>
        <div class="field"><label>No. HP atau Nama</label><input id="liId" type="text" placeholder="08123456789 atau nama"></div>
        <div class="field"><label>Kata Sandi</label><input id="liPw" type="password" placeholder="Kata sandi"></div>
        <button class="btn btn--primary" id="liGo">Masuk</button>
        <div class="err" id="liErr"></div>
        <button class="authlink" data-goto="register">Belum punya akun? Daftar</button>
      </div>`;
  };
  RENDER.register = function () {
    el("registerBody").innerHTML = `
      <div class="login">
        <div class="brandmark"><div class="glyph">LS</div></div>
        <h2>Daftar</h2>
        <p class="sub muted">Buat akun untuk mulai asesmen</p>
        <div class="field"><label>Nama lengkap</label><input id="reName" type="text" placeholder="Nama lengkap"></div>
        <div class="field"><label>No. HP</label><input id="rePhone" type="tel" placeholder="08123456789"></div>
        <div class="field"><label>Kata Sandi</label><input id="rePw" type="password" placeholder="Minimal 6 karakter"></div>
        <button class="btn btn--primary" id="reGo">Daftar</button>
        <div class="err" id="reErr"></div>
        <button class="authlink" data-goto="login">Sudah punya akun? Masuk</button>
      </div>`;
  };

  function instrumentCard(key, label, desc, done) {
    return `<button type="button" class="card pad" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;" data-goto="${key}">
      <div style="flex:1;min-width:0;">
        <b style="font-family:var(--font-display);font-size:15px;">${esc(label)}</b>
        <div class="sub" style="margin-top:3px;">${esc(desc)}</div>
      </div>
      <span class="tag ${done ? "tag--done" : "tag--todo"}">${done ? "Selesai" : "Belum"}</span>
    </button>`;
  }
  RENDER.home = function () {
    const dDone = discComplete((state.myDisc || {}).picks);
    const sDone = ssdComplete((state.mySsd || {}).answers);
    const gDone = giftsComplete((state.myGifts || {}).answers);
    const rDone = !!(state.myRoadmap && state.myRoadmap.data && Object.keys(state.myRoadmap.data).length);
    el("homeBody").innerHTML = `
      <div class="divider-note">Isi 4 bagian ini di waktu yang tenang — jujur pada dirimu sendiri, tidak ada jawaban benar/salah. Hasilnya membantu kami mengenal kekuatan & panggilanmu untuk melayani.</div>
      <h2 class="section">1. Kepribadian</h2>
      ${instrumentCard("disc", "DISC", "28 kelompok kata — pilih yang paling & kurang menggambarkan Anda", dDone)}
      <h2 class="section">2. Pola Pikir</h2>
      ${instrumentCard("ssd", "Skala Sikap Disfungsional", "35 pernyataan — seberapa sesuai dengan diri Anda", sDone)}
      <h2 class="section">3. Karunia Rohani</h2>
      ${instrumentCard("gifts", "Analisa Karunia Rohani", "85 pernyataan — temukan 3 karunia yang paling menonjol", gDone)}
      <h2 class="section">4. Sintesis</h2>
      ${instrumentCard("roadmap", "Serve Road Map", "Gabungkan semua hasil jadi 1 peta pelayanan pribadi", rDone)}
      ${(dDone && sDone && gDone) ? `<div class="divider-note" style="margin-top:4px;">Semua asesmen data sudah lengkap — lanjutkan ke Serve Road Map untuk menyusun rencana pelayananmu.</div>` : ""}
    `;
  };

  // ---- DISC ----
  RENDER.disc = function () {
    const picks = state.draft.discPicks;
    const seg = (attr, groupNo, current, val, cls) =>
      `<button type="button" class="${cls}" aria-pressed="${current === val}" data-${attr}="${groupNo}:${val}">${cls === "sangat" ? "✓" : "✗"}</button>`;
    const rows = DISC_GROUPS.map(g => {
      const p = picks[g.no - 1] || {};
      const letters = ["D", "I", "S", "C"];
      return `<div class="discgroup">
        <div class="gno">Kelompok ${g.no} <span class="muted">— pilih 1 paling (✓) & 1 kurang (✗) menggambarkan Anda</span></div>
        ${letters.map(L => `<div class="discrow">
          <span class="word">${esc(g[L])}</span>
          <span class="discpick">
            ${seg("discsangat", g.no, p.sangat, L, "sangat")}
            ${seg("disckurang", g.no, p.kurang, L, "kurang")}
          </span>
        </div>`).join("")}
      </div>`;
    }).join("");
    const done = discComplete(picks);
    el("discBody").innerHTML = `
      <div class="divider-note">Untuk tiap kelompok (1-28), pilih satu kata yang <b>paling</b> (✓) dan satu yang <b>paling kurang</b> (✗) menggambarkan diri Anda dari 4 pilihan.</div>
      ${rows}
      <button class="btn btn--primary" style="margin-top:14px;" id="discSave" ${done ? "" : "disabled"}>${done ? "Simpan Hasil DISC" : `Isi semua kelompok (${picks.filter(p => p && p.sangat && p.kurang).length}/28)`}</button>
    `;
  };

  // ---- SSD ----
  RENDER.ssd = function () {
    const answers = state.draft.ssdAnswers;
    const rows = SSD_QUESTIONS.map(q => `<div class="qrow">
      <div class="qtext"><span class="qno">${q.no}.</span>${esc(q.text)}</div>
      <div class="roleseg">${SSD_SCALE.map(o => `<button type="button" data-ssdans="${q.no}:${o.code}" aria-pressed="${answers[q.no] === o.code}">${o.code}</button>`).join("")}</div>
    </div>`).join("");
    const doneCount = SSD_QUESTIONS.filter(q => answers[q.no]).length;
    const done = ssdComplete(answers);
    el("ssdBody").innerHTML = `
      <div class="divider-note">Pilih jawaban yang paling menggambarkan diri Anda. Tidak ada jawaban benar/salah — makin jujur, makin bermanfaat hasilnya.<br><br>
        <b>STS</b>=Sangat Tidak Sesuai · <b>TS</b>=Tidak Sesuai · <b>ATS</b>=Agak Tidak Sesuai · <b>AS</b>=Agak Sesuai · <b>S</b>=Sesuai · <b>SS</b>=Sangat Sesuai</div>
      ${rows}
      <button class="btn btn--primary" style="margin-top:14px;" id="ssdSave" ${done ? "" : "disabled"}>${done ? "Simpan Hasil SSD" : `Jawab semua pernyataan (${doneCount}/35)`}</button>
    `;
  };

  // ---- Karunia Rohani ----
  RENDER.gifts = function () {
    const answers = state.draft.giftsAnswers;
    const rows = GIFTS_QUESTIONS.map(q => `<div class="qrow">
      <div class="qtext"><span class="qno">${q.no}.</span>${esc(q.text)}</div>
      <div class="roleseg">${GIFTS_SCALE.map(o => `<button type="button" data-giftans="${q.no}:${o.code}" aria-pressed="${answers[q.no] === o.code}">${o.label}</button>`).join("")}</div>
    </div>`).join("");
    const doneCount = GIFTS_QUESTIONS.filter(q => answers[q.no]).length;
    const done = giftsComplete(answers);
    el("giftsBody").innerHTML = `
      <div class="divider-note">"Pernyataan ini merupakan pengalaman saya yang memuaskan" — pilih Sangat/Kadang/Sedikit/Tidak untuk tiap pernyataan.</div>
      ${rows}
      <button class="btn btn--primary" style="margin-top:14px;" id="giftsSave" ${done ? "" : "disabled"}>${done ? "Simpan Hasil Karunia Rohani" : `Jawab semua pernyataan (${doneCount}/85)`}</button>
    `;
  };

  // ---- Serve Road Map ----
  RENDER.roadmap = function () {
    const data = state.draft.roadmapData;
    const fieldHTML = f => {
      const val = data[f.key];
      if (f.type === "textarea") return `<div class="field"><label>${esc(f.label)}</label><textarea data-rmfield="${f.key}">${esc(val || "")}</textarea></div>`;
      if (f.type === "text") return `<div class="field"><label>${esc(f.label)}</label><input type="text" data-rmfield="${f.key}" value="${esc(val || "")}"></div>`;
      if (f.type === "checkboxList") {
        const arr = Array.isArray(val) ? val : [];
        return `<div class="field"><label>${esc(f.label)}</label>
          <div class="roleseg" style="flex-wrap:wrap;">${HOLY_DISCONTENT_AREAS.map(a => `<button type="button" data-rmarea="${esc(a)}" aria-pressed="${arr.includes(a)}" style="flex:none;">${esc(a)}</button>`).join("")}</div>
        </div>`;
      }
      if (f.type === "template") {
        return `<div class="field"><label>${esc(f.label)}</label><textarea data-rmfield="${f.key}" placeholder="${esc(f.template)}">${esc(val || "")}</textarea></div>`;
      }
      return "";
    };
    el("roadmapBody").innerHTML = `
      <div class="divider-note">Lembar ini menggabungkan hasil DISC, SSD, dan Karunia Rohani Anda menjadi satu peta pelayanan pribadi. Isi dengan refleksi jujur — boleh disimpan bertahap.</div>
      ${ROADMAP_SECTIONS.map(sec => `<h2 class="section">${esc(sec.title)}</h2><div class="card pad">${sec.fields.map(fieldHTML).join("")}</div>`).join("")}
      <button class="btn btn--primary" style="margin-top:14px;" id="roadmapSave">Simpan Serve Road Map</button>
    `;
  };

  // ---- Hasil (results) ----
  function bar(label, value, min, max, color) {
    const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
    return `<div class="barrow"><div class="bhead"><span>${esc(label)}</span><b>${value}</b></div><div class="barbg"><i style="width:${pct}%;background:${color};"></i></div></div>`;
  }
  RENDER.results = function () {
    const id = state.viewProfileId || state.meId;
    const prof = profileById(id) || state.myProfile;
    const disc = discOf(id), ssd = ssdOf(id), gifts = giftsOf(id), roadmap = roadmapOf(id);
    const discDone = discComplete((disc || {}).picks);
    const ssdDone = ssdComplete((ssd || {}).answers);
    const giftsDone = giftsComplete((gifts || {}).answers);

    const discHTML = !discDone ? `<div class="sub">DISC belum diisi.</div>` : (() => {
      const g3 = disc.graph3 || computeDiscGraphs(disc.picks).graph3;
      const max = Math.max(1, ...["D", "I", "S", "C"].map(k => Math.abs(g3[k])));
      const colors = { D:"var(--disc-d)", I:"var(--disc-i)", S:"var(--disc-s)", C:"var(--disc-c)" };
      const names = { D:"Dominance", I:"Influence", S:"Steadiness", C:"Compliance" };
      return ["D", "I", "S", "C"].map(k => bar(`${k} — ${names[k]}`, g3[k], -max, max, colors[k])).join("");
    })();

    const ssdHTML = !ssdDone ? `<div class="sub">SSD belum diisi.</div>` : SSD_CATEGORIES.map(c =>
      bar(c.name, ssd.scores[c.code], -15, 15, (ssd.scores[c.code] < 0 ? "var(--bad)" : "var(--good)"))
    ).join("");

    const giftsHTML = !giftsDone ? `<div class="sub">Karunia Rohani belum diisi.</div>` : `
      <div class="sub" style="margin-bottom:8px;"><b>Menonjol:</b> ${gifts.top3.map(giftName).join(", ")}</div>
      ${GIFTS_LIST.slice().sort((a, b) => gifts.scores[b.code] - gifts.scores[a.code]).map(g => bar(g.name, gifts.scores[g.code], 0, 15, "var(--accent)")).join("")}
    `;

    const roadmapHTML = (!roadmap || !roadmap.data || !Object.keys(roadmap.data).length) ? `<div class="sub">Serve Road Map belum diisi.</div>` :
      ROADMAP_SECTIONS.map(sec => `<div style="margin-bottom:10px;"><b style="font-size:12.5px;">${esc(sec.title)}</b>
        ${sec.fields.map(f => {
          const v = roadmap.data[f.key];
          if (f.type === "checkboxList") return Array.isArray(v) && v.length ? `<div class="sub">${esc(f.label)}: ${v.map(esc).join(", ")}</div>` : "";
          return v ? `<div class="sub" style="margin-top:2px;">${esc(f.label)}: ${esc(v)}</div>` : "";
        }).join("")}
      </div>`).join("");

    el("resultsBody").innerHTML = `
      ${state.persona === "ADMIN" && state.viewProfileId ? `<div class="divider-note">Melihat hasil: <b>${esc((prof || {}).name || "")}</b></div>` : ""}
      <h2 class="section">DISC (Graph III — profil natural)</h2>
      <div class="card pad">${discHTML}</div>
      <h2 class="section">Skala Sikap Disfungsional</h2>
      <div class="card pad">${ssdHTML}</div>
      <h2 class="section">Karunia Rohani</h2>
      <div class="card pad">${giftsHTML}</div>
      <h2 class="section">Serve Road Map</h2>
      <div class="card pad">${roadmapHTML}</div>
    `;
  };

  // ---- Roster (Admin) ----
  RENDER.roster = function () {
    const peserta = state.profiles.filter(p => p.role !== "admin");
    const rows = peserta.map(p => {
      const d = discComplete((discOf(p.id) || {}).picks);
      const s = ssdComplete((ssdOf(p.id) || {}).answers);
      const g = giftsComplete((giftsOf(p.id) || {}).answers);
      const n = [d, s, g].filter(Boolean).length;
      return `<button type="button" class="mrow" data-viewresult="${p.id}">
        <span class="avatar">${esc(initials(p.name))}</span>
        <span style="flex:1;min-width:0;"><b style="font-size:13px;">${esc(p.name)}</b><div class="sub">${n}/3 asesmen selesai</div></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>`;
    }).join("");
    el("rosterBody").innerHTML = `
      <div class="divider-note">${peserta.length} peserta terdaftar. Ketuk untuk lihat hasil asesmen.</div>
      ${rows || `<div class="empty">Belum ada peserta.</div>`}
    `;
  };

  // ---- Profil ----
  RENDER.profile = function () {
    el("profileBody").innerHTML = `
      <div class="card pad" style="margin-bottom:14px;">
        <b style="font-family:var(--font-display);font-size:16px;">${esc((state.myProfile || {}).name || "")}</b>
        <div class="sub" style="margin-top:3px;">${esc((state.myProfile || {}).phone || "")}</div>
      </div>
      <h2 class="section">Ganti Kata Sandi</h2>
      <div class="card pad">
        <div class="field"><input type="password" id="pfNewPw" placeholder="Kata sandi baru (min 6 karakter)"></div>
        <button class="btn btn--ghost" id="pfChangePw">Ganti Sandi</button>
      </div>
      <button class="btn btn--ghost" style="margin-top:18px;color:var(--bad);border-color:var(--bad);" id="pfLogout">Keluar</button>
    `;
  };

  /* ---------------- data load & sync ---------------- */
  async function loadAll() {
    state.myProfile = await DB.myProfile();
    if (!state.myProfile) return;
    state.meId = state.myProfile.id;
    state.persona = state.myProfile.role === "admin" ? "ADMIN" : "PESERTA";
    const mine = await DB.hydrateMine();
    state.myDisc = mine.disc; state.mySsd = mine.ssd; state.myGifts = mine.gifts; state.myRoadmap = mine.roadmap;
    state.draft.discPicks = (mine.disc && mine.disc.picks && mine.disc.picks.length) ? mine.disc.picks : [];
    state.draft.ssdAnswers = (mine.ssd && mine.ssd.answers) ? { ...mine.ssd.answers } : {};
    state.draft.giftsAnswers = (mine.gifts && mine.gifts.answers) ? { ...mine.gifts.answers } : {};
    state.draft.roadmapData = (mine.roadmap && mine.roadmap.data) ? { ...mine.roadmap.data } : {};
    if (state.persona === "ADMIN") {
      const all = await DB.hydrateAll();
      state.profiles = all.profiles; state.allDisc = all.disc; state.allSsd = all.ssd; state.allGifts = all.gifts; state.allRoadmap = all.roadmap;
    }
  }

  let unsub = null;
  function queueReload() {
    clearTimeout(queueReload._t);
    queueReload._t = setTimeout(async () => {
      try { await loadAll(); if (RENDER[state.page]) RENDER[state.page](); renderChrome(); } catch (e) { console.error(e); }
    }, 500);
  }

  async function boot() {
    const sess = await DB.session();
    if (!sess) { show("login", { replace:true }); return; }
    try {
      await loadAll();
      if (!state.myProfile) { show("login", { replace:true }); return; }
      show("home", { replace:true });
      try { unsub = DB.onChange(queueReload); } catch (e) {}
    } catch (e) { console.error(e); show("login", { replace:true }); }
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", async e => {
    const T = e.target;
    if (T.closest("#backBtn")) { goBack(); return; }
    const g = T.closest("[data-goto]");
    if (g) { show(g.dataset.goto); return; }

    if (T.closest("#liGo")) {
      const id = el("liId").value.trim(), pw = el("liPw").value;
      if (!id || !pw) { el("liErr").textContent = "Isi No. HP/Nama dan kata sandi."; return; }
      el("liErr").textContent = "";
      try { await DB.login({ id, password:pw }); await boot(); }
      catch (err) { el("liErr").textContent = "Gagal masuk: " + (err.message || err); }
      return;
    }
    if (T.closest("#reGo")) {
      const name = el("reName").value.trim(), phone = el("rePhone").value.trim(), pw = el("rePw").value;
      if (!name || !pw) { el("reErr").textContent = "Isi nama dan kata sandi."; return; }
      if (pw.length < 6) { el("reErr").textContent = "Kata sandi minimal 6 karakter."; return; }
      el("reErr").textContent = "";
      try { await DB.register({ name, phone, password:pw }); await DB.login({ id:phone || name, password:pw }); await boot(); }
      catch (err) { el("reErr").textContent = "Gagal daftar: " + (err.message || err); }
      return;
    }
    if (T.closest("#pfLogout") || T.closest("#rolePill")) {
      if (unsub) unsub();
      await DB.logout().catch(() => {});
      Object.assign(state, { page:"login", stack:[], persona:null, meId:null, myProfile:null, myDisc:null, mySsd:null, myGifts:null, myRoadmap:null, profiles:[], allDisc:[], allSsd:[], allGifts:[], allRoadmap:[], viewProfileId:null });
      show("login", { replace:true });
      return;
    }
    if (T.closest("#pfChangePw")) {
      const np = el("pfNewPw").value;
      if (np.length < 6) { toast("Minimal 6 karakter."); return; }
      try { await DB.changePassword(np); toast("Sandi diganti."); el("pfNewPw").value = ""; }
      catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }

    // DISC picks
    const ds = T.closest("[data-discsangat],[data-disckurang]");
    if (ds) {
      const [key, val] = (ds.dataset.discsangat || ds.dataset.disckurang).split(":");
      const which = ds.dataset.discsangat ? "sangat" : "kurang";
      const no = Number(key);
      const arr = state.draft.discPicks;
      arr[no - 1] = arr[no - 1] || { no };
      arr[no - 1][which] = arr[no - 1][which] === val ? null : val;
      RENDER.disc();
      return;
    }
    if (T.closest("#discSave")) {
      const { graph1, graph2, graph3 } = computeDiscGraphs(state.draft.discPicks);
      try { await DB.saveDisc(state.meId, { picks:state.draft.discPicks, graph1, graph2, graph3 }); toast("Hasil DISC disimpan."); await loadAll(); show("home"); }
      catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }

    // SSD answers
    const sa = T.closest("[data-ssdans]");
    if (sa) {
      const [no, code] = sa.dataset.ssdans.split(":");
      state.draft.ssdAnswers[no] = code;
      RENDER.ssd();
      return;
    }
    if (T.closest("#ssdSave")) {
      const scores = computeSsdScores(state.draft.ssdAnswers);
      try { await DB.saveSsd(state.meId, { answers:state.draft.ssdAnswers, scores }); toast("Hasil SSD disimpan."); await loadAll(); show("home"); }
      catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }

    // Gifts answers
    const ga = T.closest("[data-giftans]");
    if (ga) {
      const [no, code] = ga.dataset.giftans.split(":");
      state.draft.giftsAnswers[no] = code;
      RENDER.gifts();
      return;
    }
    if (T.closest("#giftsSave")) {
      const { scores, top3, bottom3 } = computeGiftsScores(state.draft.giftsAnswers);
      try { await DB.saveGifts(state.meId, { answers:state.draft.giftsAnswers, scores, top3, bottom3 }); toast("Hasil Karunia Rohani disimpan."); await loadAll(); show("home"); }
      catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }

    // Roadmap checkbox areas
    const rmArea = T.closest("[data-rmarea]");
    if (rmArea) {
      const a = rmArea.dataset.rmarea;
      const cur = Array.isArray(state.draft.roadmapData.holyDiscontentAreas) ? state.draft.roadmapData.holyDiscontentAreas.slice() : [];
      const idx = cur.indexOf(a);
      if (idx >= 0) cur.splice(idx, 1); else cur.push(a);
      state.draft.roadmapData.holyDiscontentAreas = cur;
      RENDER.roadmap();
      return;
    }
    if (T.closest("#roadmapSave")) {
      try { await DB.saveRoadmap(state.meId, { data:state.draft.roadmapData }); toast("Serve Road Map disimpan."); await loadAll(); show("home"); }
      catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }

    // Roster -> results
    const vr = T.closest("[data-viewresult]");
    if (vr) { state.viewProfileId = vr.dataset.viewresult; show("results"); return; }
  });

  document.addEventListener("input", e => {
    const rm = e.target.closest("[data-rmfield]");
    if (rm) state.draft.roadmapData[rm.dataset.rmfield] = rm.value;
  });
  document.addEventListener("change", e => {
    if (e.target.id === "resultsPersonSelect") {}
  });

  // reset viewProfileId saat masuk tab "Hasil" sendiri (bukan dari roster)
  document.addEventListener("click", e => {
    const t = e.target.closest('[data-goto="results"]');
    if (t && !t.closest("[data-viewresult]")) state.viewProfileId = null;
  });

  boot();
})();
</script>
</body>
</html>
