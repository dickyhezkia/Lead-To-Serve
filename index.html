<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* 2026-10-04: iOS auto-zoom saat input <16px difokus & zoom-nya ikut terbawa
     balik ke JB3 HOME Tracker (bug "tidak fit to screen") → kunci zoom (meta
     maximum-scale=1) + paksa input ≥16px, SAMA spt JB3. */
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px !important; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px; }

  :root {
    /* 2026-10-16 (user: "warna background discipleship journey teracota sama seperti jb3 home"):
       palet ungu → palet JB3 HOME (krem --paper + aksen terracotta). Ungu lama: backups/2026-10-16_pre-warna-jb3 */
    --paper:#F5EFE3; --surface:#FCFAF4; --surface-2:#F0E8D8;
    --ink:#2E2A23; --ink-soft:#5E5647; --ink-faint:#877B61;
    --line:#E2D8C3; --line-strong:#D3C6AB;
    --accent:#B5623B; --accent-ink:#7A3F22;
    --good:#4C7A54; --warn:#B4822F; --bad:#B2433A; --badge:#B2433A;
    --disc-d:#C0504D; --disc-i:#C99A2E; --disc-s:#4F8F5B; --disc-c:#4472A8;
    --canvas:#1A2B49;
    --shadow: 0 1px 2px rgba(50,40,20,.06), 0 8px 24px rgba(50,40,20,.08);
    --r-sm:10px; --r-md:16px; --r-lg:24px;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Karla", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#211E19; --surface:#2A2620; --surface-2:#332E26;
      --ink:#F2ECDD; --ink-soft:#C6BCA4; --ink-faint:#9A8D70;
      --line:#3B352B; --line-strong:#4C4437;
      --accent:#E08B5D; --accent-ink:#F0B48C;
      --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
      --canvas:#131E33;
    }
  }
  :root[data-theme="dark"] {
    --paper:#211E19; --surface:#2A2620; --surface-2:#332E26;
    --ink:#F2ECDD; --ink-soft:#C6BCA4; --ink-faint:#9A8D70;
    --line:#3B352B; --line-strong:#4C4437;
    --accent:#E08B5D; --accent-ink:#F0B48C;
    --good:#8FBB93; --warn:#D3A461; --bad:#D5796E;
    --canvas:#131E33;
  }

  body {
    font-family: var(--font-body); font-weight: 500;
    background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 16px 56px; }
  .masthead { text-align: center; max-width: 560px; color: #F1ECFA; }
  .masthead .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #C9B8F0; }
  .masthead h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -.01em; margin: 4px 0 6px; color: #fff; }
  .masthead p { margin: 0; color: rgba(241,236,250,.82); font-size: 14px; line-height: 1.5; }

  .phone { position: relative; width: 390px; height: 844px; background: var(--paper); border-radius: 46px; box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.07); padding: 10px; flex: none; }
  @media (min-width: 640px) { .phone { width: clamp(390px, 40vw, 520px); height: clamp(760px, 88vh, 980px); } }
  .screen-frame { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; isolation: isolate; }
  @media (max-width: 480px) {
    html { height: 100%; height: 100dvh; }
    body { position: fixed; top: 0; left: 0; right: 0; overflow: hidden; height: 100%; height: 100dvh; height: var(--app-h, 100dvh); }
    .stage { padding: 0; gap: 0; min-height: 0; height: 100%; }
    .masthead { display: none; }
    .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
    .screen-frame { border-radius: 0; height: 100%; }
  }

  .appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 12px calc(18px + env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); }
  .appbar__back { border: none; background: none; padding: 6px; margin: -6px 0 -6px -6px; color: var(--ink); cursor: pointer; border-radius: 8px; display: none; }
  .appbar[data-back="true"] .appbar__back { display: inline-flex; }
  .appbar__logo { flex: none; height: 26px; width: 26px; object-fit: contain; border-radius: 7px; }
  .appbar__title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rolepill { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

  .identitybar { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 16px 9px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .identitybar .ib-ava { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 12px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }
  .identitybar .ib-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .identitybar .ib-name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--accent-ink); }

  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .scroll.has-tabbar { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .page { padding: 18px 18px 28px; display: none; }
  .page.active { display: block; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 2px 10px; }
  h2.section:first-child { margin-top: 4px; }
  .divider-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 14px; }
  .sub { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .muted { color: var(--ink-faint); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
  .card.pad { padding: 16px; }
  .card.pad.sm { padding: 12px; }

  .btn { -webkit-appearance: none; appearance: none; font-family: var(--font-body); font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn--sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; font-family: var(--font-body); font-size: 14.5px; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .field textarea { min-height: 70px; resize: vertical; }
  .err { color: var(--bad); font-size: 12.5px; font-weight: 700; margin-top: 10px; min-height: 1em; }

  .tabbar { position: absolute; z-index: 20; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); border-radius: 22px; background: color-mix(in srgb, var(--paper) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); box-shadow: 0 10px 30px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.28); padding: 7px 6px 8px; }
  .tab { position: relative; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 2px; color: var(--ink-faint); font-family: var(--font-body); font-size: 9.5px; font-weight: 700; border-radius: 14px; min-height: 42px; }
  .tab .ico { display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab[aria-current="page"] .ico { background: var(--accent); }
  .tab[aria-current="page"] .ico svg { stroke: var(--paper); }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag--done { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
  .tag--todo { background: var(--surface-2); color: var(--ink-faint); }

  .avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 13px; background: var(--surface-2); color: var(--accent-ink); border: 1px solid var(--line); }

  /* 2026-09-22 (asesmen DISC): 1 kelompok = 4 kata sifat (D/I/S/C), tiap
     kata punya 2 tombol kecil (✓ paling / ✗ paling kurang). */
  .discgroup { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .discgroup .gno { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); margin-bottom: 6px; }
  .discrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .discrow .word { flex: 1; }
  .discpick { display: flex; gap: 4px; flex: none; }
  .discpick button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-faint); font-size: 10px; font-weight: 800; cursor: pointer; }
  .discpick button[aria-pressed="true"].sangat { background: var(--good); border-color: var(--good); color: #fff; }
  .discpick button[aria-pressed="true"].kurang { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* 2026-09-23 (dipakai fieldHTML checkboxList/Vision & asesmen SSD baru):
     sempat tak sengaja hilang saat kerangka dirombak — ketauan lagi sekarang
     krn SSD butuh .roleseg utk tombol skala 6-pilihan tiap pernyataan. */
  .roleseg { display: flex; gap: 4px; flex-wrap: wrap; }
  .roleseg button { flex: 1 1 auto; min-width: 44px; min-height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; }
  .roleseg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .qrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .qrow:last-child { border-bottom: none; }
  .qrow .qtext { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
  .qrow .qno { color: var(--ink-faint); font-weight: 800; margin-right: 4px; }
  /* 2026-10-04 — pembahasan post-test (postTestReviewHTML) */
  .rv { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .rv > summary, .rv-sub > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-soft); padding: 4px 0; }
  .rv-sub { margin-top: 8px; }
  .rv-item { border-bottom: 1px solid var(--line); }
  .rv-item:last-child { border-bottom: none; }
  .rv-q { display: flex; align-items: flex-start; gap: 8px; padding: 10px 0; font-size: 13px; line-height: 1.4; cursor: pointer; list-style: none; }
  .rv-q::-webkit-details-marker { display: none; }
  .rv-q::after { content: ""; flex: none; width: 7px; height: 7px; margin: 5px 4px 0 auto; border-right: 2px solid var(--ink-faint); border-bottom: 2px solid var(--ink-faint); transform: rotate(45deg); transition: transform .15s; }
  .rv-item[open] > .rv-q::after { transform: rotate(-135deg); margin-top: 8px; }
  .rv-qt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rv-item[open] .rv-qt { display: block; }
  .rv-q .qno { color: var(--ink-faint); font-weight: 800; margin-right: 4px; }
  .rv-mark { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; }
  .rv-bad .rv-mark { background: var(--bad); }
  .rv-ok .rv-mark { background: var(--good); }
  .rv-ans { padding: 0 0 10px 28px; }
  .rv-hint { margin: 2px 0 4px; font-size: 11px; color: var(--ink-faint); }
  @media (prefers-reduced-motion: reduce) { .rv-q::after { transition: none; } }
  .rv-line { font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 9px; margin-top: 4px; }
  .rv-line small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; opacity: .8; margin-bottom: 2px; }
  .rv-wrong { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); }
  .rv-good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
  .rv-opt { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 9px; margin-top: 4px; color: var(--ink-faint); border: 1px solid var(--line); }
  .rv-opt-k { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--line); color: var(--ink-soft); }
  .rv-opt-t small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
  .rv-opt--key { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); font-weight: 700; }
  .rv-opt--key .rv-opt-k { background: var(--good); color: #fff; }
  .rv-opt--bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); text-decoration: line-through; text-decoration-thickness: 1px; }
  .rv-opt--bad .rv-opt-k { background: var(--bad); color: #fff; }
  .rv-opt--bad small { text-decoration: none; display: block; }

  .barrow { margin-bottom: 10px; }
  .barrow .bhead { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px; }
  .barrow .bhead b { font-weight: 700; }
  .barbg { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .barbg > i { display: block; height: 100%; border-radius: 999px; }
  .ra-d > summary { list-style: none; cursor: pointer; }
  .ra-d > summary::-webkit-details-marker { display: none; }
  .ra-d > summary .bhead b { display: inline-flex; align-items: center; gap: 3px; color: var(--accent); }
  .ra-d > summary .bhead b::after { content: "›"; transition: transform .15s; }
  .ra-d[open] > summary .bhead b::after { transform: rotate(90deg); }
  .ra-names { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 12px; }
  .ra-nm { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  /* 2026-11-05 — template kartu tab kelas (semua bisa dilipat) */
  .pj-herof > summary { list-style: none; cursor: pointer; }
  .pj-herof > summary::-webkit-details-marker { display: none; }
  .pj-herof .jd-hero-top { position: relative; }
  .pj-herof .jd-hero-top > div { flex: 1; min-width: 0; }
  .pj-herof-chev { flex: none; align-self: center; opacity: .85; transition: transform .2s; }
  .pj-herof[open] .pj-herof-chev { transform: rotate(180deg); }
  .pj-herof:not([open]) { padding-bottom: 14px; }
  .pj-herof .jd-hero-sub { position: relative; margin-top: 10px; }
  .pj-fold { margin-bottom: 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .pj-fold[open] { box-shadow: 0 8px 22px color-mix(in srgb, var(--jc) 14%, transparent); }
  .pj-fold > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; border-left: 4px solid var(--jc); }
  .pj-fold > summary::-webkit-details-marker { display: none; }
  .pj-fold-ic { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; background: color-mix(in srgb, var(--jc) 14%, var(--surface)); }
  .pj-fold-t { flex: 1; min-width: 0; }
  .pj-fold-t b { display: block; font-size: 14px; font-weight: 800; color: var(--ink); }
  .pj-fold-t small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); margin-top: 1px; }
  .pj-fold-chev { flex: none; color: var(--ink-faint); transition: transform .2s; }
  .pj-fold[open] > summary .pj-fold-chev { transform: rotate(180deg); }
  .pj-fold-b { padding: 12px 14px 4px; border-top: 1px dashed var(--line-strong); }
  .pj-fold-b > .card, .pj-fold-b .bj-ach { box-shadow: none; }

  /* 2026-09-23 (bug nyata, user: "hasil unduhan asesmen dan road map
     terpotong"): akar masalah — `pagebreak: {mode:["css","legacy"]}` di
     downloadPdf()/sharePdf() tak py aturan CSS page-break APAPUN utk
     dipatuhi mode "css"-nya, jadi SELALU jatuh ke mode "legacy" (potong
     piksel mentah tanpa peduli batas elemen) tiap kali kontennya lebih
     tinggi dari 1 halaman A4 — teks/kolom terpotong PAS di tengah kalimat
     kalau kebetulan jatuh di batas halaman. Diperbaiki: SEMUA blok konten
     (kolom S-E-R-V-E, sel Expansion, tiap baris narasi Hasil Asesmen) diberi
     `page-break-inside:avoid` (+`break-inside` versi modern) — html2pdf.js
     mode "css" jd bisa geser SELURUH blok itu ke halaman berikutnya kalau
     tak muat, bukan memotongnya di tengah. Lembar Road Map "1 Lembar" bisa
     jd 2 halaman kalau isiannya sangat panjang — itu tukar-tambah yg
     disengaja (2 halaman utuh jauh lebih baik drpd 1 halaman yg datanya
     hilang separuh). `pagebreak` mode jg diganti ke ["css","avoid-all"]
     (avoid-all = jaring pengaman otomatis utk elemen manapun yg lolos dari
     daftar CSS di atas, GANTI legacy yg justru sumber masalahnya). */
  .printsheet .pscol, .printsheet .psexp > div, .printsheet .psblock,
  .printsheet .rphead, .printsheet .rpsub, .printsheet .rpp, .printsheet .rpul li {
    page-break-inside: avoid; break-inside: avoid;
  }
  @media print {
    body * { visibility: hidden; }
    .printsheet, .printsheet * { visibility: visible; }
    .printsheet { display: block; position: absolute; left: 0; top: 0; width: 100%; }
  }

  // ---- Rock Solid 3 post-test (2026-09-23, permintaan user: "buatkan link
  // dari kartu carousel Rock solid 3 (seperti LTS1) perlu ijin admin, baru
  // bisa mengikuti test") — alur akses SENDIRI (rs3AccessStatus), TERPISAH
  // dari accessStatus S-E-R-V-E. 40 soal pilihan ganda A-D, ditampilkan
  // sbg tombol penuh bertumpuk (BUKAN .roleseg segmented spt SSD/Karunia
  // Rohani — teks pilihan RS3 jauh lebih panjang, segmented akan berantakan).
  // Boleh diulang kapan saja selagi unlocked (lihat v_rs3_test_results.sql —
  // tak ada batas 1x/tahun spt instrumen lain), hasil terakhir ditampilkan
  // di atas form kalau ada percobaan sebelumnya.
  // 2026-10-04 (permintaan user, "peserta yang telah mengisi postest perlu
  // tahu pilihan apa yang salah dan pilihan yang benarnya apa"): pembahasan
  // per soal dari percobaan TERAKHIR (res.answers, kolom jsonb yg sudah
  // tersimpan sejak awal) — default cuma soal yg SALAH, ada <details> utk
  // soal yg benar. Dipakai di halaman post-test, Hasil Asesmen, & detail
  // peserta (Admin). Kunci jawaban memang sudah ada di common.js (lihat
  // catatan di RS3_QUESTIONS), jadi tak ada data baru yg dibuka.
  function postTestReviewHTML(questions, res, open, who) {
    if (!res || !res.answers) return "";
    const ans = res.answers || {};
    const wrong = questions.filter(q => ans[String(q.no)] !== q.correct);
    const right = questions.filter(q => ans[String(q.no)] === q.correct);
    // 2026-10-15 (user: "jawaban yang salah; setelah hasil akhir muncul, kamu
    // buat tandai jawaban yang salah dan yang benar sehingga jadi
    // pembelajaran"): tiap soal kini menampilkan KEEMPAT pilihan — pilihan
    // peserta yg salah merah ✗, kunci hijau ✓, sisanya pudar. Di halaman
    // post-test (open=true) pembahasan langsung terbuka & soal yg salah
    // sudah terbuka; di Hasil Asesmen/Admin tetap ringkas (tertutup).
    const opts = (q, ok) => ["A", "B", "C", "D"].filter(k => q.options[k]).map(k => {
      const mine = ans[String(q.no)] === k, key = q.correct === k;
      const cls = key ? "rv-opt rv-opt--key" : mine ? "rv-opt rv-opt--bad" : "rv-opt";
      const tag = key ? (mine ? "✓ Jawabanmu benar" : "✓ Jawaban benar") : mine ? `✗ ${who || "Jawabanmu"}` : "";
      return `<div class="${cls}"><span class="rv-opt-k">${k}</span><span class="rv-opt-t">${esc(q.options[k])}${tag ? `<small>${esc(tag)}</small>` : ""}</span></div>`;
    }).join("") + (!ok && !ans[String(q.no)] ? `<div class="rv-line rv-wrong">✗ Tidak dijawab</div>` : "");
    const item = (q, ok, openItem) => `<details class="rv-item ${ok ? "rv-ok" : "rv-bad"}" ${openItem ? "open" : ""}>
        <summary class="rv-q"><span class="rv-mark">${ok ? "✓" : "✗"}</span><span class="rv-qt"><span class="qno">${q.no}.</span>${esc(q.text)}</span></summary>
        <div class="rv-ans">${opts(q, ok)}</div>
      </details>`;
    return `<details class="rv" ${open ? "open" : ""}>
        <summary>Pembahasan jawaban — ${wrong.length ? `<b>${wrong.length} salah</b> · ${right.length} benar` : "<b>semua benar 🎉</b>"}</summary>
        ${wrong.length ? `<p class="rv-hint">${open ? "Pelajari soal yang salah di bawah ini: ✗ merah = pilihanmu, ✓ hijau = jawaban yang benar." : "Ketuk soal untuk melihat pilihan & jawaban yang benar."}</p>` : ""}
        ${wrong.map(q => item(q, false, open)).join("")}
        ${right.length ? `<details class="rv-sub"><summary>Lihat ${right.length} soal yang dijawab benar</summary>${right.map(q => item(q, true, false)).join("")}</details>` : ""}
      </details>`;
  }

  // ---- LTS2 Leadership Wheel (2026-11-03, user: asesmen 5 pertanyaan per kategori → roda kepemimpinan; mockup
  // pratinjau-leadership-wheel disetujui, hasil = garis yg menghubungkan titik skor). Keputusan user: terbuka sejak
  // hadir 1 bagian LTS2 (atau jalur alumni / sudah lulus), Ministry otomatis dari tim pelayanan JB3 HOME (bisa diubah),
  // boleh diisi ulang (riwayat disimpan, roda sebelumnya tampil putus-putus), Admin: roda tiap peserta + rata-rata di
  // dashboard LTS2. Bank soal & skor: LW_* / computeLwResult() di common.js. Tabel: lts2_wheel_results.
  const lwOpen = () => state.persona === "ADMIN" || !!state.lwLast
    || attN("lts2") >= 1 || state.lts2AccessStatus === "approved";
  const lwFmt = v => String(v).replace(".", ",");
  const LW_LEVEL = { g:["Hijau", "var(--good)", "Kehidupan pribadimu (roh, jiwa, tubuh) sehat. Jaga ritme ini, karena dari sinilah semua area lain mengalir."],
    y:["Kuning", "var(--warn)", "Ada bagian dari kehidupan pribadimu yang mulai terabaikan. Bicarakan dengan mentormu sebelum memengaruhi pelayananmu."],
    r:["Merah", "var(--bad)", "Kehidupan pribadimu butuh perhatian lebih dulu daripada tugas pelayanan. Temui mentor atau Home Leader-mu minggu ini."] };
  // 2026-11-03 (user): Admin melihat tiap area dalam kategori R/Y/G. Batas skor 1–10 disamakan dgn Leading Self
  // (total 13/14/19/20 → skor 4,5/5/7,5/8): R ≤4,5 · Y 5–7,5 · G ≥8.
  const lwLv = v => (Number(v) || 0) >= 8 ? "g" : (Number(v) || 0) >= 5 ? "y" : "r";
  const LW_LVC = { r:"var(--bad)", y:"var(--warn)", g:"var(--good)" };
  const LW_RYG = { r:"R · Merah", y:"Y · Kuning", g:"G · Hijau" };
  const LW_RYG_DEF = { r:"Butuh perhatian khusus: penguasaan diri/kepemimpinan di area ini masih rendah, perlu perbaikan mendesak.",
    y:"Sedang dalam proses: cukup, tetapi butuh kehati-hatian (in progress).",
    g:"Sudah bertumbuh: kuat dan dikuasai dengan baik (mature/strength)." };
  const lwDate = s => { try { return new Date(s).toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" }); } catch (e) { return ""; } };
  // Roda: 8 jari-jari (skala 1–10) + pusat Leading Self (R/Y/G). scores = {area: 1–10}; prev = roda sebelumnya (putus-putus).
  function lwWheelSVG(scores, level, prev) {
    const CX = 265, CY = 228, RI = 52, RO = 142, RL = 164, f = "font-family=\"Karla, sans-serif\"";
    const rad = v => RI + (Math.max(0, Math.min(10, Number(v) || 0)) / 10) * (RO - RI);
    const ang = i => (-90 + i * 45) * Math.PI / 180;
    const pt = (r, a) => [+(CX + r * Math.cos(a)).toFixed(1), +(CY + r * Math.sin(a)).toFixed(1)];
    const poly = sc => LW_CATS.map((c, i) => pt(rad(sc[c.key]), ang(i)).join(",")).join(" ");
    let s = `<circle cx="${CX}" cy="${CY}" r="${RO}" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="3"/>`;
    [2.5, 5, 7.5].forEach(v => { s += `<circle cx="${CX}" cy="${CY}" r="${rad(v)}" fill="none" stroke="var(--line)" stroke-dasharray="2 4"/>`; });
    LW_CATS.forEach((c, i) => {
      const a = ang(i), [x0, y0] = pt(RI, a), [x1, y1] = pt(RO, a), n = [-Math.sin(a), Math.cos(a)];
      s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--ink-faint)" stroke-width="1.2"/>`;
      for (let v = 1; v <= 10; v++) { const [tx, ty] = pt(rad(v), a), h = v % 5 ? 3 : 5;
        s += `<line x1="${(tx - n[0] * h).toFixed(1)}" y1="${(ty - n[1] * h).toFixed(1)}" x2="${(tx + n[0] * h).toFixed(1)}" y2="${(ty + n[1] * h).toFixed(1)}" stroke="var(--ink-faint)"/>`; }
      const [lx, ly] = pt(RL, a), cos = Math.cos(a), sin = Math.sin(a);
      const anchor = Math.abs(cos) < .2 ? "middle" : cos > 0 ? "start" : "end";
      const y0l = sin < -.9 ? ly - 6 : sin > .9 ? ly + 14 : ly - (c.lab.length - 1) * 7 + 4;
      c.lab.forEach((ln, j) => { s += `<text x="${lx}" y="${y0l + j * 14}" text-anchor="${anchor}" font-size="11.5" font-weight="800" letter-spacing=".06em" fill="var(--ink-soft)" ${f}>${esc(ln)}</text>`; });
    });
    if (prev) s += `<polygon points="${poly(prev)}" fill="none" stroke="var(--ink-faint)" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
    if (scores) {
      s += `<polygon points="${poly(scores)}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
      LW_CATS.forEach((c, i) => {
        const a = ang(i), v = Number(scores[c.key]) || 0, [px, py] = pt(rad(v), a), [bx, by] = pt(rad(v) + (v > 8 ? -17 : 17), a);
        s += `<circle cx="${px}" cy="${py}" r="5.5" fill="${LW_LVC[lwLv(v)]}" stroke="var(--surface)" stroke-width="2"/>`
          + `<circle cx="${bx}" cy="${by}" r="11" fill="var(--surface)" stroke="${LW_LVC[lwLv(v)]}" stroke-width="2"/>`
          + `<text x="${bx}" y="${by + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)" ${f}>${lwFmt(v)}</text>`;
      });
    }
    s += `<circle cx="${CX}" cy="${CY}" r="${RI}" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="3"/>`
      + `<text x="${CX}" y="${CY - 14}" text-anchor="middle" font-size="11" font-weight="800" letter-spacing=".05em" fill="var(--ink)" ${f}>LEADING SELF</text>`
      + `<text x="${CX}" y="${CY + 1}" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)" ${f}>Roh · Jiwa · Tubuh</text>`;
    [["r", "R", "var(--bad)"], ["y", "Y", "var(--warn)"], ["g", "G", "var(--good)"]].forEach(([k, L, col], j) => {
      const x = CX - 22 + j * 22, y = CY + 22, on = k === level;
      s += `<circle cx="${x}" cy="${y}" r="${on ? 9.5 : 7}" fill="${on ? col : "var(--surface-2)"}" ${on ? "" : `stroke="var(--line-strong)"`}/>`
        + `<text x="${x}" y="${(y + (on ? 3.8 : 3.2)).toFixed(1)}" text-anchor="middle" font-size="${on ? 11 : 9}" font-weight="800" fill="${on ? "var(--surface)" : col}" ${f}>${L}</text>`;
    });
    return `<svg class="lw-svg" viewBox="0 0 530 450" role="img" aria-label="Leadership Wheel">${s}</svg>`;
  }
  // Kartu hasil lengkap (dipakai peserta, Hasil Asesmen & Hasil Peserta Admin). hist = riwayat (terbaru dulu).
  function lwResultHTML(hist, name, viewingSelf) {
    const r = hist[0], prev = hist[1] || null;
    const sorted = LW_CATS.slice().sort((a, b) => (r.scores[b.key] || 0) - (r.scores[a.key] || 0));
    const low = sorted.slice(-2).reverse(), L = LW_LEVEL[r.self_level] || LW_LEVEL.y;
    const li = c => { const d = prev && prev.scores ? (r.scores[c.key] || 0) - (prev.scores[c.key] || 0) : 0;
      return `<li><span>${esc(c.id)}</span><em>${lwFmt(r.scores[c.key])}${d ? `<small class="${d > 0 ? "up" : "dn"}">${d > 0 ? "▲" : "▼"}${lwFmt(Math.abs(d))}</small>` : ""}</em></li>`; };
    return `<div class="lw-card">
      <div class="lw-band"><small>Lead To Serve 2 · ${esc(lwDate(r.created_at))}</small><b>Leadership Wheel</b>
        <div class="lw-ids"><div><span>Nama</span><b>${esc(name || "")}</b></div><div><span>Ministry</span><b>${esc(r.ministry || "—")}</b></div></div></div>
      ${lwWheelSVG(r.scores, r.self_level, prev && prev.scores)}
      ${prev ? `<p class="lw-legend"><i class="now"></i>${esc(lwDate(r.created_at))} <i class="was"></i>${esc(lwDate(prev.created_at))} (sebelumnya)</p>` : ""}
      <div class="lw-read">
        <div class="lw-self"><span class="lw-dot" style="background:${L[1]}"></span><div><b>Leading Self: ${L[0]} (${r.self_total}/${(r.scale || 5) * 5})</b><p>${esc(L[2])}</p></div></div>

  const DJ_QR = {

    rs3: [{ set:"rs3a", n:1, t:"Sesi 1 · Gereja JB3 dan Sejarahnya", babs:[1] }, { set:"rs3b", n:2, t:"Sesi 2 · Gereja Lokal dan Peranannya", babs:[2] }, { set:"rs3c", n:3, t:"Sesi 3 · Jemaat dan Peranan Jemaat", babs:[3] }],

  // kelas yang sedang dibuka (tab peserta / dashboard Admin) → tujuan tombol Bahan Ajar / Absensi / Aturan

  const qrLbl = k => /^rs/.test(k) ? ` ${k.toUpperCase()}-` : "-";
  let qrLibP = null, abqPoll = null;
  function loadQrLib() {
    if (window.QRCode) return Promise.resolve();
    if (!qrLibP) qrLibP = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; sc.onload = ok; sc.onerror = () => { qrLibP = null; no(new Error("Pembuat QR gagal dimuat")); }; document.head.appendChild(sc); });
    return qrLibP;

  async function openAbsQr(set) {
    const k = /^rs[123]/.test(set) ? set.slice(0, 3) : set === "lts2" ? "lts2" : "lts1", q = DJ_QR[k].find(x => x.set === set);
    const c = DASH_JOURNEYS.find(j => j.key === k);
    let token;
    try { [token] = await Promise.all([DB.attCode(set), loadQrLib()]); }
    catch (err) { toast("Kode QR belum bisa dibuat: " + (err.message || err)); return; }
    closeAbsQr();
    const w = document.createElement("div"); w.className = "djx abq-wrap";
    const tgl = new Date().toLocaleDateString("id-ID", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
    w.innerHTML = `<div class="abq" role="dialog" aria-label="Barcode absensi">
      <h2>Barcode${qrLbl(k)}${q.n} · ${esc(c.tab)}</h2>
      <p class="abq-sub">${esc(q.t)}<br><small>Berlaku hari ini · ${esc(tgl)}</small></p>
      <div class="abq-box"></div>
      <p class="abq-how">Peserta: buka aplikasi <b>JB3 HOME</b> → ketuk tombol <b>Scan</b> (ikon kamera di pojok kiri bawah) → arahkan ke kode ini. ${k === "lts1" && q.babs[0] === LTS1_PT ? "Post-test LTS1 langsung terbuka." : `${q.babs.length} ${unitOf(k)} langsung tercatat hadir.`}</p>
      <div class="abq-n" aria-live="polite"></div>
      <button type="button" class="btn btn--primary" data-absqrclose="1">Tutup</button></div>`;
    document.body.appendChild(w);
    new window.QRCode(w.querySelector(".abq-box"), { text:`JB3DJ:${set}:${token}`, width:600, height:600, correctLevel:window.QRCode.CorrectLevel.M });
    const count = () => DB.attRoster(k).then(rows => {
      const n = rows.filter(r => q.babs.every(b => r.babs.includes(b))).length, box = w.querySelector(".abq-n");
      if (box) box.textContent = n ? `✓ ${n} peserta sudah tercatat untuk barcode ini` : "";
    }).catch(() => {});
    count(); abqPoll = setInterval(() => { if (!w.isConnected) { clearInterval(abqPoll); return; } count(); }, 8000);
  }

        ${r.done ? "" : `<div class="ab-babs">${DJ_BAB[k].map((t, i) => `<button type="button" class="ab-bab" data-absbab="${esc(r.id)}:${i + 1}" aria-pressed="${r.babs.includes(i + 1)}" title="${esc(t)}">${i + 1}</button>`).join("")}${k === "lts1" ? `<button type="button" class="ab-bab" data-absbab="${esc(r.id)}:${LTS1_PT}" aria-pressed="${r.babs.includes(LTS1_PT)}" title="Post-test &amp; Kelulusan (Barcode 2)">PT</button>` : ""}</div>`}</div>`; }).join("");

      return `<button type="button" class="mt-tab" style="--jc:${c.color};" data-abtab="${x}" aria-pressed="${x === k}">${c.icon} ${c.tab}</button>`; }).join("");

  function resultsAnalyticsHTML(rows) {
    const total = rows.length;
    if (!total) return "";
    const domLetter = r => r.disc && r.disc.graph3 ? DISC_LETTERS.reduce((a, b) => (r.disc.graph3[b] > r.disc.graph3[a] ? b : a), DISC_LETTERS[0]) : null;
    // 2026-10-26 (user: "setiap angka ketika di tap muncul namanya"): tiap
    // batang = <details> — ketuk → daftar nama (ketuk nama → hasil orang itu).
    const pick = (label, list, max, color) => {
      const head = bar(label, list.length, 0, max, color);
      if (!list.length) return head;
      const names = list.slice().sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "id", { sensitivity:"base" }))
        .map(r => `<button type="button" class="ra-nm" data-viewresult="${esc(r.profileId)}">${esc(r.name || "?")}</button>`).join("");
      return `<details class="ra-d"><summary>${head}</summary><div class="ra-names">${names}</div></details>`;
    };
    const discRows = { D:[], I:[], S:[], C:[] };
    rows.forEach(r => { const l = domLetter(r); if (l) discRows[l].push(r); });
    const discFilled = Object.values(discRows).reduce((a, b) => a + b.length, 0);
    const maxDisc = Math.max(1, ...Object.values(discRows).map(x => x.length));
    // "LTS1 lengkap" pakai definisi PERSIS SAMA dgn serveSectionFilled()/
    // banner "Serve Road Map Lengkap!" (serveGridHTML()) — 1 sumber
    // kebenaran, cuma dibaca dari r.roadmap.data (data org LAIN) di sini,
    // bukan state.draft.roadmapData (data diri sendiri).
    const sectionFilledFor = (rd, key) => {
      const sec = ROADMAP_SECTIONS.find(x => x.key === key);
      return !!(sec && sec.fields.some(f => { const v = rd[f.key]; return Array.isArray(v) ? v.length > 0 : !!v; }));
    };
    const ltsComplete = rows.filter(r => {
      const rd = (r.roadmap && r.roadmap.data) || {};
      return SERVE_SECTIONS.every(s => sectionFilledFor(rd, s.key));
    });
    const rs3Pass = rows.filter(r => r.rs3 && r.rs3.passed);
    const lts2Pass = rows.filter(r => r.lts2 && r.lts2.passed);
    const giftFreq = {};
    rows.forEach(r => { if (r.gifts && r.gifts.scores && r.gifts.scores.top3) r.gifts.scores.top3.forEach(code => { (giftFreq[code] = giftFreq[code] || []).push(r); }); });
    const topGifts = Object.entries(giftFreq).sort((a, b) => b[1].length - a[1].length).slice(0, 5);
    const maxGift = Math.max(1, ...topGifts.map(g => g[1].length));
    const hdFreq = {};
    rows.forEach(r => { ((r.roadmap && r.roadmap.data && r.roadmap.data.holyDiscontentAreas) || []).forEach(a => { (hdFreq[a] = hdFreq[a] || []).push(r); }); });
    const topHd = Object.entries(hdFreq).sort((a, b) => b[1].length - a[1].length).slice(0, 5);
    const maxHd = Math.max(1, ...topHd.map(h => h[1].length));
    // 2026-11-03 (user: "kartu ringkasan peserta dirapihkan dan buat menarik secara visual"): penyelesaian = cincin
    // progres per kelas (warna kelas), Leading Self = 1 batang bertumpuk R/Y/G, DISC = 4 ubin huruf. Ketuk ubin →
    // daftar nama muncul di bawah kelompoknya (data-rapick ↔ data-ralist, 1 terbuka per kelompok).
    const jc = k => (DASH_JOURNEYS.find(c => c.key === k) || {}).color || "var(--accent)";
    const nameList = (id, list) => `<div class="ra-names ra-pan" data-ralist="${id}" hidden>${list.slice().sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "id", { sensitivity:"base" }))
      .map(r => `<button type="button" class="ra-nm" data-viewresult="${esc(r.profileId)}">${esc(r.name || "?")}</button>`).join("") || `<span class="sub">Belum ada.</span>`}</div>`;
    const pctOf = (n, d) => d ? Math.round(n / d * 100) : 0;
    const ring = (id, lbl, sub, list, color) => { const p = pctOf(list.length, total);
      return `<button type="button" class="ra-ring" style="--rc:${color};" data-rapick="${id}" aria-pressed="false"${list.length ? "" : " disabled"}>
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.9" class="ra-ring-bg"/><circle cx="18" cy="18" r="15.9" class="ra-ring-fg" stroke-dasharray="${p} 100"/></svg>
        <span class="ra-ring-n"><b>${list.length}</b><small>${p}%</small></span>
        <span class="ra-ring-l"><b>${esc(lbl)}</b>${esc(sub)}</span></button>`; };
    const comp = [
      ["c0", "RS1", "lulus", rows.filter(r => r.rs1 && r.rs1.passed), jc("rs1")],
      ["c1", "RS2", "lulus", rows.filter(r => r.rs2 && r.rs2.passed), jc("rs2")],
      ["c2", "RS3", "lulus", rs3Pass, jc("rs3")],
      ["c3", "LTS1", "Road Map lengkap", ltsComplete, jc("lts1")],
      ["c4", "LTS1", "post-test lulus", rows.filter(r => r.lts1pt && r.lts1pt.passed), jc("lts1")],
      ["c5", "LTS2", "lulus", lts2Pass, jc("lts2")],
    ];
    const lwRows = rows.filter(r => r.lw && r.lw.length);
    const lwGrp = ["r", "y", "g"].map(k => [k, lwRows.filter(r => (r.lw[0].self_level || "y") === k)]);
    const sec = (ic, title, note, body) => `<div class="ra-sec"><div class="ra-sec-h"><span class="ra-sec-ic" aria-hidden="true">${ic}</span><b>${esc(title)}</b>${note ? `<small>${note}</small>` : ""}</div>${body}</div>`;
    const kpi = (n, l, c) => `<span style="--kc:${c};"><b>${n}</b>${esc(l)}</span>`;
    return `<div class="card ra-card">
      <div class="ra-top">
        <div class="ra-top-t"><span aria-hidden="true">📊</span><div><b>Ringkasan ${total} Peserta</b><small>Untuk perencanaan pelayanan & penempatan tim · ketuk angka untuk melihat nama</small></div></div>
        <div class="ra-kpi">${kpi(total, "peserta", "var(--accent)")}${kpi(discFilled, "isi DISC", "var(--disc-c)")}${kpi(lwRows.length, "isi Wheel", "var(--warn)")}${kpi(lts2Pass.length, "lulus LTS2", "var(--good)")}</div>
      </div>
      ${sec("🎓", "Tingkat Penyelesaian", "RS1 → LTS2", `<div class="ra-rings">${comp.map(([id, l, sb, list, c]) => ring(id, l, sb, list, c)).join("")}</div>${comp.map(([id, , , list]) => nameList(id, list)).join("")}`)}
      ${lwRows.length ? sec("🛞", "Leadership Wheel · Leading Self", `${lwRows.length}/${total} sudah isi`, `<div class="ra-stack">${lwGrp.filter(([, l]) => l.length).map(([k, l]) => `<i style="flex:${l.length};background:${LW_LVC[k]};"></i>`).join("")}</div>
        <div class="ra-legend">${lwGrp.map(([k, l]) => `<button type="button" class="ra-lg" style="--rc:${LW_LVC[k]};" data-rapick="w${k}" aria-pressed="false"${l.length ? "" : " disabled"}><i></i>${esc(LW_RYG[k])}<b>${l.length}</b></button>`).join("")}</div>
        ${lwGrp.map(([k, l]) => nameList("w" + k, l)).join("")}`) : ""}
      ${sec("🧭", "Distribusi DISC", discFilled < total ? `${discFilled}/${total} sudah isi` : "", `<div class="ra-disc">${DISC_LETTERS.map(l => `<button type="button" class="ra-dt" style="--rc:var(--disc-${l.toLowerCase()});" data-rapick="d${l}" aria-pressed="false"${discRows[l].length ? "" : " disabled"}>
          <span class="ra-dt-l">${l}</span><b>${discRows[l].length}</b><small>${pctOf(discRows[l].length, discFilled)}%</small><span class="ra-dt-bar"><i style="height:${Math.round(discRows[l].length / maxDisc * 100)}%"></i></span></button>`).join("")}</div>
        ${DISC_LETTERS.map(l => nameList("d" + l, discRows[l])).join("")}`)}
      ${topGifts.length ? sec("🎁", "Karunia Rohani Terbanyak", "top 3 gabungan", `<div class="ra-rank">${topGifts.map(([code, list], i) => `<div class="ra-rk"><span class="ra-rk-n">${i + 1}</span>${pick(giftName(code), list, maxGift, "var(--accent)")}</div>`).join("")}</div>`) : ""}
      ${topHd.length ? sec("🔥", "Area Holy Discontent Terbanyak", "", `<div class="ra-rank">${topHd.map(([area, list], i) => `<div class="ra-rk"><span class="ra-rk-n">${i + 1}</span>${pick(area, list, maxHd, "var(--warn)")}</div>`).join("")}</div>`) : ""}

    if (!pdfReady()) { toast("Fitur PDF belum siap, coba lagi sebentar."); return; }
    if (!(navigator.share && navigator.canShare)) { toast("Perangkat/browser ini tidak mendukung fitur Bagikan — gunakan tombol Unduh PDF, lalu bagikan filenya secara manual."); return; }
    try {
      const blob = buildFn().output("blob");
      const file = new File([blob], filename, { type: "application/pdf" });
      if (!navigator.canShare({ files: [file] })) { toast("Perangkat ini tidak mendukung berbagi file PDF — gunakan tombol Unduh PDF saja."); return; }

    } catch (err) {

  // 2026-09-23 (permintaan user, "Hasil asesmen dari semua isian kamu buat
  // detail yang bisa dibaca dan juga di download"): satu fungsi merangkai
  // interpretasi dari SEMUA instrumen (DISC/SSD/Karunia Rohani) + isian Serve
  // Road Map sendiri jadi objek narasi — dipakai BERSAMA oleh tampilan layar
  // (hasilOnScreenHTML, gaya app biasa) & lembar PDF (hasilReportHTML, gaya
  // dokumen), spy logika interpretasi tak dobel ditulis.
  // 2026-09-23 (permintaan user, "admin dapat melihat setiap hasil test dan
  // asesment dari setiap pengguna..."): parameter ditambahkan dgn DEFAULT
  // jatuh balik ke state.my*/state.draft.roadmapData — pemanggilan LAMA
  // `buildHasilNarrative()` tanpa argumen (RENDER.hasil, tombol PDF) TETAP
  // berfungsi PERSIS spt sebelumnya; pemanggilan BARU dgn argumen eksplisit
  // (RENDER.resultdetail, Admin lihat hasil org lain) memakai data ORANG
  // ITU, bukan diri sendiri. Sengaja TIDAK dibuat 2 fungsi terpisah (dobel
  // logic interpretasi DISC/SSD/Gifts yg cukup panjang, rawan divergen).
  function buildHasilNarrative(disc, ssd, gifts, roadmapData) {
    if (disc === undefined) disc = state.myDisc;
    if (ssd === undefined) ssd = state.mySsd;
    if (gifts === undefined) gifts = state.myGifts;
    const rd = roadmapData !== undefined ? roadmapData : (state.draft.roadmapData || {});
    let discLetter = null, discProfile = null;
    if (disc) {
      discLetter = DISC_LETTERS.reduce((a, b) => (disc.graph3[b] > disc.graph3[a] ? b : a), DISC_LETTERS[0]);
      discProfile = DISC_PROFILES[discLetter];
    }
    const ssdLow = [], ssdHealthy = [];
    if (ssd) {
      SSD_CATEGORIES.forEach(c => {
        const v = ssd.scores[c.code];
        if (v < 0) ssdLow.push({ code:c.code, name:c.name, nameEn:c.nameEn, score:v, def:SSD_INSIGHT[c.code].def, text:SSD_INSIGHT[c.code].low });
        else ssdHealthy.push({ code:c.code, name:c.name, nameEn:c.nameEn, score:v, def:SSD_INSIGHT[c.code].def });
      });
      ssdLow.sort((a, b) => a.score - b.score);
    }
    const giftDetail = code => { const g = GIFTS_LIST.find(x => x.code === code); return { code, name:giftName(code), def:g ? g.def : "" }; };
    const giftsTop3 = gifts ? gifts.scores.top3.map(giftDetail) : [];
    const giftsNext3 = gifts ? gifts.scores.next3.map(giftDetail) : [];
    const own = [
      rd.abilityText && { label:"Yang Bisa Dilakukan dengan Baik (Ability)", text:rd.abilityText },
      rd.passionText && { label:"Yang Disukai (Passion)", text:rd.passionText },
      rd.strengthStatement && { label:"Strength Statement", text:rd.strengthStatement },
      rd.highPoint && { label:"Titik Tertinggi (Experience)", text:rd.highPoint },
      rd.lowPoint && { label:"Titik Terendah (Experience)", text:rd.lowPoint },
      rd.holyDiscontentStatement && { label:"Holy Discontent Statement", text:rd.holyDiscontentStatement },
      rd.visionStatement && { label:"Vision Statement", text:rd.visionStatement },
      rd.missionStatement && { label:"Mission Statement", text:rd.missionStatement },
      rd.goal && { label:"Goal Pelayanan (Expansion)", text:rd.goal },
    ].filter(Boolean);
    const recoBits = [];
    if (discProfile) recoBits.push(`gaya kepribadian ${discProfile.name}`);
    if (giftsTop3.length) recoBits.push(`karunia rohani ${giftsTop3.map(g => g.name).join(", ")}`);
    const recommendation = recoBits.length
      ? `Berdasarkan kombinasi ${recoBits.join(" dan ")}, area pelayanan yang berpotensi cocok antara lain: ${(discProfile ? discProfile.ministryFit.join(", ") : "-")}.`
      : "";
    // 2026-09-23 (permintaan user, "kata-kata 'yang perlu diperbaiki' di
    // kartu Hasil Asesmen dihapus"): dulu ada bagian "Yang Perlu Diperbaiki"
    // (DISC watchouts + SSD low-area insights) di layar & PDF — SEKARANG
    // tak ditampilkan sama sekali. `improve` tetap dihitung & dikembalikan
    // (murah, tak dipakai di UI manapun) siapa tahu dibutuhkan lagi nanti.
    const improve = [];
    if (discProfile) improve.push(...discProfile.watchouts);
    ssdLow.forEach(c => improve.push(c.text));
    return { discLetter, discProfile, ssdLow, ssdHealthy, giftsTop3, giftsNext3, own, recommendation, improve };
  }

      ${state.myGifts ? `

  function resultBodyHTML(disc, ssd, gifts, roadmapData, rs3, lts2, viewingSelf, pt) {

    // 2026-09-23 (permintaan user, "berikan penjelasan/keterangan hasil SSD"

    // SETIAP kategori (sehat maupun rendah) dapat deskripsi netral apa yg
    // diukur (SSD_INSIGHT[code].def), ditambah catatan peringatan KHUSUS di

    const ssdHTML = !ssd ? `<div class="card pad"><p class="sub" style="margin:0 0 ${viewingSelf ? 8 : 0}px;">SSD belum diisi${viewingSelf ? "" : " oleh peserta ini"}.</p>${viewingSelf ? `<button type="button" class="btn btn--ghost" data-goto="ssd">Isi SSD</button>` : ""}</div>` :

    const asCard = o => `<article class="as-card${o.empty ? " as-card--empty" : ""}" style="--c:${o.c};">

  // 2026-09-22 (permintaan user, "tombol mulai" di kartu Lead To Serve 1 di
  // JB3 HOME Tracker — carousel Discipleship Journey): terima sesi login yg
  // diteruskan dari JB3 HOME Tracker lewat URL fragment (#at=...&rt=...) —
  // fragment TAK PERNAH terkirim ke server (murni dibaca browser), jadi aman
  // dipakai bawa token. Kalau ada, langsung pasang sesi (spy tak perlu ketik
  // ulang No. HP+kata sandi yg SAMA dgn akun JB3), lalu fragment dibersihkan
  // dari address bar (replaceState) spy token tak nyangkut di riwayat/URL.
  // 2026-09-22 susulan (permintaan user, "tambahkan notifikasi di icon
  // lonceng admin, pengajuan Lead To Serve"): fragment SEKARANG jg bisa bawa
  // "&p=<halaman>" opsional (dipakai tombol "Buka & Kelola" di lonceng JB3,
  // deep-link LANGSUNG ke halaman "dashboard" — bukan cuma beranda spt
  // sebelumnya). Dikembalikan sbg { ok, page } spy boot() tahu ke mana.
  async function claimHandoffSession() {
    // 2026-10-04: link yg dibagikan (mis. RS3FB_LINK "#p=rs3feedback") —
    // halaman tujuan diingat di sessionStorage spy tetap terbuka SETELAH
    // pengguna login dulu (boot() dipanggil ulang sesudah login).
    const pm = /^#p=([a-z0-9]+)$/i.exec(location.hash);
    if (pm) {
      try { sessionStorage.setItem("dj_pending_page", pm[1]); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search);
      return { ok:false, page:null };
    }
    const m = /^#at=([^&]+)&rt=([^&]+)(?:&p=([^&]+))?/.exec(location.hash);
    if (!m) return { ok:false, page:null };
    try {
      // 2026-10-19 (user: "saat masuk discipleship journey lama"): setSession() selalu memanggil server
      // (cek token) sebelum apa pun tampil. Kalau DJ sudah memegang token yg PERSIS sama, langkah itu dilewati.
      // (Hanya token yg sama — token lama dari sesi sebelumnya bisa sudah diganti JB3.)
      const at = decodeURIComponent(m[1]);
      const cur = (await sb.auth.getSession()).data.session;
      if (!(cur && cur.access_token === at))
        await sb.auth.setSession({ access_token:at, refresh_token:decodeURIComponent(m[2]) });
      history.replaceState(null, "", location.pathname + location.search);
      return { ok:true, page: m[3] ? decodeURIComponent(m[3]) : null };
    } catch (e) { console.error(e); return { ok:false, page:null }; }
  }

  async function boot() {

    if (T.closest("#fbSend")) {
      const d = state.fbDraft || {};
      if (!FB_Q.every(q => d[q.k] >= 1)) { toast("Beri bintang untuk ketiga penilaian dulu ya."); return; }
      const btn = el("fbSend"); btn.disabled = true;
      try {
        await DB.submitRs3Feedback({ classKey:state.fbKey || "rs3", materi:d.materi, durasi:d.durasi, pengajar:d.pengajar, berkesan:el("fbBerkesan").value.trim(), saran:el("fbSaran").value.trim() });
        try { localStorage.setItem((FB_CLASSES[state.fbKey] || FB_CLASSES.rs3).sentKey, new Date().toISOString()); } catch (e) {}
        state.fbDraft = {}; state.fbAgain = false;
        toast("Terima kasih! Feedback-mu terkirim 🙏");
        RENDER.feedback();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { btn.disabled = false; toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }
    if (T.closest("[data-fbagain]")) { state.fbAgain = true; RENDER.feedback(); return; }
    const fbShare = T.closest("[data-fbshare]");
    if (fbShare) { shareFeedback(fbShare.dataset.fbshare); return; }
    const fbNew = T.closest("[data-fbbnew]");
    if (fbNew) {
      const fk = FB_CLASSES[fbNew.dataset.fbbnew] ? fbNew.dataset.fbbnew : "rs3";
      const n = (state.rs3FbBatches || []).filter(b => (b.class_key || "rs3") === fk).length + 1;
      const name = (prompt("Nama batch baru (mis. kelas berikutnya). Feedback yang masuk setelah ini akan dikelompokkan ke batch ini:", "Batch " + n) || "").trim();
      if (!name) return;
      try {
        await DB.startRs3FbBatch(name.slice(0, 80), fk);
        state.rs3FbBatches = await DB.listRs3FbBatches();
        toast("Batch \"" + name + "\" aktif — feedback baru masuk ke sini.");
        RENDER.dashboard();
      } catch (err) { toast("Gagal membuat batch: " + (err.message || err)); }
      return;
    }
    const fbRen = T.closest("[data-fbbrename]");
    if (fbRen) {
      const b = (state.rs3FbBatches || []).find(x => x.id === fbRen.dataset.fbbrename); if (!b) return;
      const name = (prompt("Nama batch:", b.name) || "").trim();
      if (!name || name === b.name) return;
      try { await DB.renameRs3FbBatch(b.id, name.slice(0, 80)); b.name = name.slice(0, 80); RENDER.dashboard(); }
      catch (err) { toast("Gagal mengganti nama: " + (err.message || err)); }
      return;
    }
    const fbDel = T.closest("[data-fbdel]");
    if (fbDel) {
      if (!confirm("Hapus feedback ini?")) return;
      try { await DB.deleteRs3Feedback(fbDel.dataset.fbdel); state.rs3Feedback = (state.rs3Feedback || []).filter(r => r.id !== fbDel.dataset.fbdel); RENDER.dashboard(); }
      catch (err) { toast("Gagal menghapus: " + (err.message || err)); }
      return;
    }
    const lbF = T.closest("[data-lbf]");
    if (lbF) { state.lts1BatchF = lbF.dataset.lbf; RENDER.dashboard(); return; }
    if (T.closest("[data-lbreload]")) { state.lts1Batch = null; RENDER.dashboard(); return; }
    const cbF = T.closest("[data-cbf]");
    if (cbF) { const [k, x] = cbF.dataset.cbf.split(":"); state.batchF = state.batchF || {}; state.batchF[k] = x; RENDER.dashboard(); return; }
    const cbR = T.closest("[data-cbreload]");
    if (cbR) { if (state.batch) state.batch[cbR.dataset.cbreload] = null; RENDER.dashboard(); return; }
    const dashTog = T.closest("[data-dashtog]");
    if (dashTog) {
      const k = dashTog.dataset.dashtog; state.dashOpen = state.dashOpen || {};
      const cur = state.dashOpen[k] != null ? state.dashOpen[k] : dashTog.dataset.def === "1";
      state.dashOpen[k] = !cur; RENDER.dashboard(); return;
    }
    const dashTab = T.closest("[data-dashtab]");
    if (dashTab) {
      state.dashKey = dashTab.dataset.dashtab;
      if (state.page !== "dashboard") { state.stack = []; show("dashboard", { replace:true }); }
      else { renderChrome(); RENDER.dashboard(); }
      document.querySelector(".scroll") && document.querySelector(".scroll").scrollTo({ top:0 });
      return;
    }
    if (T.closest("#gearBtn")) { show("profile"); return; }
    // 2026-10-26 (rapikan DJ): tombol di judul = satu pintu tim Content; langsung ke tab kelas yang sedang dilihat.
    const hb = T.closest("#materiBtn") || T.closest("#absenBtn") || T.closest("#aturanBtn");
    if (hb) { const ck = ctxClass(), pg = { materiBtn:"materi", absenBtn:"absensi", aturanBtn:"aturan" }[hb.id.replace(/^dj_/, "")];
      if (ck) { if (pg === "materi") state.materiKey = ck; else if (pg === "absensi") state.absKey = ck; else if (HR_CLASS[ck]) state.hrKey = ck; }
      show(pg); return; }
    const hrTab = T.closest("[data-hrtab]");
    if (hrTab) { state.hrKey = hrTab.dataset.hrtab; RENDER.aturan(); return; }
    const hrWa = T.closest("[data-hrwa],[data-hrcopy]");
    if (hrWa) { shareHouseRules(hrWa.dataset.hrwa || hrWa.dataset.hrcopy, !!hrWa.dataset.hrcopy); return; }
    const abQr = T.closest("[data-absqr]");
    if (abQr) { openAbsQr(abQr.dataset.absqr); return; }
    if (T.closest("[data-absqrclose]")) { closeAbsQr(); return; }
    const abTab = T.closest("[data-abtab]");
    if (abTab) { state.absKey = abTab.dataset.abtab; RENDER.absensi(); return; }
    const abBab = T.closest("[data-absbab]");
    if (abBab) {
      const [pid, bab] = abBab.dataset.absbab.split(":"), k = state.absKey || "lts1", n = Number(bab);
      const r = ((state.absRoster || {})[k] || []).find(x => x.id === pid); if (!r) return;
      const on = !r.babs.includes(n);
      r.babs = on ? r.babs.concat(n).sort((a, b) => a - b) : r.babs.filter(x => x !== n);
      const l = el("absList"); if (l) l.innerHTML = absListHTML();
      try { await DB.setAttendance(pid, k, n, on); if (pid === state.meId) state.myAtt[k] = r.babs.slice(); }
      catch (err) { r.babs = on ? r.babs.filter(x => x !== n) : r.babs.concat(n).sort((a, b) => a - b); const l2 = el("absList"); if (l2) l2.innerHTML = absListHTML(); toast("Gagal simpan absensi: " + (err.message || err)); }
      return;
    }
    const matTab = T.closest("[data-materitab]");
    const mtJump = T.closest("[data-mtjump],[data-mttop]");
    if (mtJump) { const sec = mtJump.closest(".mt-sec"), bk = sec && sec.querySelector(".bk");   // 2026-11-21: mode buku → lompat halaman
      const tg = mtJump.dataset.mtjump ? el(mtJump.dataset.mtjump) : null;
      if (bk) { if (tg) bkJump(bk, tg); else bkGo(bk, 0, true); } return; }
    if (matTab) { state[{ famateri:"famMateriKey", kidsmateri:"kidsMateriKey" }[state.page] || "materiKey"] = matTab.dataset.materitab; RENDER[state.page](); const op = el("mtOpen"); if (op) op.scrollIntoView({ block:"start", behavior:"smooth" }); else { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0 }); } return; }

    // ---- RS1/RS2 post-test (2026-10-15): pilih jawaban, kirim. ----
    const ptAns = T.closest("[data-ptans-rs1],[data-ptans-rs2],[data-ptans-lts1]");
    if (ptAns) {
      const k = ["rs1", "rs2", "lts1"].find(x => ptAns.hasAttribute("data-ptans-" + x));
      const [no, key] = ptAns.getAttribute("data-ptans-" + k).split(":");
      (state.draft[k + "Answers"] = state.draft[k + "Answers"] || {})[no] = key; draftTouch(k + "Answers");
      RENDER[k === "lts1" ? "home" : k]();
      return;
    }
    const ptSave = T.closest("[data-ptsave]");
    if (ptSave) {
      const k = ptSave.dataset.ptsave, title = { rs1:"Rock Solid 1", rs2:"Rock Solid 2", lts1:"Lead To Serve 1" }[k];
      const result = computePtResult(k, state.draft[k + "Answers"]);
      ptSave.disabled = true;
      try {
        await DB.savePtResult(k, { answers:state.draft[k + "Answers"], correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        draftDone(k + "Answers");
        state[k + "Result"] = await DB.myPtLatest(k);
        if (k === "lts1") {
          const fin = result.passed && await lts1TryComplete();
          if (!fin) toast(result.passed ? `Post-test lulus (${result.bandLabel})! ${lts1Done() ? "" : "Lengkapi DISC, SSD, Karunia Rohani & absensi untuk lulus kelas LTS1."}` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
          RENDER.home();
          return;
        }
        if (result.passed && state.myProfile) { const cl = Array.isArray(state.myProfile.classes) && state.myProfile.classes.length === 5 ? [...state.myProfile.classes] : Array(5).fill(false); cl[k === "rs1" ? 0 : 1] = true; state.myProfile.classes = cl; }
        toast(result.passed ? `Lulus (${result.bandLabel})! Kelas ${title} sudah ditandai selesai.` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER[k]();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { ptSave.disabled = false; toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }
    const ptApp = T.closest("[data-ptappreq]"), ptRej = T.closest("[data-ptrejreq]");
    if (ptApp || ptRej) {
      const id = (ptApp || ptRej).dataset.ptappreq || (ptApp || ptRej).dataset.ptrejreq;
      try {
        await DB.decidePtAccessRequest(id, !!ptApp);
        toast(ptApp ? "Permintaan disetujui." : "Permintaan ditolak.");
        const all = await DB.listAllPtAccessRequests(); state.rs1AccessRequests = all.rs1; state.rs2AccessRequests = all.rs2;
        renderChrome(); RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    const ptDel = T.closest("[data-ptdelreq]");
    if (ptDel) {
      if (!confirm("Hapus persetujuan akses orang ini? Post-test akan terkunci lagi baginya sampai mengajukan ulang.")) return;
      try {
        await DB.deletePtAccessRequest(ptDel.dataset.ptdelreq);
        toast("Akses dihapus.");
        const all = await DB.listAllPtAccessRequests(); state.rs1AccessRequests = all.rs1; state.rs2AccessRequests = all.rs2;
        RENDER.dashboard();
      } catch (err) { toast("Gagal: " + (err.message || err)); }
      return;
    }
    const raPick = T.closest("[data-rapick]");
    if (raPick) {
      const id = raPick.dataset.rapick, secEl = raPick.closest(".ra-sec"), on = raPick.getAttribute("aria-pressed") !== "true";
      if (secEl) { secEl.querySelectorAll("[data-rapick]").forEach(b => b.setAttribute("aria-pressed", "false")); secEl.querySelectorAll("[data-ralist]").forEach(x => { x.hidden = true; }); }
      raPick.setAttribute("aria-pressed", String(on));
      const lst = secEl && secEl.querySelector(`[data-ralist="${id}"]`); if (lst) lst.hidden = !on;
      return;
    }
    const resFilter = T.closest("[data-resultsfilter]");
    if (resFilter) {
      state.resultsFilter = resFilter.dataset.resultsfilter;
      document.querySelectorAll("[data-resultsfilter]").forEach(b => { const on = b.dataset.resultsfilter === state.resultsFilter; b.classList.toggle("btn--primary", on); b.classList.toggle("btn--ghost", !on); });
      const l = el("rsList"); if (l) l.innerHTML = resultsListHTML();
      return;
    }
    const viewRes = T.closest("[data-viewresult]");
    if (viewRes) { state.viewProfileId = viewRes.dataset.viewresult; show("resultdetail"); return; }

    // ---- Rock Solid 3 post-test: pilih jawaban (data-rs3ans) & kirim
    // (2026-09-23) — sama pola dgn DISC/SSD/Gifts di atas. ----
    const rs3Ans = T.closest("[data-rs3ans]");
    if (rs3Ans) {
      const [no, key] = rs3Ans.dataset.rs3ans.split(":");
      state.draft.rs3Answers[no] = key; draftTouch("rs3Answers");
      RENDER.rs3();
      return;
    }
    if (T.closest("#rs3Save")) {
      const result = computeRs3Result(state.draft.rs3Answers);
      try {
        await DB.saveRs3Result({ answers:state.draft.rs3Answers, correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        draftDone("rs3Answers");
        state.rs3Result = await DB.myRs3Latest();
        toast(result.passed ? `Lulus (${result.bandLabel})! Kelas Rock Solid 3 sudah ditandai selesai.` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER.rs3();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }

    // ---- LTS2 Leadership Wheel (2026-11-03): pilih skala (data-lwans="area:no:nilai"), kirim, isi ulang ----
    const lwA = T.closest("[data-lwans]");
    if (lwA) {
      const [g, no, v] = lwA.dataset.lwans.split(":");
      state.draft.lwAnswers[g + ":" + no] = Number(v); draftTouch("lwAnswers");
      const openNow = [...document.querySelectorAll("[data-lwgrp]")].filter(d => d.open).map(d => d.dataset.lwgrp);
      const full = key => [1, 2, 3, 4, 5].every(j => state.draft.lwAnswers[key + ":" + j]);
      if (full(g)) {   // area ini lengkap → tutup, buka area berikutnya yg belum lengkap
        const i = LW_GROUPS.findIndex(x => x.key === g), next = LW_GROUPS.slice(i + 1).concat(LW_GROUPS.slice(0, i)).find(x => !full(x.key));
        state.lwOpenGrp = openNow.filter(k => k !== g).concat(next && !openNow.includes(next.key) ? [next.key] : []);
        RENDER.lw();
        if (next) { const d = document.querySelector(`[data-lwgrp="${next.key}"]`); if (d) d.scrollIntoView({ behavior:"smooth", block:"start" }); }
      } else { state.lwOpenGrp = openNow; RENDER.lw(); }
      return;
    }
    if (T.closest("[data-lwredo]")) { state.lwEdit = true; state.lwOpenGrp = null; state.draft.lwMinistry = null; RENDER.lw(); { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0 }); } return; }
    if (T.closest("[data-lwcancel]")) { state.lwEdit = false; state.draft.lwAnswers = {}; draftDone("lwAnswers"); RENDER.lw(); return; }
    const lwS = T.closest("[data-lwsave]");
    if (lwS) {
      if (!lwComplete(state.draft.lwAnswers)) return;
      const res = computeLwResult(state.draft.lwAnswers);
      lwS.disabled = true;
      try {
        await DB.saveLw({ ministry:state.draft.lwMinistry || "", answers:state.draft.lwAnswers, scores:res.scores, selfTotal:res.selfTotal, selfLevel:res.selfLevel, scale:res.scale });
        draftDone("lwAnswers");
        state.lwHist = await DB.myLwHistory(); state.lwLast = state.lwHist[0] || null;
        await lts2TryComplete();
        state.draft.lwAnswers = {}; state.draft.lwMinistry = null; state.lwEdit = false; state.lwOpenGrp = null;
        snapSave();
        toast("Leadership Wheel disimpan.");
        RENDER.lw();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { lwS.disabled = false; toast("Gagal menyimpan: " + (err.message || err)); }
      return;
    }

    // ---- Lead To Serve 2 post-test: pilih jawaban (data-lts2ans) & kirim
    // (2026-09-23) — SAMA PERSIS pola RS3 di atas. ----
    const lts2Ans = T.closest("[data-lts2ans]");
    if (lts2Ans) {
      const [no, key] = lts2Ans.dataset.lts2ans.split(":");
      state.draft.lts2Answers[no] = key; draftTouch("lts2Answers");
      RENDER.lts2();
      return;
    }
    if (T.closest("#lts2Save")) {
      const result = computeLts2Result(state.draft.lts2Answers);
      try {
        await DB.saveLts2Result({ answers:state.draft.lts2Answers, correct:result.correct, total:result.total, pct:result.pct, band:result.bandLabel, passed:result.passed });
        draftDone("lts2Answers");
        state.lts2Result = await DB.myLts2Latest();
        const fin2 = result.passed && await lts2TryComplete();
        if (!fin2) toast(result.passed ? `Post-test lulus (${result.bandLabel})! ${lts2Done() ? "" : "Isi Leadership Wheel untuk lulus kelas LTS2."}` : `Belum lulus (${result.bandLabel}) — boleh coba lagi.`);
        RENDER.lts2();
        { const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top:0, behavior:"smooth" }); }
      } catch (err) { toast("Gagal mengirim: " + (err.message || err)); }
      return;
    }

    // ---- Serve Road Map: checkbox Vision (data-rmarea) & tombol Simpan
    // per bagian (data-rmsave) — 2026-09-23 ("kerjakan yang experience"),
    // rmarea belum dipakai section "experience" tp digenerikkan sekalian
    // spy Vision (checkboxList) nanti tinggal jalan, tak perlu diubah lagi. ----
    const rmArea = T.closest("[data-rmarea]");
    if (rmArea) {
      const a = rmArea.dataset.rmarea;
      // Satu2nya checkboxList di ROADMAP_SECTIONS skrg cuma "holyDiscontentAreas"
      // (bagian Vision) — key-nya ditulis langsung, tak perlu dicari dari DOM.
      const cur = Array.isArray(state.draft.roadmapData.holyDiscontentAreas) ? state.draft.roadmapData.holyDiscontentAreas.slice() : [];
      const idx = cur.indexOf(a);
      if (idx >= 0) cur.splice(idx, 1); else cur.push(a);
      state.draft.roadmapData.holyDiscontentAreas = cur;
      draftTouch("roadmapData"); rmAutosave("holyDiscontentAreas");
      RENDER[state.page] && RENDER[state.page]();
      return;
    }
    const rmSave = T.closest("[data-rmsave]");
    if (rmSave) {
      const sectionKey = rmSave.dataset.rmsave;
      const sec = ROADMAP_SECTIONS.find(s => s.key === sectionKey);
      const patch = Object.fromEntries(sec.fields.map(f => [f.key, state.draft.roadmapData[f.key]]));
      try {
        await DB.saveRoadmapSection(CURRENT_YEAR, patch);
        state.myRoadmap = await DB.myRoadmap(CURRENT_YEAR);
        // 2026-09-23 (permintaan user - ide "auto-tandai kelas Lead To Serve 1
        // begitu 5 bagian S-E-R-V-E lengkap", diusulkan Claude, dipilih user
        // "1,3 jalankan"): dicek SETIAP simpan bagian apa pun (bukan cuma
        // Expansion — bagian TERAKHIR yg diisi bisa yg mana saja) — kalau
        // KELIMA bagian sudah terisi (serveSectionFilled(), definisi SAMA
        // dgn banner "Serve Road Map Lengkap!" di serveGridHTML()), tandai
        // kelas LTS1 (index 3) selesai di JB3. markClassComplete()
        // mengembalikan false kalau sudah pernah ditandai — tak toast ulang.
        // 2026-10-28: kini juga wajib DISC/SSD/Karunia + post-test LTS1 lulus (lts1TryComplete).
        const justCompleted = await lts1TryComplete();
        if (!justCompleted) toast(`${sec.title} disimpan.`);
        show("home");
      } catch (err) { toast("Gagal simpan: " + (err.message || err)); }
      return;
    }
  });

  document.addEventListener("input", e => {
    const rm = e.target.closest("[data-rmfield]");
    if (rm) { state.draft.roadmapData[rm.dataset.rmfield] = rm.value; draftTouch("roadmapData"); rmAutosave(rm.dataset.rmfield); }
    if (e.target.closest("[data-accsearch]")) { state.accQuery = e.target.value; const l = el("accList"); if (l) l.innerHTML = accListHTML(e.target.dataset.accsearch); }
    if (e.target.closest("[data-abssearch]")) { state.absQuery = e.target.value; const l = el("absList"); if (l) l.innerHTML = absListHTML(); }
    if (e.target.id === "rsSearch") { state.resultsQuery = e.target.value; const l = el("rsList"); if (l) l.innerHTML = resultsListHTML(); }
    if (e.target.closest("[data-lwmin]")) state.draft.lwMinistry = e.target.value;
    if (e.target.closest("[data-lwq]")) { const q = e.target.value.trim().toLowerCase(), box = e.target.nextElementSibling;
      if (box) box.querySelectorAll("[data-lwname]").forEach(b => { b.hidden = !!q && !b.dataset.lwname.includes(q); }); }
  });

  // 2026-10-19: dibuka di lapisan (iframe) JB3 → beri tahu JB3 begitu layar pertama tampil (spinner JB3 tak perlu
  // menunggu foto/huruf selesai dimuat).
  function pingReady() { if (window.parent !== window && !pingReady.done) { pingReady.done = true; try { window.parent.postMessage({ dj:"ready" }, "*"); } catch (e) {} } }
  boot().then(pingReady, pingReady);
})();
